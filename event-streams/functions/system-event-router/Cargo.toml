[package]
name = "system-event-router"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-sns = { workspace = true }
chrono = { workspace = true }
konductor-common = { path = "../../../lib/konductor-common" }
lambda_runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
aws-sdk-dynamodb = { workspace = true, features = ["test-util"] }
aws-sdk-eventbridge = { workspace = true, features = ["test-util"] }
aws-sdk-sesv2 = { workspace = true, features = ["test-util"] }
aws-sdk-sns = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
system-event-notifier = { path = "../system-event-notifier" }
system-event-projector = { path = "../system-event-projector" }

[lints]
workspace = true
