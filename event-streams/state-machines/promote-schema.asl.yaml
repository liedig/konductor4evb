# Promotes a producer schema to the next environment: verifies the target's
# version prefix matches the source, replays the missing versions one at a
# time (committing progress to the promotions table after each), then re-pins
# every affected subscription rule with delivery continuity (widen, drain,
# narrow). Every phase transition commits to the promotions table first; the
# stream consumer turns those commits into lifecycle events.
#
# Input: {promotionId, domain, schemaName, sourceEnvironment,
#         targetEnvironment, requestedVersion}
Comment: >-
  Replays schema versions into the target environment with aligned version
  numbers and re-pins affected subscription rules (widen, drain, narrow).
QueryLanguage: JSONata
StartAt: Plan
TimeoutSeconds: 3600
States:
  # Verifies the prefix: for each target version 1..k the target record must
  # exist with the source's content hash and a non-schema-admin writer.
  # k = 0 (no schema yet) and in-sync (k = requested) are both fine.
  Plan:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke"
    Arguments:
      FunctionName: "${StepsFunctionArn}"
      Payload: "{% $merge([$states.input, {'action': 'plan'}]) %}"
    Retry:
      - ErrorEquals:
          - Lambda.ClientExecutionTimeoutException
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Assign:
      plan: "{% $states.result.Payload %}"
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: CheckPlan

  CheckPlan:
    Type: Choice
    Choices:
      - Condition: "{% $plan.ok %}"
        Next: MarkReplaying
    Default: MarkFailedDiverged

  MarkFailedDiverged:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :failed, reason = :reason, failedVersion = :fv, updatedAt = :now"
      ConditionExpression: "promotionId = :pid"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":failed": {S: "FAILED"}
        ":reason": {S: "DIVERGED"}
        ":fv": {N: "{% $string($plan.divergedAt) %}"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    End: true

  MarkReplaying:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :replaying, fromVersion = :from, lastWrittenVersion = :from, updatedAt = :now"
      ConditionExpression: "promotionId = :pid AND #phase = :validating"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":replaying": {S: "REPLAYING"}
        ":validating": {S: "VALIDATING"}
        ":from": {N: "{% $string($plan.fromVersion) %}"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: Widen

  # One conditional UpdateItem sets floor/target/generation/drainUntil on the
  # REPIN item; the derived pattern is then applied to every affected entry.
  Widen:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke"
    Arguments:
      FunctionName: "${StepsFunctionArn}"
      Payload:
        action: "widen"
        promotionId: "{% $states.input.promotionId %}"
        domain: "{% $states.input.domain %}"
        schemaName: "{% $states.input.schemaName %}"
        environment: "{% $states.input.targetEnvironment %}"
        through: "{% $states.input.requestedVersion %}"
        drainSeconds: "{% $number('${DrainSeconds}') %}"
    Retry:
      - ErrorEquals:
          - Lambda.ClientExecutionTimeoutException
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Assign:
      widen: "{% $states.result.Payload %}"
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: ApplyWidenedPattern

  ApplyWidenedPattern:
    Type: Map
    MaxConcurrency: 10
    Items: "{% $widen.entries %}"
    ItemSelector:
      mode: "repin"
      commitPin: false
      versions: "{% $widen.pattern %}"
      producerDomain: "{% $states.context.Map.Item.Value.producerDomain %}"
      consumerDomain: "{% $states.context.Map.Item.Value.consumerDomain %}"
      source: "{% $states.context.Map.Item.Value.source %}"
      detailType: "{% $states.context.Map.Item.Value.detailType %}"
      schemaName: "{% $states.context.Map.Item.Value.schemaName %}"
      ruleName: "{% $states.context.Map.Item.Value.ruleName %}"
      environment: "{% $states.context.Map.Item.Value.environment %}"
      enabled: "{% $states.context.Map.Item.Value.enabled %}"
    ItemProcessor:
      ProcessorConfig:
        Mode: INLINE
      StartAt: RepinWidened
      States:
        RepinWidened:
          Type: Task
          Resource: "arn:aws:states:::lambda:invoke"
          Arguments:
            FunctionName: "${MaterializeEnvFunctionArn}"
            Payload: "{% $states.input %}"
          Retry:
            - ErrorEquals:
                - Lambda.ClientExecutionTimeoutException
                - Lambda.ServiceException
                - Lambda.AWSLambdaException
                - Lambda.SdkClientException
                - Lambda.TooManyRequestsException
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Output: "{% $states.result.Payload %}"
          Catch:
            - ErrorEquals: [States.ALL]
              Output:
                status: "FAILED"
                ruleName: "{% $states.input.ruleName %}"
              Next: RepinWidenedFailed
          End: true
        RepinWidenedFailed:
          Type: Pass
          End: true
    Assign:
      widenedResults: "{% $states.result %}"
    Output: "{% $states.input %}"
    Next: ReplayLoop

  # Sequential: version N+1's replay pre-check requires version N to be the
  # target's latest. Each iteration commits lastWrittenVersion to the head
  # item after its write.
  ReplayLoop:
    Type: Map
    MaxConcurrency: 1
    Items: "{% $plan.versions %}"
    ItemSelector:
      action: "replay"
      promotionId: "{% $states.input.promotionId %}"
      domain: "{% $states.input.domain %}"
      schemaName: "{% $states.input.schemaName %}"
      sourceEnvironment: "{% $states.input.sourceEnvironment %}"
      targetEnvironment: "{% $states.input.targetEnvironment %}"
      version: "{% $states.context.Map.Item.Value %}"
    ItemProcessor:
      ProcessorConfig:
        Mode: INLINE
      StartAt: ReplayVersion
      States:
        ReplayVersion:
          Type: Task
          Resource: "arn:aws:states:::lambda:invoke"
          Arguments:
            FunctionName: "${StepsFunctionArn}"
            Payload: "{% $states.input %}"
          Retry:
            - ErrorEquals:
                - Lambda.ClientExecutionTimeoutException
                - Lambda.ServiceException
                - Lambda.AWSLambdaException
                - Lambda.SdkClientException
                - Lambda.TooManyRequestsException
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Output:
            status: "REPLAYED"
            version: "{% $states.input.version %}"
            wrote: "{% $states.result.Payload.wrote %}"
          Catch:
            - ErrorEquals: [States.ALL]
              Output:
                status: "FAILED"
                version: "{% $states.input.version %}"
              Next: ReplayVersionFailed
          End: true
        ReplayVersionFailed:
          Type: Pass
          End: true
    Assign:
      replayResults: "{% $states.result %}"
    Output: "{% $states.input %}"
    Next: TallyReplay

  # Replay writes form a leading prefix: version N+1 cannot land unless N
  # did, so fromVersion + successes is the highest written version even on
  # partial failure.
  TallyReplay:
    Type: Pass
    Assign:
      replayFailures: "{% [$replayResults[status='FAILED'].version] %}"
      lastWritten: "{% $plan.fromVersion + $count($replayResults[status='REPLAYED']) %}"
    Output: "{% $states.input %}"
    Next: EmitIfWritten

  EmitIfWritten:
    Type: Choice
    Choices:
      - Condition: "{% $lastWritten > 0 %}"
        Next: EmitVersionPublished
    Default: MarkDraining

  # Same payload shape as schema-admin's publish signal; the subscription
  # extender uses it to promote AWAITING_PROMOTION entries.
  EmitVersionPublished:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: "konductor.schema-management"
          DetailType: "SchemaVersionPublished"
          Detail: "{% $string({'producerDomain': $states.input.domain, 'schemaName': $plan.fullSchemaName, 'environment': $states.input.targetEnvironment, 'version': $lastWritten, 'publishedAt': $states.context.State.EnteredTime}) %}"
    Retry:
      - ErrorEquals: [States.ALL]
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: MarkDraining

  MarkDraining:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :repinning, drainUntil = :drain, updatedAt = :now"
      ConditionExpression: "promotionId = :pid"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":repinning": {S: "REPINNING"}
        ":drain": {S: "{% $widen.drainUntil %}"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: DrainWait

  # The runtime accepts any event whose version the widened pattern admits;
  # draining outlasts the producer flush SLA before the pattern narrows.
  DrainWait:
    Type: Wait
    Seconds: "{% $widen.drainSeconds %}"
    Next: Narrow

  Narrow:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke"
    Arguments:
      FunctionName: "${StepsFunctionArn}"
      Payload:
        action: "narrow"
        promotionId: "{% $states.input.promotionId %}"
        domain: "{% $states.input.domain %}"
        schemaName: "{% $states.input.schemaName %}"
        environment: "{% $states.input.targetEnvironment %}"
        generation: "{% $widen.generation %}"
        to: "{% $lastWritten > 0 ? $lastWritten : $widen.oldPin %}"
    Retry:
      - ErrorEquals:
          - Lambda.ClientExecutionTimeoutException
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Assign:
      narrow: "{% $states.result.Payload %}"
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals: [States.ALL]
        Output: "{% $states.input %}"
        Next: RouteFailure
    Next: ApplyNarrowedPattern

  ApplyNarrowedPattern:
    Type: Map
    MaxConcurrency: 10
    Items: "{% $narrow.entries %}"
    ItemSelector:
      mode: "repin"
      commitPin: true
      versions: "{% $narrow.pattern %}"
      producerDomain: "{% $states.context.Map.Item.Value.producerDomain %}"
      consumerDomain: "{% $states.context.Map.Item.Value.consumerDomain %}"
      source: "{% $states.context.Map.Item.Value.source %}"
      detailType: "{% $states.context.Map.Item.Value.detailType %}"
      schemaName: "{% $states.context.Map.Item.Value.schemaName %}"
      ruleName: "{% $states.context.Map.Item.Value.ruleName %}"
      environment: "{% $states.context.Map.Item.Value.environment %}"
      enabled: "{% $states.context.Map.Item.Value.enabled %}"
    ItemProcessor:
      ProcessorConfig:
        Mode: INLINE
      StartAt: RepinNarrowed
      States:
        RepinNarrowed:
          Type: Task
          Resource: "arn:aws:states:::lambda:invoke"
          Arguments:
            FunctionName: "${MaterializeEnvFunctionArn}"
            Payload: "{% $states.input %}"
          Retry:
            - ErrorEquals:
                - Lambda.ClientExecutionTimeoutException
                - Lambda.ServiceException
                - Lambda.AWSLambdaException
                - Lambda.SdkClientException
                - Lambda.TooManyRequestsException
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Output: "{% $states.result.Payload %}"
          Catch:
            - ErrorEquals: [States.ALL]
              Output:
                status: "FAILED"
                ruleName: "{% $states.input.ruleName %}"
              Next: RepinNarrowedFailed
          End: true
        RepinNarrowedFailed:
          Type: Pass
          End: true
    Assign:
      narrowedResults: "{% $states.result %}"
    Output: "{% $states.input %}"
    Next: ChooseTerminal

  ChooseTerminal:
    Type: Choice
    Choices:
      - Condition: "{% $count($replayFailures) > 0 %}"
        Next: MarkFailedReplay
    Default: MarkCompleted

  MarkCompleted:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :completed, repinMatched = :matched, repinRepinned = :repinned, repinFailed = :failed, updatedAt = :now"
      ConditionExpression: "promotionId = :pid"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":completed": {S: "COMPLETED"}
        ":matched": {N: "{% $string($count($narrow.entries)) %}"}
        ":repinned": {N: "{% $string($count($narrowedResults[status='REPINNED'])) %}"}
        ":failed": {N: "{% $string($count($narrowedResults[status='FAILED'])) %}"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    End: true

  # Failures land in one of two terminal updates: REPLAY_FAILED when the
  # replay produced a partial prefix (failedVersion known), unexpected
  # otherwise.
  RouteFailure:
    Type: Choice
    Choices:
      - Condition: "{% $exists($replayFailures) and $count($replayFailures) > 0 %}"
        Next: MarkFailedReplay
    Default: MarkFailedUnexpected

  MarkFailedReplay:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :failed, reason = :reason, failedVersion = :fv, updatedAt = :now"
      ConditionExpression: "promotionId = :pid"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":failed": {S: "FAILED"}
        ":reason": {S: "REPLAY_FAILED"}
        ":fv": {N: "{% $string($replayFailures[0]) %}"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    End: true

  MarkFailedUnexpected:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${PromotionsTable}"
      Key:
        pk:
          S: "{% $states.input.domain & '#' & $states.input.schemaName & '#' & $states.input.targetEnvironment %}"
        sk:
          S: "PROMOTION"
      UpdateExpression: "SET #phase = :failed, reason = :reason, updatedAt = :now"
      ConditionExpression: "promotionId = :pid"
      ExpressionAttributeNames:
        "#phase": "phase"
      ExpressionAttributeValues:
        ":failed": {S: "FAILED"}
        ":reason": {S: "REPLAY_FAILED"}
        ":now": {S: "{% $states.context.State.EnteredTime %}"}
        ":pid": {S: "{% $states.input.promotionId %}"}
    End: true
