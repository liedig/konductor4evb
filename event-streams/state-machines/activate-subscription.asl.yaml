Comment: >-
  Activates an event stream: each producer environment materializes
  independently through the materialize-subscription-env function. Where the
  schema exists, the rule, consumer-bus target, and zero-events alarm are
  created with that environment's latest version pinned; where it does not,
  the environment is recorded AWAITING_PROMOTION. There is no
  cross-environment compensation: the stream becomes ACTIVE when at least
  one environment materializes, and FAILED when the schema exists in no
  producer environment (almost always a caller typo) or every
  materialization fails.
QueryLanguage: JSONata
StartAt: MaterializeEnvironments
States:

  MaterializeEnvironments:
    Type: Map
    MaxConcurrency: 0
    Items: "{% $states.input.environments %}"
    ItemSelector:
      environment: "{% $states.context.Map.Item.Value.name %}"
      enabled: "{% $states.context.Map.Item.Value.enabled %}"
      producerDomain: "{% $states.input.producerDomain %}"
      consumerDomain: "{% $states.input.consumerDomain %}"
      consumerAccountId: "{% $states.input.consumerAccountId %}"
      source: "{% $states.input.source %}"
      detailType: "{% $states.input.detailType %}"
      schemaName: "{% $states.input.schemaName %}"
      ruleName: "{% $states.input.ruleName %}"
    ItemProcessor:
      ProcessorConfig:
        Mode: INLINE
      StartAt: MaterializeEnv
      States:
        # The function records its own per-env record entry (ACTIVE with the
        # pinned version, AWAITING_PROMOTION when the schema is absent, or
        # per-env FAILED with the cause) and returns the outcome; only an
        # invocation-level failure reaches the Catch.
        MaterializeEnv:
          Type: Task
          Resource: "arn:aws:states:::lambda:invoke"
          Arguments:
            FunctionName: "${MaterializeEnvFunctionArn}"
            Payload: "{% $states.input %}"
          Retry:
            - ErrorEquals:
                - Lambda.ClientExecutionTimeoutException
                - Lambda.ServiceException
                - Lambda.AWSLambdaException
                - Lambda.SdkClientException
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Output: "{% $parse($states.result.Payload) %}"
          End: true
          Catch:
            - ErrorEquals:
                - States.ALL
              Output:
                status: FAILED
                environment: "{% $states.input.environment %}"
                enabled: "{% $states.input.enabled %}"
                ruleName: "{% $states.input.ruleName %}"
                error:
                  failedStep: MaterializeInvocation
                  cause: "{% $states.errorOutput.Cause %}"
              Next: MaterializationInvokeFailed

        MaterializationInvokeFailed:
          Type: Pass
          End: true

    Assign:
      envResults: "{% $states.result %}"
      succeededResults: "{% [$states.result[status='SUCCEEDED']] %}"
      failedResults: "{% [$states.result[status='FAILED']] %}"
    Output: "{% $states.input %}"
    Next: CheckAnyMaterialized

  # Per-env entries are already recorded by the function; the top-level
  # update touches only status/errorDetail/updatedAt and never replaces
  # the environments map.
  CheckAnyMaterialized:
    Type: Choice
    Choices:
      - Condition: "{% $count($succeededResults) > 0 %}"
        Next: UpdateStreamActive
    Default: UpdateStreamFailed

  UpdateStreamActive:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${EventStreamsTable}"
      Key:
        producerDomain:
          S: "{% $states.input.producerDomain %}"
        schemaConsumer:
          S: "{% $states.input.schemaName & '#' & $states.input.consumerDomain %}"
      UpdateExpression: "SET #s = :status, updatedAt = :now REMOVE errorDetail"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: ACTIVE
        ":now":
          S: "{% $states.context.State.EnteredTime %}"
    Output: "{% $states.input %}"
    Next: EmitSubscriptionActivated

  EmitSubscriptionActivated:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.event-streams
          DetailType: SubscriptionActivated
          Detail: >-
            {% $string({
              "subscriptionId": $states.input.consumerDomain & '.' & $states.input.producerDomain & '.' & $states.input.detailType,
              "producerDomain": $states.input.producerDomain,
              "consumerDomain": $states.input.consumerDomain,
              "schemaName": $states.input.schemaName,
              "environments": $merge($envResults.{ $.environment: { 'status': $.status, 'pinnedVersion': $.pinnedVersion, 'enabled': $.enabled, 'ruleArn': $.ruleArn, 'error': $.error } }),
              "workflowExecutionId": $states.context.Execution.Id,
              "activatedAt": $states.context.State.EnteredTime
            }) %}
    End: true

  UpdateStreamFailed:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${EventStreamsTable}"
      Key:
        producerDomain:
          S: "{% $states.input.producerDomain %}"
        schemaConsumer:
          S: "{% $states.input.schemaName & '#' & $states.input.consumerDomain %}"
      UpdateExpression: "SET #s = :status, errorDetail = :err, updatedAt = :now"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: FAILED
        ":err":
          S: >-
            {% $count($failedResults) > 0
              ? $failedResults[0].environment & '/' & $failedResults[0].error.failedStep & ': ' & $failedResults[0].error.cause
              : 'schema ' & $states.input.schemaName & ' not found in any environment of producer ' & $states.input.producerDomain %}
        ":now":
          S: "{% $states.context.State.EnteredTime %}"
    Output: "{% $states.input %}"
    Next: EmitSubscriptionActivationFailed

  EmitSubscriptionActivationFailed:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.event-streams
          DetailType: SubscriptionActivationFailed
          Detail: >-
            {% $string({
              "subscriptionId": $states.input.consumerDomain & '.' & $states.input.producerDomain & '.' & $states.input.detailType,
              "producerDomain": $states.input.producerDomain,
              "consumerDomain": $states.input.consumerDomain,
              "schemaName": $states.input.schemaName,
              "failedEnvironment": $count($failedResults) > 0 ? $failedResults[0].environment : null,
              "failedStep": $count($failedResults) > 0 ? $failedResults[0].error.failedStep : 'PresenceCheck',
              "errorMessage": $count($failedResults) > 0
                ? $failedResults[0].error.cause
                : 'schema ' & $states.input.schemaName & ' not found in any environment of producer ' & $states.input.producerDomain,
              "environments": $merge($envResults.{ $.environment: { 'status': $.status, 'error': $.error } }),
              "workflowExecutionId": $states.context.Execution.Id,
              "failedAt": $states.context.State.EnteredTime
            }) %}
    End: true
