Comment: >-
  Idempotent per-environment teardown. Not-found responses and steps whose
  resource identifier is absent from the input are silent no-ops; only genuine
  failures land in compensationErrors, so a non-empty array means resources
  were actually left behind. Never hard-fails. No step is needed for the
  app-bus platform-delivery resource policy — it is bus-scoped and deleted
  with the bus.
QueryLanguage: JSONata
StartAt: Start
States:

  Start:
    Type: Pass
    Assign:
      compensationErrors: "{% [] %}"
    Output: "{% $states.input %}"
    Next: CheckIntegrationDlqPresent

  CheckIntegrationDlqPresent:
    Type: Choice
    Default: DeleteAppEventBus
    Choices:
      - Condition: "{% $exists($states.input.resourceArns.integrationDlqArn) %}"
        Next: DeleteIntegrationDlq
    Output: "{% $states.input %}"

  DeleteIntegrationDlq:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:sqs:deleteQueue"
    Retry:
      - ErrorEquals:
          - Sqs.SqsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      QueueUrl: "{% $states.input.resourceArns.integrationDlqArn %}"
    Credentials:
      RoleArn: "{% 'arn:aws:iam::' & $states.input.ownerAccountId & ':role/${Organization}-konductor-trust-role' %}"
    Output: "{% $states.input %}"
    Next: DeleteAppEventBus
    Catch:
      - ErrorEquals:
          - Sqs.QueueDoesNotExistException
          - Sqs.QueueDoesNotExist
        Next: DeleteAppEventBus
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: DeleteAppEventBus
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete integration DLQ: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeleteAppEventBus:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:eventbridge:deleteEventBus"
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
          - EventBridge.EventBridgeException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      Name: "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-event-bus' %}"
    Credentials:
      RoleArn: "{% 'arn:aws:iam::' & $states.input.ownerAccountId & ':role/${Organization}-konductor-trust-role' %}"
    Output: "{% $states.input %}"
    Next: DeleteDlqDepthAlarm
    Catch:
      - ErrorEquals:
          - EventBridge.ResourceNotFoundException
        Next: DeleteDlqDepthAlarm
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: DeleteDlqDepthAlarm
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete app event bus: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeleteDlqDepthAlarm:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:cloudwatch:deleteAlarms"
    Retry:
      - ErrorEquals:
          - CloudWatch.Throttling
          - CloudWatch.ThrottlingException
          - CloudWatch.LimitExceededFault
          - CloudWatch.InternalServiceFault
          - CloudWatch.CloudWatchException
        IntervalSeconds: 2
        MaxAttempts: 5
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      AlarmNames:
        - "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-dlq-depth-alarm' %}"
    Output: "{% $states.input %}"
    Next: DeleteFailedInvocAlarm
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: DeleteFailedInvocAlarm
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete DLQ depth alarm: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeleteFailedInvocAlarm:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:cloudwatch:deleteAlarms"
    Retry:
      - ErrorEquals:
          - CloudWatch.Throttling
          - CloudWatch.ThrottlingException
          - CloudWatch.LimitExceededFault
          - CloudWatch.InternalServiceFault
          - CloudWatch.CloudWatchException
        IntervalSeconds: 2
        MaxAttempts: 5
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      AlarmNames:
        - "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-failed-invocations-alarm' %}"
    Output: "{% $states.input %}"
    Next: DeleteDashboard
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: DeleteDashboard
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete failed invocations alarm: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeleteDashboard:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:cloudwatch:deleteDashboards"
    Retry:
      - ErrorEquals:
          - CloudWatch.Throttling
          - CloudWatch.ThrottlingException
          - CloudWatch.LimitExceededFault
          - CloudWatch.InternalServiceFault
          - CloudWatch.CloudWatchException
        IntervalSeconds: 2
        MaxAttempts: 5
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      DashboardNames:
        - "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-dashboard' %}"
    Output: "{% $states.input %}"
    Next: CheckSubscriptionDlqPresent
    Catch:
      - ErrorEquals:
          - CloudWatch.ResourceNotFound
          - CloudWatch.ResourceNotFoundException
        Next: CheckSubscriptionDlqPresent
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: CheckSubscriptionDlqPresent
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete dashboard: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  CheckSubscriptionDlqPresent:
    Type: Choice
    Default: DeleteSchemaRegistry
    Choices:
      - Condition: "{% $exists($states.input.resourceArns.subscriptionDlqArn) %}"
        Next: DeleteSubscriptionDlq
    Output: "{% $states.input %}"

  DeleteSubscriptionDlq:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:sqs:deleteQueue"
    Retry:
      - ErrorEquals:
          - Sqs.SqsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      QueueUrl: "{% $states.input.resourceArns.subscriptionDlqArn %}"
    Output: "{% $states.input %}"
    Next: DeleteSchemaRegistry
    Catch:
      - ErrorEquals:
          - Sqs.QueueDoesNotExistException
          - Sqs.QueueDoesNotExist
        Next: DeleteSchemaRegistry
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: DeleteSchemaRegistry
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete subscription DLQ: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeleteSchemaRegistry:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:schemas:deleteRegistry"
    Retry:
      - ErrorEquals:
          - Schemas.TooManyRequestsException
          - Schemas.InternalServerErrorException
          - Schemas.ServiceUnavailableException
        IntervalSeconds: 2
        MaxAttempts: 5
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      RegistryName: "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-schema-registry' %}"
    Output: "{% $states.input %}"
    Next: DeletePlatformEventBus
    Catch:
      - ErrorEquals:
          - Schemas.NotFoundException
          - Schemas.NotFound
        Next: DeletePlatformEventBus
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: DeletePlatformEventBus
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete schema registry: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  DeletePlatformEventBus:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:eventbridge:deleteEventBus"
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
          - EventBridge.EventBridgeException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      Name: "{% '${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-event-bus' %}"
    Output: "{% $states.input %}"
    Next: Done
    Catch:
      - ErrorEquals:
          - EventBridge.ResourceNotFoundException
        Next: Done
        Output: "{% $states.input %}"
      - ErrorEquals:
          - States.ALL
        Next: Done
        Assign:
          compensationErrors: "{% $append($compensationErrors, 'Failed to delete platform event bus: ' & $states.errorOutput.Cause) %}"
        Output: "{% $states.input %}"

  Done:
    Type: Pass
    Output:
      environment: "{% $states.input.environment %}"
      compensationErrors: "{% $compensationErrors %}"
    End: true
