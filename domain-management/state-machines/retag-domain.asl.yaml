Comment: Converges the cost-center tag on every provisioned resource after a committed costCenter change. Triggered by an EventBridge rule on UpdateDomainSucceeded with costCenter in changedFields. The domain record is the tag source of truth; every tag call is an upsert, so duplicate executions from event redelivery converge to the same state.
QueryLanguage: JSONata
StartAt: LoadDomain
States:

  LoadDomain:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:dynamodb:getItem"
    Retry:
      - ErrorEquals:
          - DynamoDb.ProvisionedThroughputExceededException
          - DynamoDb.ThrottlingException
          - DynamoDb.InternalServerError
          - DynamoDb.RequestLimitExceeded
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      TableName: "${DomainsTable}"
      ConsistentRead: true
      Key:
        domainName:
          S: "{% $states.input.detail.domainName %}"
    Assign:
      domain: "{% $states.result.Item %}"
    Output: "{% $states.input %}"
    Next: DomainPresent
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: EmitRetagFailed
        Output: "{% $merge([$states.input, { 'failure': { 'failedEnvironment': null, 'failedStep': 'LoadDomain', 'errorCode': $states.errorOutput.Error, 'errorMessage': $states.errorOutput.Cause } }]) %}"

  DomainPresent:
    Type: Choice
    Choices:
      - Condition: "{% $exists($domain) %}"
        Next: TagNamespaceParameter
    Default: DomainMissing

  DomainMissing:
    Type: Pass
    Output: "{% $merge([$states.input, { 'failure': { 'failedEnvironment': null, 'failedStep': 'LoadDomain', 'errorCode': 'DomainNotFound', 'errorMessage': 'domain record not found' } }]) %}"
    Next: EmitRetagFailed

  TagNamespaceParameter:
    Type: Task
    Resource: "arn:aws:states:::aws-sdk:ssm:addTagsToResource"
    Retry:
      - ErrorEquals:
          - Ssm.TooManyUpdatesException
          - Ssm.InternalServerError
          - Ssm.SsmException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      ResourceType: Parameter
      ResourceId: "{% '/namespace/' & $states.input.detail.domainName %}"
      Tags: |-
        {% [
          {"Key": "konductor:managed-by", "Value": "konductor"},
          {"Key": "konductor:domain", "Value": $states.input.detail.domainName},
          {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.detail.domainName},
          {"Key": "cost-center", "Value": $domain.costCenter.S}
        ] %}
    Output: "{% $states.input %}"
    Next: RetagEnvironments
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: EmitRetagFailed
        Output: "{% $merge([$states.input, { 'failure': { 'failedEnvironment': null, 'failedStep': 'TagNamespaceParameter', 'errorCode': $states.errorOutput.Error, 'errorMessage': $states.errorOutput.Cause } }]) %}"

  # Iterates the environments recorded as provisioned (keys of resourceArns).
  # Iterations fail soft: a failed step records the error and the map moves on
  # so healthy environments still converge; RetagOutcome reports the first
  # failure. Remaining environments converge on the next event or DLQ redrive.
  RetagEnvironments:
    Type: Map
    MaxConcurrency: 0
    Items: "{% $keys($domain.resourceArns.M) %}"
    # Credentials resolve per environment from the record's sparse
    # environmentAccounts (absent on pre-feature records, so the lookup falls
    # back to the default account). Iteration stays per environment: every
    # tag target is an environment-scoped resource from resourceArns, so a
    # shared account is never tagged twice for the same resource — the
    # account only scopes the trust-role credentials.
    ItemSelector:
      environment: "{% $states.context.Map.Item.Value %}"
      domainName: "{% $states.input.detail.domainName %}"
      accountId: "{% $lookup($domain.environmentAccounts.M, $states.context.Map.Item.Value).S ? $lookup($domain.environmentAccounts.M, $states.context.Map.Item.Value).S : $domain.ownerAccountId.S %}"
      costCenter: "{% $domain.costCenter.S %}"
      resourceArns: "{% $lookup($domain.resourceArns.M, $states.context.Map.Item.Value).M %}"
    ItemProcessor:
      ProcessorConfig:
        Mode: INLINE
      StartAt: TagPlatformEventBus
      States:

        TagPlatformEventBus:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:eventbridge:tagResource"
          Retry:
            - ErrorEquals:
                - EventBridge.ThrottlingException
                - EventBridge.InternalException
                - EventBridge.EventBridgeException
              IntervalSeconds: 1
              MaxAttempts: 3
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceARN: "{% $states.input.resourceArns.platformEventBusArn.S %}"
            Tags: |-
              {% [
                {"Key": "konductor:managed-by", "Value": "konductor"},
                {"Key": "konductor:domain", "Value": $states.input.domainName},
                {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.domainName},
                {"Key": "konductor:environment", "Value": $states.input.environment},
                {"Key": "cost-center", "Value": $states.input.costCenter}
              ] %}
          Output: "{% $states.input %}"
          Next: TagSchemaRegistry
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagPlatformEventBus', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        TagSchemaRegistry:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:schemas:tagResource"
          Retry:
            - ErrorEquals:
                - Schemas.TooManyRequestsException
                - Schemas.InternalServerErrorException
                - Schemas.ServiceUnavailableException
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceArn: "{% $states.input.resourceArns.schemaRegistryArn.S %}"
            Tags: |-
              {% $merge([
                {"konductor:managed-by": "konductor"},
                {"konductor:domain": $states.input.domainName},
                {"konductor:namespace": "${Organization}" & "-" & $states.input.domainName},
                {"konductor:environment": $states.input.environment},
                {"cost-center": $states.input.costCenter}
              ]) %}
          Output: "{% $states.input %}"
          Next: TagSubscriptionDlq
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagSchemaRegistry', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        # The record stores queue URLs under the *DlqArn keys (provisioning
        # records $createQueue.QueueUrl there); sqs:tagQueue takes QueueUrl.
        TagSubscriptionDlq:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:sqs:tagQueue"
          Retry:
            - ErrorEquals:
                - Sqs.SqsException
              IntervalSeconds: 1
              MaxAttempts: 3
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            QueueUrl: "{% $states.input.resourceArns.subscriptionDlqArn.S %}"
            Tags: |-
              {% $merge([
                {"konductor:managed-by": "konductor"},
                {"konductor:domain": $states.input.domainName},
                {"konductor:namespace": "${Organization}" & "-" & $states.input.domainName},
                {"konductor:environment": $states.input.environment},
                {"cost-center": $states.input.costCenter}
              ]) %}
          Output: "{% $states.input %}"
          Next: TagDashboard
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagSubscriptionDlq', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        TagDashboard:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:cloudwatch:tagResource"
          Retry:
            - ErrorEquals:
                - CloudWatch.Throttling
                - CloudWatch.ThrottlingException
                - CloudWatch.InternalServiceFault
                - CloudWatch.CloudWatchException
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceARN: "{% $states.input.resourceArns.dashboardArn.S %}"
            Tags: |-
              {% [
                {"Key": "konductor:managed-by", "Value": "konductor"},
                {"Key": "konductor:domain", "Value": $states.input.domainName},
                {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.domainName},
                {"Key": "konductor:environment", "Value": $states.input.environment},
                {"Key": "cost-center", "Value": $states.input.costCenter}
              ] %}
          Output: "{% $states.input %}"
          Next: TagFailedInvocationsAlarm
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagDashboard', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        # Alarm ARNs are not in the record; they are reconstructed from the
        # provisioning naming convention. If the convention changes, update
        # both provision-env.asl.yaml and these two states together.
        TagFailedInvocationsAlarm:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:cloudwatch:tagResource"
          Retry:
            - ErrorEquals:
                - CloudWatch.Throttling
                - CloudWatch.ThrottlingException
                - CloudWatch.InternalServiceFault
                - CloudWatch.CloudWatchException
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceARN: "{% 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-failed-invocations-alarm' %}"
            Tags: |-
              {% [
                {"Key": "konductor:managed-by", "Value": "konductor"},
                {"Key": "konductor:domain", "Value": $states.input.domainName},
                {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.domainName},
                {"Key": "konductor:environment", "Value": $states.input.environment},
                {"Key": "cost-center", "Value": $states.input.costCenter}
              ] %}
          Output: "{% $states.input %}"
          Next: TagDlqDepthAlarm
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagFailedInvocationsAlarm', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        TagDlqDepthAlarm:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:cloudwatch:tagResource"
          Retry:
            - ErrorEquals:
                - CloudWatch.Throttling
                - CloudWatch.ThrottlingException
                - CloudWatch.InternalServiceFault
                - CloudWatch.CloudWatchException
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceARN: "{% 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}' & '-' & $states.input.environment & '-' & $states.input.domainName & '-dlq-depth-alarm' %}"
            Tags: |-
              {% [
                {"Key": "konductor:managed-by", "Value": "konductor"},
                {"Key": "konductor:domain", "Value": $states.input.domainName},
                {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.domainName},
                {"Key": "konductor:environment", "Value": $states.input.environment},
                {"Key": "cost-center", "Value": $states.input.costCenter}
              ] %}
          Output: "{% $states.input %}"
          Next: TagAppEventBus
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagDlqDepthAlarm', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        TagAppEventBus:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:eventbridge:tagResource"
          Retry:
            - ErrorEquals:
                - EventBridge.ThrottlingException
                - EventBridge.InternalException
                - EventBridge.EventBridgeException
              IntervalSeconds: 1
              MaxAttempts: 3
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            ResourceARN: "{% $states.input.resourceArns.appEventBusArn.S %}"
            Tags: |-
              {% [
                {"Key": "konductor:managed-by", "Value": "konductor"},
                {"Key": "konductor:domain", "Value": $states.input.domainName},
                {"Key": "konductor:namespace", "Value": "${Organization}" & "-" & $states.input.domainName},
                {"Key": "konductor:environment", "Value": $states.input.environment},
                {"Key": "cost-center", "Value": $states.input.costCenter}
              ] %}
          Credentials:
            RoleArn: "{% 'arn:aws:iam::' & $states.input.accountId & ':role/${Organization}-konductor-trust-role' %}"
          Output: "{% $states.input %}"
          Next: TagIntegrationDlq
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagAppEventBus', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        TagIntegrationDlq:
          Type: Task
          Resource: "arn:aws:states:::aws-sdk:sqs:tagQueue"
          Retry:
            - ErrorEquals:
                - Sqs.SqsException
              IntervalSeconds: 1
              MaxAttempts: 3
              BackoffRate: 2.0
              JitterStrategy: FULL
          Arguments:
            QueueUrl: "{% $states.input.resourceArns.integrationDlqArn.S %}"
            Tags: |-
              {% $merge([
                {"konductor:managed-by": "konductor"},
                {"konductor:domain": $states.input.domainName},
                {"konductor:namespace": "${Organization}" & "-" & $states.input.domainName},
                {"konductor:environment": $states.input.environment},
                {"cost-center": $states.input.costCenter}
              ]) %}
          Credentials:
            RoleArn: "{% 'arn:aws:iam::' & $states.input.accountId & ':role/${Organization}-konductor-trust-role' %}"
          Output: "{% $states.input %}"
          Next: EnvRetagSucceeded
          Catch:
            - ErrorEquals:
                - States.ALL
              Next: EnvRetagFailed
              Output: "{% $merge([$states.input, { 'error': { 'step': 'TagIntegrationDlq', 'code': $states.errorOutput.Error, 'message': $states.errorOutput.Cause } }]) %}"

        EnvRetagSucceeded:
          Type: Pass
          Output:
            status: SUCCEEDED
            environment: "{% $states.input.environment %}"
          End: true

        EnvRetagFailed:
          Type: Pass
          End: true

    Assign:
      results: "{% $states.result %}"
    Output: "{% $states.input %}"
    Next: RetagOutcome
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: EmitRetagFailed
        Output: "{% $merge([$states.input, { 'failure': { 'failedEnvironment': null, 'failedStep': 'RetagEnvironments', 'errorCode': $states.errorOutput.Error, 'errorMessage': $states.errorOutput.Cause } }]) %}"

  RetagOutcome:
    Type: Choice
    Choices:
      - Condition: "{% $count($results[$exists(error)]) > 0 %}"
        Next: PrepareRetagFailure
    Default: RetagSucceeded

  PrepareRetagFailure:
    Type: Pass
    Output: "{% $merge([$states.input, { 'failure': { 'failedEnvironment': $results[$exists(error)][0].environment, 'failedStep': $results[$exists(error)][0].error.step, 'errorCode': $results[$exists(error)][0].error.code, 'errorMessage': $results[$exists(error)][0].error.message } }]) %}"
    Next: EmitRetagFailed

  RetagSucceeded:
    Type: Succeed

  EmitRetagFailed:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.domain-management
          DetailType: RetagDomainFailed
          Detail:
            domainName: "{% $states.input.detail.domainName %}"
            requestId: "{% $states.input.detail.requestId %}"
            failedEnvironment: "{% $states.input.failure.failedEnvironment %}"
            failedStep: "{% $states.input.failure.failedStep %}"
            errorCode: "{% $states.input.failure.errorCode %}"
            errorMessage: "{% $states.input.failure.errorMessage %}"
    End: true
