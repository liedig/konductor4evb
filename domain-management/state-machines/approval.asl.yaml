Comment: Domain registration approval workflow with human-in-the-loop
QueryLanguage: JSONata
StartAt: CaptureRegistration
States:

  # Assign on a Task applies only when the task succeeds, so capturing the
  # registration on NotifyAndWait would leave $registration unassigned on
  # every Catch path. Capture in a Pass state, which cannot fail.
  CaptureRegistration:
    Type: Pass
    Assign:
      registration: "{% $states.input %}"
    Output: "{% $states.input %}"
    Next: NotifyAndWait

  NotifyAndWait:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke.waitForTaskToken"
    Arguments:
      FunctionName: "${SendApprovalRequestNotificationFunction}"
      Payload:
        taskToken: "{% $states.context.Task.Token %}"
        domainName: "{% $states.input.domainName %}"
        ownerAccountId: "{% $states.input.ownerAccountId %}"
        ownerEmail: "{% $states.input.ownerEmail %}"
        secondaryOwnerEmails: "{% $states.input.secondaryOwnerEmails %}"
        environments: "{% $states.input.environments %}"
    TimeoutSeconds: 604800
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.TooManyRequestsException
          - Lambda.AWSLambdaException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Catch:
      # Human rejection: the decide Lambda reports it via SendTaskFailure
      # with this error name and a JSON cause {approved, decidedBy,
      # justification}.
      - ErrorEquals:
          - RegistrationRejected
        Next: UpdateStatusRejectedFromDecision
      # States.Timeout is not matched by States.TaskFailed and needs its own
      # clause. A 7-day silence is a decision-by-default rejection.
      - ErrorEquals:
          - States.Timeout
        Next: RecordTimeoutRejection
      # Anything else means the approval request never reached a human
      # (e.g. SES identity unverified) — that is not a rejection.
      - ErrorEquals:
          - States.ALL
        Next: UpdateStatusNotificationFailed
        Output:
          errorMessage: "{% $states.errorOutput.Cause ? $states.errorOutput.Cause : $states.errorOutput.Error %}"
    Next: CheckDecision

  CheckDecision:
    Type: Choice
    Choices:
      - Condition: "{% $states.input.approved = true %}"
        Next: FinalizeApproval
    Default: PrepareCallbackRejection

  # Finalizing an approval is a transaction (domain status + owner binding +
  # audit record), which ASL service integrations cannot express — a Lambda
  # owns the commit. Its payload echoes the decide fields downstream states
  # need, so Output unwraps the invoke envelope to that payload.
  FinalizeApproval:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke"
    Arguments:
      FunctionName: "${FinalizeApprovalFunction}"
      Payload:
        domainName: "{% $registration.domainName %}"
        decidedBy: "{% $states.input.decidedBy %}"
        justification: "{% $states.input.justification ? $states.input.justification : '' %}"
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.TooManyRequestsException
          - Lambda.AWSLambdaException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Output: "{% $states.result.Payload %}"
    Next: EmitApprovedEvent

  # The rejection cause is JSON authored by the decide Lambda. $parse on a
  # malformed cause (e.g. a manual SendTaskFailure) raises
  # States.QueryEvaluationError, which a Pass state cannot catch — so the
  # parse lives on this Task and the catch degrades to the unknown-decider
  # fallback rather than failing the execution.
  UpdateStatusRejectedFromDecision:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Assign:
      rejection:
        decidedBy: "{% $parse($states.input.Cause).decidedBy ? $parse($states.input.Cause).decidedBy : 'unknown' %}"
        justification: "{% $parse($states.input.Cause).justification ? $parse($states.input.Cause).justification : '' %}"
    Arguments:
      TableName: "${DomainsTable}"
      Key:
        domainName:
          S: "{% $registration.domainName %}"
      UpdateExpression: "SET #s = :status, decidedBy = :decidedBy, justification = :justification, rejectedAt = :rejectedAt, updatedAt = :updatedAt"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: REJECTED
        ":decidedBy":
          S: "{% $parse($states.input.Cause).decidedBy ? $parse($states.input.Cause).decidedBy : 'unknown' %}"
        ":justification":
          S: "{% $parse($states.input.Cause).justification ? $parse($states.input.Cause).justification : '' %}"
        ":rejectedAt":
          S: "{% $states.context.State.EnteredTime %}"
        ":updatedAt":
          S: "{% $states.context.State.EnteredTime %}"
    Retry:
      - ErrorEquals:
          - DynamoDB.ThrottlingException
          - DynamoDB.ProvisionedThroughputExceededException
          - DynamoDB.InternalServerError
          - DynamoDB.RequestLimitExceeded
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Catch:
      - ErrorEquals:
          - States.QueryEvaluationError
        Next: PrepareUnknownRejection
    Next: EmitRejectedEvent

  PrepareUnknownRejection:
    Type: Pass
    Assign:
      rejection:
        decidedBy: unknown
        justification: ""
    Output: "{% $states.input %}"
    Next: UpdateStatusRejected

  RecordTimeoutRejection:
    Type: Pass
    Assign:
      rejection:
        decidedBy: "system:timeout"
        justification: "Approval request expired after 7 days without a decision"
    Output: "{% $states.input %}"
    Next: UpdateStatusRejected

  # SendTaskSuccess with approved != true (defensive; the decide Lambda
  # reports rejections via SendTaskFailure).
  PrepareCallbackRejection:
    Type: Pass
    Assign:
      rejection:
        decidedBy: "{% $states.input.decidedBy ? $states.input.decidedBy : 'unknown' %}"
        justification: "{% $states.input.justification ? $states.input.justification : '' %}"
    Output: "{% $states.input %}"
    Next: UpdateStatusRejected

  UpdateStatusRejected:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${DomainsTable}"
      Key:
        domainName:
          S: "{% $registration.domainName %}"
      UpdateExpression: "SET #s = :status, decidedBy = :decidedBy, justification = :justification, rejectedAt = :rejectedAt, updatedAt = :updatedAt"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: REJECTED
        ":decidedBy":
          S: "{% $rejection.decidedBy %}"
        ":justification":
          S: "{% $rejection.justification %}"
        ":rejectedAt":
          S: "{% $states.context.State.EnteredTime %}"
        ":updatedAt":
          S: "{% $states.context.State.EnteredTime %}"
    Retry:
      - ErrorEquals:
          - DynamoDB.ThrottlingException
          - DynamoDB.ProvisionedThroughputExceededException
          - DynamoDB.InternalServerError
          - DynamoDB.RequestLimitExceeded
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Next: EmitRejectedEvent

  # Notification infrastructure failed before a human ever saw the request:
  # the domain is NOT rejected. Operator intervention required.
  UpdateStatusNotificationFailed:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Assign:
      notificationError: "{% $states.input.errorMessage %}"
    Arguments:
      TableName: "${DomainsTable}"
      Key:
        domainName:
          S: "{% $registration.domainName %}"
      UpdateExpression: "SET #s = :status, errorDetail = :err, updatedAt = :updatedAt"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: APPROVAL_NOTIFICATION_FAILED
        ":err":
          S: "{% $states.input.errorMessage %}"
        ":updatedAt":
          S: "{% $states.context.State.EnteredTime %}"
    Retry:
      - ErrorEquals:
          - DynamoDB.ThrottlingException
          - DynamoDB.ProvisionedThroughputExceededException
          - DynamoDB.InternalServerError
          - DynamoDB.RequestLimitExceeded
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    Next: EmitApprovalNotificationFailedEvent

  EmitApprovedEvent:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.domain-management
          DetailType: DomainRegistrationApproved
          Detail: >-
            {% $string({
              "domainName": $registration.domainName,
              "ownerAccountId": $registration.ownerAccountId,
              "costCenter": $registration.costCenter,
              "ownerEmail": $registration.ownerEmail,
              "secondaryOwnerEmails": $registration.secondaryOwnerEmails,
              "environments": $registration.environments,
              "approvedBy": $states.input.decidedBy,
              "justification": $states.input.justification ? $states.input.justification : '',
              "approvedAt": $states.context.State.EnteredTime
            }) %}
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    End: true

  EmitRejectedEvent:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.domain-management
          DetailType: DomainRegistrationRejected
          Detail: >-
            {% $string({
              "domainName": $registration.domainName,
              "ownerAccountId": $registration.ownerAccountId,
              "costCenter": $registration.costCenter,
              "ownerEmail": $registration.ownerEmail,
              "secondaryOwnerEmails": $registration.secondaryOwnerEmails,
              "rejectedBy": $rejection.decidedBy,
              "justification": $rejection.justification,
              "rejectedAt": $states.context.State.EnteredTime
            }) %}
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    End: true

  # Operator-facing only: no owner email is triggered by this event — email
  # delivery is exactly the dependency that failed.
  EmitApprovalNotificationFailedEvent:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${KonductorEventBus}"
          Source: konductor.domain-management
          DetailType: DomainApprovalNotificationFailed
          Detail: >-
            {% $string({
              "domainName": $registration.domainName,
              "errorMessage": $notificationError,
              "failedAt": $states.context.State.EnteredTime
            }) %}
    Retry:
      - ErrorEquals:
          - EventBridge.ThrottlingException
          - EventBridge.InternalException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2.0
        JitterStrategy: FULL
    End: true
