Comment: Domain registration approval workflow with human-in-the-loop
QueryLanguage: JSONata
StartAt: NotifyAndWait
States:

  NotifyAndWait:
    Type: Task
    Resource: "arn:aws:states:::lambda:invoke.waitForTaskToken"
    Arguments:
      FunctionName: "${SendApprovalRequestNotificationFunction}"
      Payload:
        taskToken: "{% $states.context.Task.Token %}"
        domainName: "{% $states.input.domainName %}"
        ownerAccountId: "{% $states.input.ownerAccountId %}"
        ownerEmail: "{% $states.input.ownerEmail %}"
        environments: "{% $states.input.environments %}"
    # Capture the registration context before the task token replaces $states.input
    # with the decide payload ({approved, decidedBy, justification}).
    Assign:
      registration: "{% $states.input %}"
    TimeoutSeconds: 604800
    Catch:
      - ErrorEquals:
          - States.TaskFailed
        Next: UpdateStatusRejected
    Next: CheckDecision

  CheckDecision:
    Type: Choice
    Choices:
      - Condition: "{% $states.input.approved = true %}"
        Next: UpdateStatusApproved
    Default: UpdateStatusRejected

  UpdateStatusApproved:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${DomainsTable}"
      Key:
        domainName:
          S: "{% $registration.domainName %}"
      UpdateExpression: "SET #s = :status, decidedBy = :decidedBy, justification = :justification, approvedAt = :approvedAt, updatedAt = :updatedAt"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: APPROVED
        ":decidedBy":
          S: "{% $states.input.decidedBy %}"
        ":justification":
          S: "{% $states.input.justification ? $states.input.justification : '' %}"
        ":approvedAt":
          S: "{% $states.context.State.EnteredTime %}"
        ":updatedAt":
          S: "{% $states.context.State.EnteredTime %}"
    Next: EmitApprovedEvent

  UpdateStatusRejected:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Arguments:
      TableName: "${DomainsTable}"
      Key:
        domainName:
          S: "{% $registration.domainName %}"
      UpdateExpression: "SET #s = :status, decidedBy = :decidedBy, justification = :justification, rejectedAt = :rejectedAt, updatedAt = :updatedAt"
      ExpressionAttributeNames:
        "#s": status
      ExpressionAttributeValues:
        ":status":
          S: REJECTED
        ":decidedBy":
          S: "{% $states.input.decidedBy %}"
        ":justification":
          S: "{% $states.input.justification ? $states.input.justification : '' %}"
        ":rejectedAt":
          S: "{% $states.context.State.EnteredTime %}"
        ":updatedAt":
          S: "{% $states.context.State.EnteredTime %}"
    Next: EmitRejectedEvent

  EmitApprovedEvent:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${NexusEventBus}"
          Source: nexus.domain-management
          DetailType: DomainRegistrationApproved
          Detail: >-
            {% $string({
              "domainName": $registration.domainName,
              "ownerAccountId": $registration.ownerAccountId,
              "ownerEmail": $registration.ownerEmail,
              "environments": $registration.environments,
              "approvedBy": $states.input.decidedBy,
              "justification": $states.input.justification ? $states.input.justification : '',
              "approvedAt": $states.context.State.EnteredTime
            }) %}
    End: true

  EmitRejectedEvent:
    Type: Task
    Resource: "arn:aws:states:::events:putEvents"
    Arguments:
      Entries:
        - EventBusName: "${NexusEventBus}"
          Source: nexus.domain-management
          DetailType: DomainRegistrationRejected
          Detail: >-
            {% $string({
              "domainName": $registration.domainName,
              "ownerAccountId": $registration.ownerAccountId,
              "ownerEmail": $registration.ownerEmail,
              "rejectedBy": $states.input.decidedBy,
              "justification": $states.input.justification ? $states.input.justification : '',
              "rejectedAt": $states.context.State.EnteredTime
            }) %}
    End: true
