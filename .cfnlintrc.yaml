# cfn-lint config — https://github.com/aws-cloudformation/cfn-lint
# The serverless plugin is opinionated; these rules don't apply to this project:

ignore_checks:
  # ES1001 — SQS ESM DLQ at the ESM level.
  # Our SQS trigger uses the source queue's RedrivePolicy → DomainsCommandDlq
  # (maxReceiveCount: 3), which is the standard redrive primitive for
  # SQS-triggered Lambdas. ESM-level OnFailure destination is redundant.
  - ES1001

  # ES1007 — async Lambda permissions need EventInvokeConfig.
  # We deliberately do not use AWS Lambda Destinations. Failure handling is
  # via function-level DeadLetterQueue + EventBridge rule DeadLetterConfig.
  - ES1007

  # ES6000 — SQS queues should have a RedrivePolicy.
  # LambdaDlq, DomainsCommandDlq, and EventBridgeRuleDlq are themselves
  # terminal DLQs. Giving them a redrive would chain DLQs with no useful
  # endpoint.
  - ES6000

  # WS1004 — Lambda function missing corresponding log group with Retention.
  # Every function in this template has an explicit <Function>LogGroup
  # (AWS::Logs::LogGroup, RetentionInDays: 30) with a matching DependsOn.
  # The rule heuristic doesn't recognise the naming-convention linkage.
  - WS1004
