AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EventBridge Nexus

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  Organization:
    Type: String
    Description: Organization identifier used in resource naming
  NamespacePattern:
    Type: String
    Default: "{org}-{env}-{domain}"
    Description: Configurable namespace convention for resource naming
  OrganizationArn:
    Type: String
    Description: ARN of the AWS Organization for RAM sharing (e.g., arn:aws:organizations::123456789012:organization/o-abc123)
  ApprovalFromEmail:
    Type: String
    Default: ""
    Description: Verified SES sender for approval notifications. Leave empty to deploy without notification resources.
  ApprovalToEmail:
    Type: String
    Default: ""
    Description: Verified SES recipient for approval notifications. Leave empty to deploy without notification resources.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        ORGANIZATION: !Ref Organization
        NAMESPACE_PATTERN: !Ref NamespacePattern
        DOMAINS_TABLE: !Ref DomainsTable
        NEXUS_EVENT_BUS: !Ref NexusEventBus
        APPROVAL_STATE_MACHINE_ARN: !Ref ApprovalWorkflow
        DOMAINS_COMMAND_QUEUE_URL: !Ref DomainsCommandQueue

Conditions:
  NotificationsEnabled: !Not [!Equals [!Ref ApprovalFromEmail, ""]]

Resources:
  # ---- EventBridge ----
  NexusEventBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${Organization}-${Environment}-nexus-bus"

  # ---- DynamoDB ----
  DomainsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Organization}-${Environment}-domains"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: domainId
          AttributeType: S
        - AttributeName: domainName
          AttributeType: S
        - AttributeName: ownerAccountId
          AttributeType: S
        - AttributeName: status
          AttributeType: S

      KeySchema:
        - AttributeName: domainId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-name
          KeySchema:
            - AttributeName: domainName
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-owner
          KeySchema:
            - AttributeName: ownerAccountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  # ---- Dead Letter Queue (read Lambda functions) ----
  LambdaDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${Organization}-${Environment}-lambda-dlq"
      MessageRetentionPeriod: 1209600

  # ---- Command Queues ----
  DomainsCommandDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${Organization}-${Environment}-domains-command-dlq"
      MessageRetentionPeriod: 1209600

  DomainsCommandQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "${Organization}-${Environment}-domains-command-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DomainsCommandDlq.Arn
        maxReceiveCount: 3

  # ---- CloudWatch Log Groups ----
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${Organization}-${Environment}-nexus-api"
      RetentionInDays: 30

  ListDomainsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-list-domains"
      RetentionInDays: 30

  DescribeDomainLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-describe-domain"
      RetentionInDays: 30

  # ---- IAM ----
  # Dedicated trust-anchor role referenced by trust-stack.yaml NexusRoleArn parameter.
  # Not used as a Lambda execution role; cross-account provisioning is handled by Step Functions.
  NexusTrustAnchorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-${Environment}-nexus-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  NexusTrustAnchorPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CrossAccountAssumeRole
      Roles:
        - !Ref NexusTrustAnchorRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-${Environment}-nexus-trust-role"

  NexusApiSqsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-${Environment}-apigw-sqs-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole

  NexusApiSqsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SendToCommandQueues
      Roles:
        - !Ref NexusApiSqsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt DomainsCommandQueue.Arn

  # ---- API Gateway ----
  NexusApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${Organization}-${Environment}-nexus-api"
      StageName: !Ref Environment
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        DefaultAuthorizer: AWS_IAM
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi.yaml

  # ---- Domain Management Functions (Read) ----
  ListDomainsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListDomainsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-list-domains"
      CodeUri: ./domain-management/functions/list-domains
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains
            Method: GET

  DescribeDomainFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeDomainLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-describe-domain"
      CodeUri: ./domain-management/functions/describe-domain
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains/{domainId}
            Method: GET

  # ---- Command Handler Functions ----
  DomainCommandHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-domain-command-handler"
      RetentionInDays: 30

  DomainCommandHandlerFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainCommandHandlerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-domain-command-handler"
      CodeUri: ./domain-management/functions/domain-command-handler
      Handler: bootstrap
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt NexusEventBus.Arn
            - Effect: Allow
              Action: [events:RemovePermission]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-${Environment}-*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ApprovalWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt DomainsCommandQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DomainsCommandQueue.Arn
            BatchSize: 1

  # ---- Decide Registration Function ----
  DecideFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-decide-registration"
      RetentionInDays: 30

  DecideFunction:
    Type: AWS::Serverless::Function
    DependsOn: DecideFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-decide-registration"
      CodeUri: ./domain-management/functions/decide-registration
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          NEXUS_EVENT_BUS: !Ref NexusEventBus
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: !Ref ApprovalWorkflow
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains/registrations/decide
            Method: POST

  # ---- Approval Notification Functions ----
  SendApprovalNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-send-approval-notification"
      RetentionInDays: 30

  SendApprovalNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendApprovalNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-send-approval-notification"
      CodeUri: ./domain-management/functions/send-approval-notification
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          APPROVAL_FROM_EMAIL: !Ref ApprovalFromEmail
          APPROVAL_TO_EMAIL: !Ref ApprovalToEmail
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/by-owner"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  SendRejectionNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Organization}-${Environment}-send-rejection-notification"
      RetentionInDays: 30

  SendRejectionNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendRejectionNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "${Organization}-${Environment}-send-rejection-notification"
      CodeUri: ./domain-management/functions/send-rejection-notification
      Handler: bootstrap
      Environment:
        Variables:
          APPROVAL_FROM_EMAIL: !Ref ApprovalFromEmail
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  # ---- EventBridge Rules ----
  DomainRegistrationRejectedRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "${Organization}-${Environment}-domain-registration-rejected"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - DomainRegistrationRejected
        source:
          - nexus.domain-management
      Targets:
        - Id: SendRejectionNotificationTarget
          Arn: !GetAtt SendRejectionNotificationFunction.Arn

  DomainRegistrationRejectedRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SendRejectionNotificationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainRegistrationRejectedRule.Arn

  # ---- Step Functions ----
  ApprovalWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-${Environment}-approval-wf-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ApprovalWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ApprovalWorkflowPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DomainsTable.Arn
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !GetAtt NexusEventBus.Arn

  ApprovalWorkflowNotificationPolicy:
    Type: AWS::IAM::Policy
    Condition: NotificationsEnabled
    Properties:
      PolicyName: ApprovalWorkflowNotificationPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Organization}-${Environment}-send-approval-notification"

  ApprovalWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "${Organization}-${Environment}-domain-approval"
      Role: !GetAtt ApprovalWorkflowRole.Arn
      DefinitionUri: ./domain-management/state-machines/approval.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        NexusEventBus: !GetAtt NexusEventBus.Arn
        SendApprovalNotificationFunction: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Organization}-${Environment}-send-approval-notification"

  ProvisioningWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-${Environment}-provisioning-wf-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ProvisioningWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProvisioningWorkflowPolicy
      Roles:
        - !Ref ProvisioningWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:PutPermission
              - events:RemovePermission
              - events:PutEvents
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-${Environment}-*"
          - Effect: Allow
            Action:
              - schemas:CreateRegistry
              - schemas:DeleteRegistry
              - schemas:PutResourcePolicy
            Resource: !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-${Environment}-*"
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Organization}-${Environment}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutDashboard
              - cloudwatch:DeleteDashboards
            Resource: !Sub "arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Organization}-${Environment}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
            Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-${Environment}-*"
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt DomainsTable.Arn
              - !Sub "${DomainsTable.Arn}/index/by-owner"
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-${Environment}-nexus-trust-role"
          - Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:AddTagsToResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/namespace/*"
          - Effect: Allow
            Action:
              - ram:CreateResourceShare
              - ram:GetResourceShares
              - ram:AssociateResourceShare
              - ram:ListResources
            Resource: "*"

  ProvisioningWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "${Organization}-${Environment}-domain-provisioning"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      DefinitionUri: ./domain-management/state-machines/provisioning.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        NexusEventBus: !GetAtt NexusEventBus.Arn
        Environment: !Ref Environment
        Organization: !Ref Organization
        NamespacePattern: !Ref NamespacePattern
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"
        OrganizationArn: !Ref OrganizationArn
      Events:
        DomainApproved:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NexusEventBus
            Pattern:
              detail-type:
                - DomainRegistrationApproved
              source:
                - nexus.domain-management

Outputs:
  ApiEndpoint:
    Description: EventBridge Nexus API endpoint
    Value: !Sub "https://${NexusApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  NexusEventBusArn:
    Description: EventBridge Nexus event bus ARN
    Value: !GetAtt NexusEventBus.Arn
  DomainsTableName:
    Description: Domains DynamoDB table name
    Value: !Ref DomainsTable
  NexusFunctionRoleArn:
    Description: Trust-anchor role ARN (pass as NexusRoleArn to trust-stack.yaml)
    Value: !GetAtt NexusTrustAnchorRole.Arn
  ProvisioningWorkflowRoleArn:
    Description: Provisioning workflow role ARN (pass as ProvisioningWorkflowRoleArn to trust-stack.yaml)
    Value: !GetAtt ProvisioningWorkflowRole.Arn
  LambdaDlqUrl:
    Description: Lambda Dead Letter Queue URL for monitoring failed async invocations
    Value: !Ref LambdaDlq
