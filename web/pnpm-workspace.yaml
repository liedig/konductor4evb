# Security pins for vulnerable transitive packages (Dependabot alerts); drop each
# once the dependency tree resolves a fixed version on its own. deepmerge and
# node-forge's CVE-2026-85393 have no fixed release and are not listed here.
overrides:
  shell-quote: 1.12.0
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  source-map-js: 1.2.2
  vite@8: 8.3.5
  serialize-javascript: 7.1.4
  postcss-selector-parser: 7.1.6
  glob: 14.0.2
  minimatch: 11.0.1
  eslint-plugin-import-x: 4.18.0
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - eslint-plugin-import-x@4.18.0
