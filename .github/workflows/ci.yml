name: CI

on:
  # Run on PRs, and on pushes to the default branch only. A PR branch push
  # would otherwise trigger two runs for the same commit (push + pull_request)
  # in separate GitHub Actions cache scopes that can't share artifacts, so each
  # keeps missing the cache the other just saved. Pushes to main still
  # populate a branch-scoped cache that PRs inherit as their base.
  push:
    branches: [main]
  pull_request:

# Key on the head commit SHA so the push and pull_request events for the same
# commit share one group and collapse to a single run (github.ref differs
# between the two events, so a ref-based group would not dedupe them).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Read-only everywhere: PR builds must not write to the repo, and push builds
# have no write need either. Fork PRs would be downgraded to read-only anyway;
# this makes the posture explicit rather than inherited.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      - name: Test
        run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      # Separate cache from check/test: those compile natively for x86_64, while
      # this job cross-compiles release artifacts for arm64 (provided.al2023).
      # Sharing "ci" would never hit and would thrash the cache.
      #
      # prefix-key folds a hash of the root Cargo.toml into the cache key.
      # rust-cache's default key parses only the [package] and [*dependencies]
      # sections of *member* manifests — it never reads [profile.*], and the
      # virtual-workspace root Cargo.toml (where [profile.release] lives) is not
      # a member, so profile changes are invisible to the default key. Cargo's
      # compilation fingerprint DOES include opt-level/codegen-units, so without
      # this the cache reports "full match" yet forces a full recompile, and the
      # stale cache stays pinned (rust-cache saves only on a key change).
      # Note: `key` cannot be used here — rust-cache ignores it when shared-key
      # is set (they are mutually exclusive in the action), whereas prefix-key
      # always applies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: build-arm64

      - name: Install build tools
        run: pip install cargo-lambda aws-sam-cli

      - name: Check rendered stages match the default environment list
        run: python3 scripts/validate-config.py --check-stages

      - name: Validate SAM template
        run: sam validate --config-file samconfig-core.toml --lint

      # Compile all 16 functions in one workspace build (deps compiled once, not
      # per function), then SAM only packages the prebuilt binaries. See the
      # `build` / `lambda-binaries` targets in the Makefile.
      - name: Build
        run: make build-ci

  sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # All SDK checks are offline: tests are fully mocked, generation uses
      # the committed projection, and no AWS credentials or publishing
      # tokens exist in this job.
      - name: Check
        run: make sdk-check

      - name: Test
        run: make sdk-test

      - name: Build distributions
        run: make sdk-build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
