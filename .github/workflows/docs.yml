name: Docs

# The PR job is a pure gate: mkdocs build --strict fails on broken internal
# links/anchors. Only pushes to main build the deployable artifact, and only
# the deploy job holds Pages permissions. Path filters keep docs work off the
# product CI minutes budget and vice versa.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml

# Same SHA-keyed dedup as ci.yml: push and pull_request events for one commit
# collapse to a single run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Read-only by default; the deploy job escalates for itself only.
permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install
        run: pip install -r requirements-docs.txt

      - name: Test link hook
        run: python3 docs-site/test_hooks.py

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages deploys serialize rather than cancel: a superseded merge must not
    # leave a half-published site.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
