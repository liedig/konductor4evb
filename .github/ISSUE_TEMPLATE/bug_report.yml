name: Bug report
description: Report something in Konductor that doesn't work as documented
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: >
        **This issue is public.** Before submitting, remove account IDs, tokens,
        email addresses, and other secrets from the description and logs.
        Report security vulnerabilities privately through the link in the issue
        chooser, not here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >
        Which part of Konductor does this concern? Issue forms can't apply labels
        from a dropdown, so a maintainer applies the matching area label and a
        priority during triage.
      options:
        - Domain management (area:domain-mgmt)
        - Schema management (area:schema-mgmt)
        - Event streams (area:event-streams)
        - Control plane (area:control-plane)
        - Notifications (area:notifications)
        - Cross-account trust (area:trust)
        - Web console (area:web)
        - Python SDK (area:sdk)
        - Infrastructure and deployment (area:infra)
        - CI (area:ci)
        - Dependencies (area:deps)
        - Documentation (area:docs)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: >
        Konductor has no releases, so give the commit you deployed
        (`git rev-parse --short HEAD`), or the SDK version if the bug is in the SDK.
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: AWS Region
      description: The Region you deployed to, if it matters.
      placeholder: ap-southeast-2
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or error messages, with secrets removed.
      render: shell
    validations:
      required: false
