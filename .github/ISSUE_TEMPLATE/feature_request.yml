name: Feature Request
description: Suggest a feature
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system would this feature affect?
      options:
        - area:domain-mgmt
        - area:event-streams
        - area:notifications
        - area:trust
        - area:infra
        - area:ci
        - area:deps
        - area:docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this?
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
