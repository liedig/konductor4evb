name: Feature request
description: Suggest a new capability or an improvement
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like Konductor to do?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >
        Which part of Konductor does this concern? Issue forms can't apply labels
        from a dropdown, so a maintainer applies the matching area label and a
        priority during triage.
      options:
        - Domain management (area:domain-mgmt)
        - Schema management (area:schema-mgmt)
        - Event streams (area:event-streams)
        - Control plane (area:control-plane)
        - Notifications (area:notifications)
        - Cross-account trust (area:trust)
        - Web console (area:web)
        - Python SDK (area:sdk)
        - Infrastructure and deployment (area:infra)
        - CI (area:ci)
        - Dependencies (area:deps)
        - Documentation (area:docs)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or considered.
    validations:
      required: false
