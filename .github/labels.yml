# Nexus issue labeling system
# Synced by .github/workflows/sync-labels.yml
# Schema: https://github.com/crazy-max/ghaction-github-labeler

# ── Priority ──────────────────────────────────────────────────────────────
- name: "P0"
  color: "b60205"
  description: "Critical: production-down, data loss, or security vulnerability"

- name: "P1"
  color: "d93f0b"
  description: "High: significant functionality broken, fix before next release"

- name: "P2"
  color: "fbca04"
  description: "Medium: important but not urgent"

- name: "P3"
  color: "0e8a16"
  description: "Low: nice-to-have, minor improvements"

# ── Type ──────────────────────────────────────────────────────────────────
- name: "type:bug"
  color: "d73a4a"
  description: "Bug fix — something isn't working as expected"

- name: "type:feature"
  color: "a2eeef"
  description: "New feature or capability"

- name: "type:refactor"
  color: "1d76db"
  description: "Code refactoring with no behavior change"

- name: "type:chore"
  color: "c5def5"
  description: "Maintenance, dependency updates, tooling"

- name: "type:test"
  color: "006b75"
  description: "Test improvements or new test coverage"

- name: "type:docs"
  color: "0075ca"
  description: "Documentation improvements"

- name: "type:security"
  color: "b60205"
  description: "Security-related change or vulnerability"

# ── Area ──────────────────────────────────────────────────────────────────
- name: "area:domain-mgmt"
  color: "bfd4f2"
  description: "Domain registration, approval, lifecycle management"

- name: "area:event-streams"
  color: "bfdadc"
  description: "Schema registries, subscriptions, event publishing"

- name: "area:notifications"
  color: "d4c5f9"
  description: "Email notifications, SES integration"

- name: "area:trust"
  color: "e99695"
  description: "Cross-account trust model, IAM roles"

- name: "area:infra"
  color: "c7def8"
  description: "CloudFormation, SAM templates, deployment scripts"

- name: "area:ci"
  color: "e6e6e6"
  description: "CI/CD, GitHub Actions workflows"

- name: "area:deps"
  color: "fff4d6"
  description: "Dependency management and version updates"

- name: "area:docs"
  color: "0075ca"
  description: "Documentation, README, AGENTS.md, OpenSpec specs"

# ── Status (workflow-managed) ─────────────────────────────────────────────
- name: "status:blocked"
  color: "5319e7"
  description: "Blocked on external dependency or decision"

- name: "status:in-progress"
  color: "fbca04"
  description: "Currently being worked on"

- name: "status:needs-triage"
  color: "fbca04"
  description: "Awaiting priority and area assignment"

# ── Keep useful defaults ──────────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
