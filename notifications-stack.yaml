AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EventBridge Konductor Notifications Stack.
  Manages SES email identities for approval and rejection notifications.
  MUST be deployed in the same AWS region as the Konductor core stack
  because SES identities are regional and the notification Lambda functions
  in the core stack call SES via the local region endpoint.

Parameters:
  NotificationSenderEmail:
    Type: String
    Description: >-
      Verified SES sender address used as the From on all Konductor notification emails.
      Deploy this stack in the same region as the Konductor core stack (SES identities are regional).
  PlatformOperatorEmail:
    Type: String
    Description: >-
      Verified SES recipient (the platform team inbox) that receives domain approval requests.
      Deploy this stack in the same region as the Konductor core stack (SES identities are regional).

Conditions:
  SenderAndOperatorDiffer: !Not [!Equals [!Ref NotificationSenderEmail, !Ref PlatformOperatorEmail]]

Resources:
  NotificationSenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref NotificationSenderEmail

  PlatformOperatorIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: SenderAndOperatorDiffer
    Properties:
      EmailIdentity: !Ref PlatformOperatorEmail

Outputs:
  NotificationSenderEmail:
    Description: Verified SES sender address
    Value: !Ref NotificationSenderEmail
  PlatformOperatorEmail:
    Description: Verified SES recipient (platform team inbox)
    Value: !Ref PlatformOperatorEmail
