# rumdl configuration — markdown linting for docs/
# See: https://github.com/rvben/rumdl

[global]
# Disabled rules:
#   MD013 line length — docs have tables, long URLs, and mermaid diagrams
#   MD033 inline HTML — docs use custom elements and anchor aliases
#   MD036 emphasis as heading — too many false positives on bold text
#   MD046 code block style — docs mix fenced and indented blocks
disable = ["MD013", "MD033", "MD036", "MD046"]

[MD009]
# Trailing spaces — allow 2 spaces for <br> line breaks (common in markdown)
br_spaces = 2

[MD004]
# Unordered list style — allow any consistent style
style = "consistent"
