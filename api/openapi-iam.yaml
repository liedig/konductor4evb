openapi: "3.0.1"
info:
  title: EventBridge Konductor API
  version: "1.0.0"
  description: EventBridge Konductor — central integration platform for managing AWS EventBridge domains, subscriptions, and cross-account event routing.

# The stage is the environment selector: publish and schema write operations
# infer the target environment from $context.stage. Environment-agnostic
# operations (register, approve, list, describe) behave identically on any stage.
servers:
  - url: "/{environment}"
    variables:
      environment:
        enum: [dev, staging, prod]
        default: dev

x-amazon-apigateway-request-validators:
  validate-body:
    validateRequestBody: true
    validateRequestParameters: false

paths:
  /domains:
    post:
      operationId: RegisterDomain
      summary: Register a new domain
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDomainRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [KonductorApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${DomainRegistrationsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never
    get:
      operationId: ListDomains
      summary: List domains
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: ownerAccountId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: nextToken
          in: query
          schema:
            type: string
        - name: maxResults
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDomainsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListDomainsFunction.Arn}/invocations"

  /domains/{domainName}:
    get:
      operationId: GetDomain
      summary: Get domain details
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domainName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainDetail"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeDomainFunction.Arn}/invocations"
    put:
      operationId: UpdateDomain
      summary: Update domain metadata or status
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domainName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [KonductorApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${DomainRegistrationsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"domainName\":\"$util.urlEncode($input.params('domainName'))\",\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /publish:
    post:
      operationId: PublishEvent
      summary: Publish an event to a domain (validated at admission)
      description: >
        Flat publish: the caller provides the domain, event name, and business
        data; Konductor authorizes the publisher, resolves the latest schema
        version in the stage-selected environment's registry, and validates
        the payload against it — synchronously, before anything is queued. A
        202 means the validated command is durably queued for delivery to the
        domain's event bus; the response carries the queue message ID.
        Authorization (403), unknown domain or schema (404), and payload
        conformance failures (422) are reported synchronously.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "202":
          description: Event validated and durably queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not active or no registered schema for the event name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload violates the latest published schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admission temporarily unavailable (registry or queue failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PublishEventsAdmissionFunction.Arn}/invocations"

  /subscriptions:
    post:
      operationId: Subscribe
      summary: Subscribe a consumer domain to a producer domain's event schema
      description: >
        Schema-first subscription: binds the consumer to the latest version of
        the schema in every environment, pinned at subscribe time. No version
        parameter is accepted — the schema is the contract.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [KonductorApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never
    get:
      operationId: ListSubscriptions
      summary: List event subscriptions
      description: >
        Lists subscriptions from one side of the relationship. `direction=inbound`
        lists the given consumer domain's subscriptions and requires a `subscriber`
        binding on it; `direction=outbound` lists the subscriptions consuming the
        given producer domain's schemas and requires a `publisher` binding, with
        full consumer-topology visibility for notifications and version migration.
        Platform roles may read either side. Callers without the required binding
        receive 403 rather than a filtered-empty result.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domain
          in: query
          required: true
          description: The domain to list from — the consumer domain for `inbound`, the producer domain for `outbound`.
          schema:
            type: string
        - name: direction
          in: query
          required: true
          description: Which side of the relationship to list.
          schema:
            type: string
            enum: [inbound, outbound]
        - name: schema
          in: query
          schema:
            type: string
        - name: version
          in: query
          description: Only subscriptions with this schema version pinned in at least one environment.
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, FAILED, REMOVED]
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscriptionsResponse"
        "400":
          description: Validation error (missing or invalid domain/direction)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks the binding the requested direction requires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListSubscriptionsFunction.Arn}/invocations"

  /subscriptions/{subscriptionId}:
    get:
      operationId: DescribeSubscription
      summary: Get full detail of a subscription
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: "Format: {consumerDomain}.{producerDomain}.{detailType}"
          schema:
            type: string
      responses:
        "200":
          description: Subscription detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetail"
        "403":
          description: Caller is bound to neither the consumer nor the producer side, and holds no platform role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeSubscriptionFunction.Arn}/invocations"
    delete:
      operationId: Unsubscribe
      summary: Remove a subscription (event stream)
      description: >
        Removes the platform-side rules in every environment and marks the
        stream record REMOVED (retained 90 days for audit). Integration rules
        on the consumer's own bus are the application team's responsibility.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [KonductorApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":{\"subscriptionId\":\"$util.urlEncode($input.params('subscriptionId'))\"}}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /subscriptions/state:
    post:
      operationId: UpdateSubscriptionState
      summary: Update per-environment desired state (enable/disable)
      description: Flat-verb state change; the subscription id travels in the body alongside the consumer domain, which must match the id's consumer segment.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionStateRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [KonductorApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /schemas:
    get:
      operationId: ListSchemas
      summary: Discover the schemas a consumer domain is entitled to
      description: >
        The subscriber catalog: exactly the schemas covered by the given
        consumer domain's current entitlements, expanded from the producers'
        per-environment registries (the source of truth), deduplicated across
        overlapping grants, with the latest version per environment so skew is
        visible before subscribing. Requires a `subscriber` binding on the
        consumer domain. `platform-admin` and `platform-auditor` callers may
        omit `consumerDomain` to inspect the platform-wide catalog. A consumer
        domain with no entitlements receives an empty list — enumeration
        reveals nothing about what exists. Pagination uses an opaque
        continuation token bound to the request's filter set; authorization is
        re-evaluated on every page.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: consumerDomain
          in: query
          required: false
          description: The consumer domain whose entitlements expand into the catalog. Omit only as a platform role.
          schema:
            type: string
        - name: domain
          in: query
          required: false
          description: Narrow the catalog to one producer domain. A producer that does not exist or is not ACTIVE yields an empty list.
          schema:
            type: string
        - name: environment
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single environment (e.g., dev, staging, prod).
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 50
        - name: nextToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The entitlement-covered catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSchemasResponse"
        "400":
          description: Validation error (malformed or filter-mismatched continuation token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No subscriber binding on the consumer domain, or the platform-wide catalog was requested without a platform role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListSchemasFunction.Arn}/invocations"
    post:
      operationId: CreateSchema
      summary: Create an event schema (publisher)
      description: >
        Flat schema creation mirroring EventBridge CreateSchema. Konductor derives
        the canonical schema name {namespaceIdentity}@{eventName}, targets the
        stage-selected environment's registry, and creates version 1. Requires
        a publisher binding for the domain. Schemas are append-only.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchemaRequest"
      responses:
        "201":
          description: Schema created as version 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks a publisher binding for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Schema already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaAdminFunction.Arn}/invocations"

  /schemas/versions:
    post:
      operationId: AppendSchemaVersion
      summary: Append a new version to an existing schema (publisher)
      description: >
        Flat append-only version registration mirroring EventBridge
        UpdateSchema. Existing versions remain immutable. Requires a publisher
        binding for the domain.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSchemaVersionRequest"
      responses:
        "201":
          description: Version appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks a publisher binding for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain or schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaAdminFunction.Arn}/invocations"

  /schemas/{schemaName}:
    get:
      operationId: DescribeSchema
      summary: Describe a schema including per-environment latest versions
      description: >
        Full schema detail under the same coverage check as the catalog: a
        `subscriber` binding on the consumer domain plus a current covering
        entitlement. Platform roles may omit `consumerDomain` to inspect any
        schema. Uncovered targets receive 403; a schema absent from every
        environment receives 404.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: schemaName
          in: path
          required: true
          description: "Format: {source}@{detail-type}, URL-encoded"
          schema:
            type: string
        - name: domain
          in: query
          required: true
          description: The producer domain.
          schema:
            type: string
        - name: consumerDomain
          in: query
          required: false
          description: The consumer domain whose coverage authorizes the read. Omit only as a platform role.
          schema:
            type: string
      responses:
        "200":
          description: Schema detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDetail"
        "403":
          description: No subscriber binding or no covering entitlement, or consumerDomain omitted without a platform role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain or schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeSchemaFunction.Arn}/invocations"

components:
  schemas:
    CommandAccepted:
      type: object
      properties:
        requestId:
          type: string
        message:
          type: string
          example: "Domain registration request accepted"

    RegisterDomainRequest:
      type: object
      additionalProperties: false
      required: [domainName, ownerAccountId, ownerEmail, secondaryOwnerEmails]
      properties:
        domainName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        description:
          type: string
          maxLength: 256
        ownerAccountId:
          type: string
          pattern: "^[0-9]{12}$"
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        costCenter:
          type: string
          maxLength: 256
          description: Optional governed cost-allocation tag propagated to every provisioned resource. The only accepted custom tag; arbitrary tag maps are rejected.
      example:
        domainName: sales
        ownerAccountId: "111122223333"
        ownerEmail: sales-team@example.com
        secondaryOwnerEmails: ["sales-backup@example.com"]
        description: Sales domain events

    DomainSummary:
      type: object
      properties:
        domainName:
          type: string
        domainNamespace:
          type: string
          description: Environment-independent namespace identity (e.g. acme-billing).
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        status:
          type: string
        environments:
          type: array
          items:
            type: string
          example: ["dev", "staging", "prod"]
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    DomainDetail:
      type: object
      properties:
        domainName:
          type: string
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        status:
          type: string
        environments:
          type: array
          description: Environments this domain is provisioned into.
          items:
            type: string
          example: ["dev", "staging", "prod"]
        costCenter:
          type: string
          description: Governed cost-center tag value set at registration or by update.
          example: "cc-5678"
        tags:
          type: object
          additionalProperties:
            type: string
        resourceArns:
          type: object
          description: >
            Per-environment resource ARN sets. Populated when the domain status
            is `ACTIVE`. Each key is an environment name from the domain's
            `environments` list.
          additionalProperties:
            $ref: "#/components/schemas/PerEnvResourceArns"
          example:
            dev:
              platformEventBusArn: "arn:aws:events:us-east-1:111122223333:event-bus/acme-dev-sales-event-bus"
              appEventBusArn: "arn:aws:events:us-east-1:444455556666:event-bus/acme-dev-sales-event-bus"
              schemaRegistryArn: "arn:aws:schemas:us-east-1:111122223333:registry/acme-dev-sales-schema-registry"
              subscriptionDlqArn: "arn:aws:sqs:us-east-1:111122223333:acme-dev-sales-subscription-dlq"
              integrationDlqArn: "arn:aws:sqs:us-east-1:444455556666:acme-dev-sales-integration-dlq"
              dashboardArn: "arn:aws:cloudwatch::111122223333:dashboard/acme-dev-sales-domain-dashboard"
        namespaceParameter:
          type: string
          description: SSM parameter path where the domain namespace is published (env-independent).
          example: "/namespace/sales"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PerEnvResourceArns:
      type: object
      description: Resource ARNs for a single environment of a domain.
      properties:
        platformEventBusArn:
          type: string
        appEventBusArn:
          type: string
        schemaRegistryArn:
          type: string
        subscriptionDlqArn:
          type: string
        integrationDlqArn:
          type: string
        dashboardArn:
          type: string

    UpdateDomainRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 256
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        costCenter:
          type: string
          minLength: 1
          maxLength: 256
          description: Governed cost-allocation tag propagated to every provisioned resource. Change-only — an empty value is rejected; omit the field to leave it unchanged.

    ListDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainSummary"
        nextToken:
          type: string

    DecideRequest:
      type: object
      required: [taskToken, decision]
      properties:
        taskToken:
          type: string
        decision:
          type: string
          enum: [ACCEPT, REJECT]
        justification:
          type: string
          maxLength: 512

    DecisionRecorded:
      type: object
      properties:
        message:
          type: string
          example: "Decision recorded"

    PublishRequest:
      type: object
      required: [domain, eventName, data]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
          description: Target domain name; the environment comes from the API stage.
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must match a schema registered for the domain.
        data:
          description: Business event payload, passed through unvalidated.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional caller idempotency key; defaults to the API Gateway request ID.
      example:
        domain: orders
        eventName: OrderNotification
        data:
          orderId: 123
          amount: 99.50

    CreateSchemaRequest:
      type: object
      required: [domain, eventName, schemaType, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must be feasible in an EventBridge rule name.
        schemaType:
          type: string
          enum: [JSONSchemaDraft4]
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        schemaType: JSONSchemaDraft4
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    AppendSchemaVersionRequest:
      type: object
      required: [domain, eventName, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    SchemaMutationResponse:
      type: object
      properties:
        schemaName:
          type: string
          example: "acme-orders@OrderNotification"
        schemaVersion:
          type: integer
          example: 1

    SubscribeRequest:
      type: object
      required: [consumerDomain, producerDomain, schemaName]
      additionalProperties: false
      properties:
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        producerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        schemaName:
          type: string
          description: "Format: {source}@{detail-type}"
          pattern: "^[^@]+@.+$"
          maxLength: 128
        environments:
          type: object
          description: >
            Optional initial per-environment desired state. Omitted
            environments default to enabled.
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        consumerDomain: checkout
        producerDomain: orders
        schemaName: acme-orders@OrderNotification
        environments:
          prod:
            enabled: false

    EnvDesiredState:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    UpdateSubscriptionStateRequest:
      type: object
      required: [subscriptionId, consumerDomain, environments]
      additionalProperties: false
      properties:
        subscriptionId:
          type: string
          description: "Format: {consumerDomain}.{producerDomain}.{detailType}; its consumer segment must equal consumerDomain"
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        environments:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        subscriptionId: checkout.orders.OrderNotification
        consumerDomain: checkout
        environments:
          prod:
            enabled: true

    SubscriptionSummary:
      type: object
      properties:
        subscriptionId:
          type: string
          example: checkout.orders.OrderNotification
        consumerDomain:
          type: string
        producerDomain:
          type: string
        schemaName:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, FAILED, REMOVED]
        environments:
          type: object
          description: Per-environment pinned version and state.
          additionalProperties:
            $ref: "#/components/schemas/EnvStreamState"
        createdAt:
          type: string
          format: date-time

    SubscriptionDetail:
      allOf:
        - $ref: "#/components/schemas/SubscriptionSummary"
        - type: object
          properties:
            source:
              type: string
            detailType:
              type: string
            updatedAt:
              type: string
              format: date-time
            removedAt:
              type: string
              format: date-time

    EnvStreamState:
      type: object
      properties:
        pinnedVersion:
          type: integer
          description: Schema version pinned at subscribe time for this environment.
        ruleArn:
          type: string
        enabled:
          type: boolean
          description: Desired state.
        status:
          type: string
          description: Materialized state.
          enum: [PENDING, ACTIVE, FAILED, REMOVED]

    ListSubscriptionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionSummary"

    SchemaSummary:
      type: object
      properties:
        schemaName:
          type: string
          example: acme-orders@OrderNotification
        producerDomain:
          type: string
          description: The producer domain the schema was expanded from.
        source:
          type: string
        detailType:
          type: string
        latestVersions:
          type: object
          description: Latest schema version per environment (skew visible here).
          additionalProperties:
            type: integer
          example:
            dev: 5
            staging: 3
            prod: 3

    SchemaDetail:
      allOf:
        - $ref: "#/components/schemas/SchemaSummary"
        - type: object
          properties:
            content:
              type: string
              description: Schema content of the highest latest version across environments.

    ListSchemasResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SchemaSummary"
        nextToken:
          type: string
          description: Opaque watermark cursor, bound to the request's filter set.
      example:
        items:
          - schemaName: acme-orders@OrderNotification
            producerDomain: orders
            source: acme-orders
            detailType: OrderNotification
            latestVersions:
              dev: 5
              prod: 3

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        reason:
          type: string
          enum: [unknownOperation, cannotParse, fieldValidationFailed, other]
        fieldList:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              message:
                type: string
