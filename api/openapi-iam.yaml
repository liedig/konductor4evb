openapi: "3.0.1"
info:
  title: EventBridge Nexus API
  version: "1.0.0"
  description: EventBridge Nexus — central integration platform for managing AWS EventBridge domains, subscriptions, and cross-account event routing.

# The stage is the environment selector: publish and schema write operations
# infer the target environment from $context.stage. Environment-agnostic
# operations (register, approve, list, describe) behave identically on any stage.
servers:
  - url: "/{environment}"
    variables:
      environment:
        enum: [dev, staging, prod]
        default: dev

x-amazon-apigateway-request-validators:
  validate-body:
    validateRequestBody: true
    validateRequestParameters: false

paths:
  /domains:
    post:
      operationId: RegisterDomain
      summary: Register a new domain
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDomainRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${DomainRegistrationsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never
    get:
      operationId: ListDomains
      summary: List domains
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: ownerAccountId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: nextToken
          in: query
          schema:
            type: string
        - name: maxResults
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDomainsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListDomainsFunction.Arn}/invocations"

  /domains/{domainName}:
    get:
      operationId: GetDomain
      summary: Get domain details
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domainName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainDetail"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeDomainFunction.Arn}/invocations"
    put:
      operationId: UpdateDomain
      summary: Update domain metadata or status
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domainName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${DomainRegistrationsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"domainName\":\"$util.urlEncode($input.params('domainName'))\",\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /publish:
    post:
      operationId: PublishEvent
      summary: Publish an event to a domain (store-and-forward)
      description: >
        Flat publish: the caller provides the domain, event name, and business
        data; Nexus resolves the latest schema version, builds the canonical
        envelope, and publishes to the domain's event bus for the
        stage-selected environment. The request is durably queued before
        processing; the 202 response carries the queue message ID.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "202":
          description: Event durably queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${PublishQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"callerAccountId\":\"$context.identity.accountId\",\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Environment&MessageAttribute.6.Value.StringValue=$context.stage&MessageAttribute.6.Value.DataType=String&MessageAttribute.7.Name=IdempotencyKey&MessageAttribute.7.Value.StringValue=#if($input.path('$.idempotencyKey') && $input.path('$.idempotencyKey') != '')$util.urlEncode($input.path('$.idempotencyKey'))#else$util.urlEncode($context.requestId)#end&MessageAttribute.7.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /subscriptions:
    post:
      operationId: Subscribe
      summary: Subscribe a consumer domain to a producer domain's event schema
      description: >
        Schema-first subscription: binds the consumer to the latest version of
        the schema in every environment, pinned at subscribe time. No version
        parameter is accepted — the schema is the contract.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never
    get:
      operationId: ListSubscriptions
      summary: List event subscriptions
      description: Results are scoped to subscriptions where the caller's account owns the consumer domain, the producer domain, or both — a caller with no relationship to either side of a subscription will never see it, regardless of filters.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: consumer
          in: query
          schema:
            type: string
        - name: producer
          in: query
          schema:
            type: string
        - name: schema
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, FAILED, REMOVED]
        - name: nextToken
          in: query
          schema:
            type: string
        - name: maxResults
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscriptionsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListSubscriptionsFunction.Arn}/invocations"

  /subscriptions/{subscriptionId}:
    get:
      operationId: DescribeSubscription
      summary: Get full detail of a subscription
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: "Format: {consumerDomain}.{producerDomain}.{detailType}"
          schema:
            type: string
      responses:
        "200":
          description: Subscription detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetail"
        "404":
          description: Subscription not found, or the caller's account owns neither the consumer nor the producer domain (returned rather than 403 so unauthorized callers cannot use this endpoint to confirm a subscription's existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeSubscriptionFunction.Arn}/invocations"
    delete:
      operationId: Unsubscribe
      summary: Remove a subscription (event stream)
      description: >
        Removes the platform-side rules in every environment and marks the
        stream record REMOVED (retained 90 days for audit). Integration rules
        on the consumer's own bus are the application team's responsibility.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":{\"subscriptionId\":\"$util.urlEncode($input.params('subscriptionId'))\"}}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /subscriptions/state:
    post:
      operationId: UpdateSubscriptionState
      summary: Update per-environment desired state (enable/disable)
      description: Flat-verb state change; the subscription id travels in the body alongside the consumer domain, which must match the id's consumer segment.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionStateRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        credentials:
          Fn::GetAtt: [NexusApiSqsRole, Arn]
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${SubscriptionsQueue.QueueName}"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: "Action=SendMessage&MessageBody={\"body\":$util.urlEncode($input.json('$'))}&MessageAttribute.1.Name=HttpMethod&MessageAttribute.1.Value.StringValue=$context.httpMethod&MessageAttribute.1.Value.DataType=String&MessageAttribute.2.Name=PrincipalVersion&MessageAttribute.2.Value.StringValue=1&MessageAttribute.2.Value.DataType=String&MessageAttribute.3.Name=AuthMechanism&MessageAttribute.3.Value.StringValue=iam&MessageAttribute.3.Value.DataType=String&MessageAttribute.4.Name=AccountId&MessageAttribute.4.Value.StringValue=$util.urlEncode($context.identity.accountId)&MessageAttribute.4.Value.DataType=String&MessageAttribute.5.Name=PrincipalArn&MessageAttribute.5.Value.StringValue=$util.urlEncode($context.identity.userArn)&MessageAttribute.5.Value.DataType=String&MessageAttribute.6.Name=Resource&MessageAttribute.6.Value.StringValue=$context.resourcePath&MessageAttribute.6.Value.DataType=String"
        responses:
          default:
            statusCode: "202"
            responseTemplates:
              application/json: |
                #set($body = $input.path('$'))
                #set($messageId = $body.SendMessageResponse.SendMessageResult.MessageId)
                {"requestId":"$messageId","message":"Request accepted"}
        passthroughBehavior: never

  /schemas:
    get:
      operationId: ListSchemas
      summary: Discover event schemas offered by a producer domain
      description: >
        Read-only schema discovery. Lists schemas from the producer's
        per-environment registries. When no environment is specified, returns
        all environments; when an environment is specified, returns only that
        environment's registry and schemas.
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: environment
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single environment (e.g., dev, staging, prod).
      responses:
        "200":
          description: Schemas offered by the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSchemasResponse"
        "404":
          description: Domain not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListSchemasFunction.Arn}/invocations"
    post:
      operationId: CreateSchema
      summary: Create an event schema (publisher)
      description: >
        Flat schema creation mirroring EventBridge CreateSchema. Nexus derives
        the canonical schema name {namespaceIdentity}@{eventName}, targets the
        stage-selected environment's registry, and creates version 1. Requires
        a publisher binding for the domain. Schemas are append-only.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchemaRequest"
      responses:
        "201":
          description: Schema created as version 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks a publisher binding for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Schema already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaAdminFunction.Arn}/invocations"

  /schemas/versions:
    post:
      operationId: AppendSchemaVersion
      summary: Append a new version to an existing schema (publisher)
      description: >
        Flat append-only version registration mirroring EventBridge
        UpdateSchema. Existing versions remain immutable. Requires a publisher
        binding for the domain.
      x-amazon-apigateway-request-validator: validate-body
      x-amazon-apigateway-auth:
        type: AWS_IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSchemaVersionRequest"
      responses:
        "201":
          description: Version appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks a publisher binding for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain or schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaAdminFunction.Arn}/invocations"

  /schemas/{schemaName}:
    get:
      operationId: DescribeSchema
      summary: Describe a schema including per-environment latest versions
      x-amazon-apigateway-auth:
        type: AWS_IAM
      parameters:
        - name: schemaName
          in: path
          required: true
          description: "Format: {source}@{detail-type}, URL-encoded"
          schema:
            type: string
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDetail"
        "404":
          description: Domain or schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DescribeSchemaFunction.Arn}/invocations"

components:
  schemas:
    CommandAccepted:
      type: object
      properties:
        requestId:
          type: string
        message:
          type: string
          example: "Domain registration request accepted"

    RegisterDomainRequest:
      type: object
      required: [domainName, ownerAccountId, ownerEmail, secondaryOwnerEmails]
      properties:
        domainName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        description:
          type: string
          maxLength: 256
        ownerAccountId:
          type: string
          pattern: "^[0-9]{12}$"
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        tags:
          type: object
          additionalProperties:
            type: string
      example:
        domainName: sales
        ownerAccountId: "111122223333"
        ownerEmail: sales-team@example.com
        secondaryOwnerEmails: ["sales-backup@example.com"]
        description: Sales domain events

    DomainSummary:
      type: object
      properties:
        domainName:
          type: string
        domainNamespace:
          type: string
          description: Environment-independent namespace identity (e.g. acme-billing).
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        status:
          type: string
        environments:
          type: array
          items:
            type: string
          example: ["dev", "staging", "prod"]
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    DomainDetail:
      type: object
      properties:
        domainName:
          type: string
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        status:
          type: string
        environments:
          type: array
          description: Environments this domain is provisioned into.
          items:
            type: string
          example: ["dev", "staging", "prod"]
        tags:
          type: object
          additionalProperties:
            type: string
        resourceArns:
          type: object
          description: >
            Per-environment resource ARN sets. Populated when the domain status
            is `ACTIVE`. Each key is an environment name from the domain's
            `environments` list.
          additionalProperties:
            $ref: "#/components/schemas/PerEnvResourceArns"
          example:
            dev:
              platformEventBusArn: "arn:aws:events:us-east-1:111122223333:event-bus/acme-dev-sales-event-bus"
              appEventBusArn: "arn:aws:events:us-east-1:444455556666:event-bus/acme-dev-sales-event-bus"
              schemaRegistryArn: "arn:aws:schemas:us-east-1:111122223333:registry/acme-dev-sales-schema-registry"
              subscriptionDlqArn: "arn:aws:sqs:us-east-1:111122223333:acme-dev-sales-subscription-dlq"
              integrationDlqArn: "arn:aws:sqs:us-east-1:444455556666:acme-dev-sales-integration-dlq"
              dashboardArn: "arn:aws:cloudwatch::111122223333:dashboard/acme-dev-sales-domain-dashboard"
        namespaceParameter:
          type: string
          description: SSM parameter path where the domain namespace is published (env-independent).
          example: "/namespace/sales"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PerEnvResourceArns:
      type: object
      description: Resource ARNs for a single environment of a domain.
      properties:
        platformEventBusArn:
          type: string
        appEventBusArn:
          type: string
        schemaRegistryArn:
          type: string
        subscriptionDlqArn:
          type: string
        integrationDlqArn:
          type: string
        dashboardArn:
          type: string

    UpdateDomainRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 256
        tags:
          type: object
          additionalProperties:
            type: string
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email

    ListDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainSummary"
        nextToken:
          type: string

    DecideRequest:
      type: object
      required: [taskToken, decision]
      properties:
        taskToken:
          type: string
        decision:
          type: string
          enum: [ACCEPT, REJECT]
        justification:
          type: string
          maxLength: 512

    DecisionRecorded:
      type: object
      properties:
        message:
          type: string
          example: "Decision recorded"

    PublishRequest:
      type: object
      required: [domain, eventName, data]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
          description: Target domain name; the environment comes from the API stage.
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must match a schema registered for the domain.
        data:
          description: Business event payload, passed through unvalidated.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional caller idempotency key; defaults to the API Gateway request ID.
      example:
        domain: orders
        eventName: OrderNotification
        data:
          orderId: 123
          amount: 99.50

    CreateSchemaRequest:
      type: object
      required: [domain, eventName, schemaType, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must be feasible in an EventBridge rule name.
        schemaType:
          type: string
          enum: [JSONSchemaDraft4]
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        schemaType: JSONSchemaDraft4
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    AppendSchemaVersionRequest:
      type: object
      required: [domain, eventName, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    SchemaMutationResponse:
      type: object
      properties:
        schemaName:
          type: string
          example: "acme-orders@OrderNotification"
        schemaVersion:
          type: integer
          example: 1

    SubscribeRequest:
      type: object
      required: [consumerDomain, producerDomain, schemaName]
      additionalProperties: false
      properties:
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        producerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        schemaName:
          type: string
          description: "Format: {source}@{detail-type}"
          pattern: "^[^@]+@.+$"
          maxLength: 128
        environments:
          type: object
          description: >
            Optional initial per-environment desired state. Omitted
            environments default to enabled.
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        consumerDomain: checkout
        producerDomain: orders
        schemaName: acme-orders@OrderNotification
        environments:
          prod:
            enabled: false

    EnvDesiredState:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    UpdateSubscriptionStateRequest:
      type: object
      required: [subscriptionId, consumerDomain, environments]
      additionalProperties: false
      properties:
        subscriptionId:
          type: string
          description: "Format: {consumerDomain}.{producerDomain}.{detailType}; its consumer segment must equal consumerDomain"
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        environments:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        subscriptionId: checkout.orders.OrderNotification
        consumerDomain: checkout
        environments:
          prod:
            enabled: true

    SubscriptionSummary:
      type: object
      properties:
        subscriptionId:
          type: string
          example: checkout.orders.OrderNotification
        consumerDomain:
          type: string
        producerDomain:
          type: string
        schemaName:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, FAILED, REMOVED]
        environments:
          type: object
          description: Per-environment pinned version and state.
          additionalProperties:
            $ref: "#/components/schemas/EnvStreamState"
        createdAt:
          type: string
          format: date-time

    SubscriptionDetail:
      allOf:
        - $ref: "#/components/schemas/SubscriptionSummary"
        - type: object
          properties:
            source:
              type: string
            detailType:
              type: string
            updatedAt:
              type: string
              format: date-time
            removedAt:
              type: string
              format: date-time

    EnvStreamState:
      type: object
      properties:
        pinnedVersion:
          type: integer
          description: Schema version pinned at subscribe time for this environment.
        ruleArn:
          type: string
        enabled:
          type: boolean
          description: Desired state.
        status:
          type: string
          description: Materialized state.
          enum: [PENDING, ACTIVE, FAILED, REMOVED]

    ListSubscriptionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionSummary"
        nextToken:
          type: string

    SchemaSummary:
      type: object
      properties:
        schemaName:
          type: string
          example: acme-orders@OrderNotification
        source:
          type: string
        detailType:
          type: string
        latestVersions:
          type: object
          description: Latest schema version per environment (skew visible here).
          additionalProperties:
            type: integer
          example:
            dev: 5
            staging: 3
            prod: 3

    SchemaDetail:
      allOf:
        - $ref: "#/components/schemas/SchemaSummary"
        - type: object
          properties:
            content:
              type: string
              description: Schema content of the highest latest version across environments.

    ListSchemasResponse:
      type: object
      properties:
        domain:
          type: string
        environments:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EnvironmentSchemas"
          example:
            dev:
              registry: acme-dev-sales-schema-registry
              schemas:
                - schemaName: acme-sales@InvoiceCreated
                  source: acme-sales
                  detailType: InvoiceCreated
                  version: 1

    EnvironmentSchemas:
      type: object
      properties:
        registry:
          type: string
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaVersionEntry"

    SchemaVersionEntry:
      type: object
      properties:
        schemaName:
          type: string
          example: acme-orders@OrderNotification
        source:
          type: string
        detailType:
          type: string
        version:
          type: integer

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        reason:
          type: string
          enum: [unknownOperation, cannotParse, fieldValidationFailed, other]
        fieldList:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              message:
                type: string
