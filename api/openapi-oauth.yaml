                $ref: "#/components/schemas/PromotionStatusResponse"
        "400":
          description: Missing query parameters, or the request's stage is the authoring environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller holds neither a publisher binding for the domain nor a platform role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No promotion recorded for this schema and environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaPromotionsFunction.Arn}/invocations"

  /schemas/versions:
    post:
      operationId: AppendSchemaVersion
      summary: Append a new version to an existing schema (publisher)
      description: >
        Flat append-only version registration mirroring EventBridge
        UpdateSchema in the authoring environment's registry. Existing
        versions remain immutable. Requires a publisher
        binding for the domain. The appended document must provably preserve
        every payload the current latest version accepts, under a bounded
        syntactic proof: it may loosen or remove constraints, and it may add
        an optional property only where the predecessor's property policy
        allows it (any constraint on a previously prohibited name, or an
        unconstrained one on an open object). It must never remove a declared
        property, newly require a property, narrow a type, or tighten a
        constraint. Changes to documents carrying schema-bearing $refs,
        comparisons that cannot be made exactly, and proofs that exceed the
        comparison budget fail closed as unproven. Intentional breaking
        evolution is expressed as a new schema under a new event name.
      x-amazon-apigateway-request-validator: validate-body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSchemaVersionRequest"
      responses:
        "201":
          description: Version appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMutationResponse"
        "400":
          description: >
            Validation error: the document is not valid JSON Schema draft-4,
            backward compatibility with the current latest version could
            not be established (the message identifies the relevant paths,
            distinguishing observed constraint restrictions from changes
            the bounded proof does not support), or AuthoringEnvironmentOnly
            when called on a stage other than the authoring environment's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks a publisher binding for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain or schema not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchemaAdminFunction.Arn}/invocations"

