        "403":
          description: Access denied (not a platform role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Metadata configuration unavailable (no head revision)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetadataAdminFunction.Arn}/invocations"

  /metadata/readiness:
    post:
      operationId: CheckMetadataReadiness
      summary: Report whether a revision is ready to activate in an environment (platform roles only)
      description: >
        Read-only probe: recompiles the stored revision exactly, resolves
        the generation context, validates the generated values against the
        compiled contract, and checks the composed size budget. Activation
        recomputes these checks server-side; a client-ready report is never
        trusted as authorization to cut over.
      x-amazon-apigateway-request-validator: validate-body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataReadinessRequest"
      responses:
        "200":
          description: Readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataReadinessReport"
        "400":
          description: Validation error (unknown environment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (not a platform role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Metadata configuration or generation context unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetadataAdminFunction.Arn}/invocations"

  /metadata/environments:
    get:
      operationId: ListMetadataEnvironments
      summary: Report every configured environment's active metadata pointer (platform roles only)
      responses:
        "200":
          description: Per-environment pointer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEnvironmentList"
        "403":
          description: Access denied (not a platform role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Metadata configuration unavailable (a configured environment has no pointer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetadataAdminFunction.Arn}/invocations"

  /metadata/activations:
    get:
      operationId: ListMetadataActivations
      summary: Page the durable activation audit history (platform roles only)
      description: >
        Committed activation records only, newest first. An activation that
        lost its race never committed and never entered this history.
        Pagination uses an opaque continuation token bound to the audit
        partition.
      parameters:
        - name: nextToken
          in: query
          required: false
          schema:
            type: string
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Activation audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataActivationList"
        "400":
          description: Validation error (malformed continuation token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (not a platform role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetadataAdminFunction.Arn}/invocations"
    post:
      operationId: ActivateMetadataRevision
      summary: Move an environment's active metadata pointer to a revision (platform-admin only)
      description: >
        The pointer cutover. Readiness is recomputed from server state
        first; the pointer then moves forward only, conditioned on the
        caller's expected active revision, bumping the generation
        (invalidating generation-scoped caches) and committing the audit
        record in one transaction. Reapplying the already-active revision
        is a read-only no-op answering with current state; a stale
        expectation or a lost race fails 409 with the current state.
      x-amazon-apigateway-request-validator: validate-body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateMetadataRequest"
      responses:
        "200":
          description: Pointer state after the activation (or the read-only no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateMetadataResponse"
        "400":
          description: Validation error (unknown environment or invalid operationId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (not a platform-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Backward move, stale expected-active revision, lost race, or failed server-side readiness recheck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Metadata configuration unavailable (no pointer for the environment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetadataAdminFunction.Arn}/invocations"

  /bindings:
    post:
      operationId: CreateBinding
      summary: Create a role binding (platform-admin only)
      description: Binds a typed principal (issuer-qualified Cognito team group or twelve-digit AWS account) to a role on a domain. Identical re-creates are idempotent. Server-assigned fields (bindingId, state, createdAt, createdBy) are rejected if supplied.
      x-amazon-apigateway-request-validator: validate-body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRequest"
      responses:
        "200":
          description: An identical binding already existed (idempotent re-create)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "201":
          description: Binding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (caller is not a platform-admin OAuth principal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The binding changed concurrently; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BindingAdminFunction.Arn}/invocations"
    get:
      operationId: ListBindings
      summary: List role bindings for a domain (platform-admin only)
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bindings for the domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBindingsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (caller is not a platform-admin OAuth principal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BindingAdminFunction.Arn}/invocations"

  /entitlements:
    post:
      operationId: CreateEntitlement
      summary: Grant a consumer domain coverage over a producer domain's schemas
      description: Creates a coverage entitlement. Authorized for platform-admins and for callers holding a publisher binding on the producer domain (producer self-service). The scope pattern is `*` (whole producer domain, including future schemas), an exact schema name (all versions, including future versions), or a name prefix with a single trailing `*` (a family, including future members). Identical re-creates are idempotent. Server-assigned fields (entitlementId, createdAt, createdBy) are rejected if supplied.
      x-amazon-apigateway-request-validator: validate-body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntitlementRequest"
      responses:
        "200":
          description: An identical entitlement already existed (idempotent re-create)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "201":
          description: Entitlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (caller is neither a platform-admin nor a publisher on the producer domain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The entitlement changed concurrently; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EntitlementAdminFunction.Arn}/invocations"
    get:
      operationId: ListEntitlements
      summary: List entitlements by consumer or producer domain
      description: Exactly one of consumerDomain or producerDomain is required. Consumer lists authorize platform-admins, publishers on any producer domain, and subscribers on the queried consumer domain; producer lists authorize platform-admins and publishers on the queried producer domain.
      parameters:
        - name: consumerDomain
          in: query
          required: false
          schema:
            type: string
        - name: producerDomain
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entitlements matching the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEntitlementsResponse"
        "400":
          description: Validation error (missing or ambiguous filter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EntitlementAdminFunction.Arn}/invocations"

  /entitlements/{entitlementId}:
    delete:
      operationId: RevokeEntitlement
      summary: Revoke an entitlement
      description: Durable conditional delete that commits with its audit record in one transaction; new subscribe and enable decisions deny uncovered targets immediately. Active subscriptions the entitlement covered are disabled asynchronously by the revocation worker, with a scheduled sweep as backstop. Authorized for platform-admins and for callers holding a publisher binding on the entitlement's producer domain.
      parameters:
        - name: entitlementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entitlement revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlementId:
                    type: string
                  state:
                    type: string
                    enum: [revoked]
        "403":
          description: Access denied (caller is neither a platform-admin nor a publisher on the entitlement's producer domain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entitlement not found (unknown or already revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EntitlementAdminFunction.Arn}/invocations"

  /bindings/{bindingId}:
    delete:
      operationId: RevokeBinding
      summary: Revoke a role binding (platform-admin only)
      description: Durable delete; the binding stops authorizing on the next decision. Revocation and its audit record commit in one transaction.
      parameters:
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binding revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindingId:
                    type: string
                  state:
                    type: string
                    enum: [revoked]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (caller is not a platform-admin OAuth principal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Binding not found (unknown or already revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BindingAdminFunction.Arn}/invocations"

components:
  schemas:
    BindingPrincipal:
      description: A principal that can hold a role binding. The `type` discriminator selects the shape.
      oneOf:
        - type: object
          required: [type, issuer, group]
          properties:
            type:
              type: string
              enum: [cognito-group]
            issuer:
              type: string
              pattern: "^https://"
              description: Cognito user-pool issuer URL qualifying the group
            group:
              type: string
              minLength: 1
        - type: object
          required: [type, accountId]
          properties:
            type:
              type: string
              enum: [aws-account]
            accountId:
              type: string
              pattern: "^[0-9]{12}$"

    CreateBindingRequest:
      type: object
      required: [domain, role, principal]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
          description: Domain the binding scopes to; global bindings are not representable
        role:
          type: string
          enum: [publisher, subscriber, owner]
          description: Role granted on the domain; `owner` authorizes domain management and is platform-administered
        principal:
          $ref: "#/components/schemas/BindingPrincipal"
      example:
        domain: orders
        role: publisher
        principal:
          type: aws-account
          accountId: "111122223333"

    Binding:
      type: object
      properties:
        bindingId:
          type: string
        domain:
          type: string
        role:
          type: string
          enum: [publisher, subscriber, owner]
        principal:
          $ref: "#/components/schemas/BindingPrincipal"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Trusted principal identifier of the administrator who created the binding

    CreateEntitlementRequest:
      type: object
      required: [consumerDomain, producerDomain, scopePattern]
      additionalProperties: false
      properties:
        consumerDomain:
          type: string
          minLength: 1
          description: Consumer domain the entitlement covers
        producerDomain:
          type: string
          minLength: 1
          description: Producer domain granting the coverage
        scopePattern:
          type: string
          minLength: 1
          description: "`*` (whole producer domain including future schemas), an exact schema name (all versions including future versions), or a name prefix with a single trailing `*` (a family including future members)"
      example:
        consumerDomain: checkout
        producerDomain: orders
        scopePattern: "Order*"
    Entitlement:
      type: object
      properties:
        entitlementId:
          type: string
        consumerDomain:
          type: string
        producerDomain:
          type: string
        scopePattern:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
    ListEntitlementsResponse:
      type: object
      properties:
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
    ListBindingsResponse:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/Binding"

    CommandAccepted:
      type: object
      properties:
        requestId:
          type: string
        message:
          type: string
          example: "Domain registration request accepted"

    RegisterDomainRequest:
      type: object
      additionalProperties: false
      required: [domainName, ownerAccountId, ownerEmail, secondaryOwnerEmails]
      properties:
        domainName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        description:
          type: string
          maxLength: 256
        ownerAccountId:
          type: string
          pattern: "^[0-9]{12}$"
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        costCenter:
          type: string
          maxLength: 256
          description: Optional governed cost-allocation tag propagated to every provisioned resource. The only accepted custom tag; arbitrary tag maps are rejected.
        environmentAccounts:
          type: object
          additionalProperties:
            type: string
            pattern: "^[0-9]{12}$"
          description: Optional sparse map pinning individual platform environments to AWS accounts other than ownerAccountId. Keys must name configured platform environments (validated at registration); environments without an entry use ownerAccountId. Duplicate accounts across environments are legal. Immutable after registration.
        owningTeam:
          type: string
          description: Cognito team group that will own the domain; required for OAuth callers and must be one of the caller's team groups. IAM callers may omit it (approval then creates no owner binding).
      example:
        domainName: sales
        ownerAccountId: "111122223333"
        ownerEmail: sales-team@example.com
        secondaryOwnerEmails: ["sales-backup@example.com"]
        description: Sales domain events

    DomainSummary:
      type: object
      properties:
        domainName:
          type: string
        domainNamespace:
          type: string
          description: Environment-independent namespace identity (e.g. acme-billing).
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        status:
          type: string
        environments:
          type: array
          items:
            type: string
          example: ["dev", "staging", "prod"]
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    DomainDetail:
      type: object
      properties:
        domainName:
          type: string
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          items:
            type: string
        status:
          type: string
        environments:
          type: array
          description: Environments this domain is provisioned into.
          items:
            type: string
          example: ["dev", "staging", "prod"]
        environmentAccounts:
          type: object
          description: Effective account per environment (sparse registration overrides resolved against ownerAccountId). Absent on responses from stacks predating the field.
          additionalProperties:
            type: string
            pattern: "^[0-9]{12}$"
          example: {"dev": "111122223333", "staging": "111122223333", "prod": "444455556666"}
        costCenter:
          type: string
          description: Governed cost-center tag value set at registration or by update.
          example: "cc-5678"
        tags:
          type: object
          additionalProperties:
            type: string
        resourceArns:
          type: object
          description: >
            Per-environment resource ARN sets. Populated when the domain status
            is `ACTIVE`. Each key is an environment name from the domain's
            `environments` list.
          additionalProperties:
            $ref: "#/components/schemas/PerEnvResourceArns"
          example:
            dev:
              platformEventBusArn: "arn:aws:events:us-east-1:111122223333:event-bus/acme-dev-sales-event-bus"
              appEventBusArn: "arn:aws:events:us-east-1:444455556666:event-bus/acme-dev-sales-event-bus"
              schemaRegistryArn: "arn:aws:schemas:us-east-1:111122223333:registry/acme-dev-sales-schema-registry"
              subscriptionDlqArn: "arn:aws:sqs:us-east-1:111122223333:acme-dev-sales-subscription-dlq"
              integrationDlqArn: "arn:aws:sqs:us-east-1:444455556666:acme-dev-sales-integration-dlq"
              dashboardArn: "arn:aws:cloudwatch::111122223333:dashboard/acme-dev-sales-domain-dashboard"
        namespaceParameter:
          type: string
          description: SSM parameter path where the domain namespace is published (env-independent).
          example: "/namespace/sales"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PerEnvResourceArns:
      type: object
      description: Resource ARNs for a single environment of a domain.
      properties:
        platformEventBusArn:
          type: string
        appEventBusArn:
          type: string
        schemaRegistryArn:
          type: string
        subscriptionDlqArn:
          type: string
        integrationDlqArn:
          type: string
        dashboardArn:
          type: string

    UpdateDomainRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 256
        ownerEmail:
          type: string
          format: email
        secondaryOwnerEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        costCenter:
          type: string
          minLength: 1
          maxLength: 256
          description: Governed cost-allocation tag propagated to every provisioned resource. Change-only — an empty value is rejected; omit the field to leave it unchanged.

    ListDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainSummary"
        nextToken:
          type: string

    DomainStateResponse:
      type: object
      properties:
        domainName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        updatedAt:
          type: string
          format: date-time

    PendingRegistration:
      type: object
      properties:
        domainName:
          type: string
        description:
          type: string
        ownerAccountId:
          type: string
        ownerEmail:
          type: string
        secondaryOwnerEmails:
          type: array
          items:
            type: string
            format: email
        owningTeam:
          type: string
          description: Cognito team group that will own the domain once approved.
        environmentAccounts:
          type: object
          description: Effective account per environment (sparse registration overrides resolved against ownerAccountId), so the approver sees every account that would receive resources. Absent on responses from stacks predating the field.
          additionalProperties:
            type: string
            pattern: "^[0-9]{12}$"
        createdAt:
          type: string
          format: date-time
        taskToken:
          type: string
          description: Approval workflow task token for the decide call.

    PendingRegistrationsResponse:
      type: object
      properties:
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/PendingRegistration"
        nextToken:
          type: string

    DecideRequest:
      type: object
      required: [taskToken, decision]
      properties:
        taskToken:
          type: string
        decision:
          type: string
          enum: [ACCEPT, REJECT]
        justification:
          type: string
          maxLength: 512

    DecisionRecorded:
      type: object
      properties:
        message:
          type: string
          example: "Decision recorded"

    PublishRequest:
      type: object
      required: [domain, eventName, data]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
          description: Target domain name; the environment comes from the API stage.
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must match a schema registered for the domain.
        data:
          description: Business event payload; validated against the domain's latest registered schema at admission.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional caller idempotency key; defaults to the API Gateway request ID.
      example:
        domain: orders
        eventName: OrderNotification
        data:
          orderId: 123
          amount: 99.50

    CreateSchemaRequest:
      type: object
      required: [domain, eventName, schemaType, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
          description: Event name (detail-type); must be feasible in an EventBridge rule name.
        schemaType:
          type: string
          enum: [JSONSchemaDraft4]
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        schemaType: JSONSchemaDraft4
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    AppendSchemaVersionRequest:
      type: object
      required: [domain, eventName, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        domain: orders
        eventName: OrderNotification
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    SchemaEnvironmentContent:
      type: object
      required: [schemaName, domain, environment, version, content]
      additionalProperties: false
      properties:
        schemaName:
          type: string
          description: "{source}@{detail-type}"
        domain:
          type: string
        environment:
          type: string
        version:
          type: integer
          minimum: 1
          description: The version returned (the environment's latest when the request omitted one).
        content:
          type: string
          minLength: 1
          description: The JSON Schema document as a string.
      example:
        schemaName: acme-sales@OrderPlaced
        domain: sales
        environment: staging
        version: 2
        content: "{\"$schema\":\"http://json-schema.org/draft-04/schema#\",\"type\":\"object\"}"

    CreatePromotionRequest:
      type: object
      required: [domain, eventName]
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
      example:
        domain: orders
        eventName: OrderNotification

    PromotionConflictResponse:
      type: object
      required: [code, message, promotionId]
      properties:
        code:
          type: string
          example: ConflictException
        message:
          type: string
        promotionId:
          type: string
          description: The id of the promotion currently active for this schema and environment.

    PromotionStatusResponse:
      type: object
      required: [promotionId, schemaName, sourceEnvironment, targetEnvironment, requestedVersion, status, replayedVersions, createdAt, updatedAt]
      properties:
        promotionId:
          type: string
        schemaName:
          type: string
          description: The event name (detail-type) being promoted.
        sourceEnvironment:
          type: string
        targetEnvironment:
          type: string
        requestedVersion:
          type: integer
          description: The source's latest version at request time; the promotion replays up to it.
        status:
          type: string
          enum: [VALIDATING, REPLAYING, REPINNING, COMPLETED, FAILED, CANCELLED]
        replayedVersions:
          type: array
          items:
            type: integer
          description: Source versions durably written to the target so far.
        targetVersion:
          type: integer
          description: The target's latest version once replaying finished.
        repin:
          type: object
          properties:
            matched:
              type: integer
            repinned:
              type: integer
            failed:
              type: integer
          description: Re-pin tallies; present once re-pinning ran.
        reason:
          type: string
          enum: [DIVERGED, REPLAY_FAILED, SKIPPED_ENVIRONMENT]
          description: Failure category; present when status is FAILED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SchemaMutationResponse:
      type: object
      properties:
        schemaName:
          type: string
          example: "acme-orders@OrderNotification"
        schemaVersion:
          type: integer
          example: 1

    SubscribeRequest:
      type: object
      required: [consumerDomain, producerDomain, schemaName]
      additionalProperties: false
      properties:
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        producerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        schemaName:
          type: string
          description: "Format: {source}@{detail-type}"
          pattern: "^[^@]+@.+$"
          maxLength: 128
        environments:
          type: object
          description: >
            Optional initial per-environment desired state. Omitted
            environments default to enabled.
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        consumerDomain: checkout
        producerDomain: orders
        schemaName: acme-orders@OrderNotification
        environments:
          prod:
            enabled: false

    EnvDesiredState:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    UpdateSubscriptionStateRequest:
      type: object
      required: [subscriptionId, consumerDomain, environments]
      additionalProperties: false
      properties:
        subscriptionId:
          type: string
          description: "Format: {consumerDomain}.{producerDomain}.{detailType}; its consumer segment must equal consumerDomain"
        consumerDomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          maxLength: 64
        environments:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/EnvDesiredState"
      example:
        subscriptionId: checkout.orders.OrderNotification
        consumerDomain: checkout
        environments:
          prod:
            enabled: true

    SubscriptionSummary:
      type: object
      properties:
        subscriptionId:
          type: string
          example: checkout.orders.OrderNotification
        consumerDomain:
          type: string
        producerDomain:
          type: string
        schemaName:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, FAILED, REMOVED]
        environments:
          type: object
          description: Per-environment pinned version and state.
          additionalProperties:
            $ref: "#/components/schemas/EnvStreamState"
        createdAt:
          type: string
          format: date-time

    SubscriptionDetail:
      allOf:
        - $ref: "#/components/schemas/SubscriptionSummary"
        - type: object
          properties:
            source:
              type: string
            detailType:
              type: string
            updatedAt:
              type: string
              format: date-time
            removedAt:
              type: string
              format: date-time

    EnvStreamState:
      type: object
      properties:
        pinnedVersion:
          type: integer
          description: Schema version pinned at subscribe time for this environment.
        ruleArn:
          type: string
        enabled:
          type: boolean
          description: Desired state.
        status:
          type: string
          description: Materialized state.
          enum: [PENDING, ACTIVE, FAILED, REMOVED]

    ListSubscriptionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionSummary"

    SchemaSummary:
      type: object
      properties:
        schemaName:
          type: string
          example: acme-orders@OrderNotification
        producerDomain:
          type: string
          description: The producer domain the schema was expanded from.
        source:
          type: string
        detailType:
          type: string
        latestVersions:
          type: object
          description: Latest schema version per environment (skew visible here).
          additionalProperties:
            type: integer
          example:
            dev: 5
            staging: 3
            prod: 3
        metadataRevisions:
          type: object
          description: Active metadata revision per environment where the pointer was readable; an unreadable pointer omits the environment rather than guessing.
          additionalProperties:
            type: integer
          example:
            dev: 3
            prod: 2

    SchemaDetail:
      allOf:
        - $ref: "#/components/schemas/SchemaSummary"
        - type: object
          properties:
            content:
              type: string
              description: Schema content of the highest latest version across environments.

    GeneratorDescription:
      type: object
      required: [name, generator, source, constraint]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Dotted path of the platform-owned field in the detail object.
        generator:
          type: string
          enum: [uuid-v4, utc-timestamp, utc-date, aws-region, organisation, environment]
        source:
          type: string
          description: Where the platform sources the value.
        constraint:
          type: string
          description: The generated value's type constraint.

    ComposedContract:
      type: object
      properties:
        schemaName:
          type: string
        source:
          type: string
        detailType:
          type: string
        environment:
          type: string
        registry:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        metadataRevision:
          type: integer
          minimum: 0
          description: 0 marks the legacy pre-stamping contract.
        generation:
          type: integer
          nullable: true
          description: Pointer generation for current reads; null on historical reads.
        definitionDigest:
          type: string
          nullable: true
          description: Digest of the exact metadata definition; null for the legacy revision.
        businessContent:
          type: string
          description: The raw business document of the resolved pair.
        metadataSchema:
          type: string
          description: The exact metadata revision's compiled draft-4 schema as a string.
        generators:
          type: array
          items:
            $ref: "#/components/schemas/GeneratorDescription"
        composerFormat:
          type: integer
        composedDocument:
          type: string
          description: Offline draft-4 document that validates the full detail object ({metadata, data}).

    ContractPreviewRequest:
      type: object
      required: [domain, schemaName, environment, content]
      additionalProperties: false
      properties:
        domain:
          type: string
          description: The publisher's own domain.
        schemaName:
          type: string
          description: "Format: {source}@{detail-type}"
        environment:
          type: string
        content:
          type: string
          description: The unsaved draft-4 business document as a string.
        schemaVersion:
          type: integer
          minimum: 1
          description: Pins the composed document's version stamp; defaults to the environment's latest version, or 1 for a first draft.

    ContractPreviewResponse:
      type: object
      properties:
        schemaName:
          type: string
        source:
          type: string
        detailType:
          type: string
        environment:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        metadataRevision:
          type: integer
          minimum: 0
          description: Active metadata revision of the selected environment; 0 on the legacy baseline.
        generation:
          type: integer
          nullable: true
        metadataSchema:
          type: string
        generators:
          type: array
          items:
            $ref: "#/components/schemas/GeneratorDescription"
        composerFormat:
          type: integer
        composedDocument:
          type: string
        registered:
          type: boolean
          description: Always false; the preview composes unsaved content.
        note:
          type: string

    CreateMetadataRevisionRequest:
      type: object
      required: [expectedHead, operationId, definition]
      additionalProperties: false
      properties:
        expectedHead:
          type: integer
          minimum: 1
          description: The revision the caller believes is the head; the create fails 409 if it is not.
        operationId:
          type: string
          minLength: 1
          maxLength: 128
          description: Caller-chosen idempotency identity; an identical replay returns the recorded outcome.
        definition:
          type: object
          description: >
            The next metadata definition document. Platform-supplied fields
            (generated values) are declared here; the server owns their
            content. Must be additive-only relative to the expected head.
      example:
        expectedHead: 4
        operationId: add-region-metadata
        definition:
          fields:
            - name: traceId
              platformOwned: true

    MetadataRevision:
      type: object
      properties:
        revision:
          type: integer
        predecessor:
          type: integer
        definitionDigest:
          type: string
          description: SHA-256 digest of the canonical definition document.
        compilerFormat:
          type: integer
          description: Metadata schema compiler format the revision was compiled with.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        definition:
          type: object
          description: The stored canonical definition document.
        metadataSchema:
          type: object
          description: The compiled JSON Schema contract for composed metadata blocks.

    ListMetadataRevisionsResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/MetadataRevision"
        nextToken:
          type: string
          description: Opaque continuation token, bound to the revision partition.

    MetadataPreviewRequest:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition:
          type: object
          description: Draft metadata definition; validated but never persisted.
        environment:
          type: string
          description: Environment whose generation context the synthetic example reflects; defaults to the first configured environment.

    MetadataPreviewResponse:
      type: object
      properties:
        candidateRevision:
          type: integer
          description: The revision this draft would become if created against the current head.
        metadataSchema:
          type: object
          description: The draft's compiled JSON Schema contract.
        bounds:
          type: object
          properties:
            extensionNodesUsed:
              type: integer
            extensionNodesMax:
              type: integer
            objectLevelsMax:
              type: integer
            definitionBytesUsed:
              type: integer
            definitionBytesMax:
              type: integer
        generators:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              generator:
                type: string
              constraint:
                type: string
              source:
                type: string
                description: Where the platform sources the value (e.g., platform context, derived state).
        example:
          type: object
          description: A synthetic composed metadata block produced from the generation context.

    MetadataReadinessRequest:
      type: object
      required: [revision, environment]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        environment:
          type: string

    MetadataReadinessReport:
      type: object
      properties:
        revision:
          type: integer
        environment:
          type: string
        definitionDigest:
          type: string
        compilerFormat:
          type: integer
        checks:
          type: object
          properties:
            definitionRecompilesExactly:
              type: boolean
            generatedValuesSatisfyContract:
              type: boolean
            exampleMetadataBytes:
              type: integer
            sizeBudgetBytes:
              type: integer

    MetadataEnvironmentState:
      type: object
      properties:
        environment:
          type: string
        activeRevision:
          type: integer
          description: 0 means the legacy baseline pointer — no platform metadata is active yet.
        generation:
          type: integer
          description: Monotonic per-environment counter; every activation bumps it, invalidating generation-scoped caches.
        definitionDigest:
          type: string
        activatedBy:
          type: string
        activatedAt:
          type: string
          format: date-time

    MetadataEnvironmentList:
      type: object
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/MetadataEnvironmentState"

    MetadataActivationAudit:
      type: object
      properties:
        operation:
          type: string
          description: The mutation-record operation marker (environment-activated).
        actor:
          type: string
        beforeRevision:
          type: integer
        afterRevision:
          type: integer
        operationId:
          type: string
        occurredAt:
          type: string
          format: date-time

    MetadataActivationList:
      type: object
      properties:
        activations:
          type: array
          items:
            $ref: "#/components/schemas/MetadataActivationAudit"
        nextToken:
          type: string
          description: Opaque continuation token, bound to the audit partition.

    ActivateMetadataRequest:
      type: object
      required: [revision, environment, expectedActiveRevision, operationId]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The candidate revision; activation moves forward only.
        environment:
          type: string
          description: One of the platform's configured environments.
        expectedActiveRevision:
          type: integer
          minimum: 0
          description: The pointer's current active revision; the cutover fails 409 if it moved.
        operationId:
          type: string
          minLength: 1
          maxLength: 128
      example:
        revision: 5
        environment: prod
        expectedActiveRevision: 4
        operationId: rollout-region-metadata-prod

    ActivateMetadataResponse:
      type: object
      properties:
        environment:
          type: string
        activeRevision:
          type: integer
        generation:
          type: integer
          description: Absent on a read-only no-op response.
        activatedBy:
          type: string
        activatedAt:
          type: string
          format: date-time
        definitionDigest:
          type: string
        alreadyActive:
          type: boolean
          description: True when the request reapplied the active revision and nothing was committed.

    ListSchemasResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SchemaSummary"
        nextToken:
          type: string
          description: Opaque watermark cursor, bound to the request's filter set.
      example:
        items:
          - schemaName: acme-orders@OrderNotification
            producerDomain: orders
            source: acme-orders
            detailType: OrderNotification
            latestVersions:
              dev: 5
              prod: 3

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        reason:
          type: string
          enum: [unknownOperation, cannotParse, fieldValidationFailed, other]
        fieldList:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              message:
                type: string
