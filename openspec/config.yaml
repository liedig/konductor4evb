schema: spec-driven

context: |
  ## Tech Stack — Konductor backend
  - Rust AWS Lambda functions on Amazon Linux 2023 (arm64), built with cargo-lambda, deployed via AWS SAM/CloudFormation templates
  - lambda_runtime, tokio, serde/serde_json, tracing (JSON logs)
  - Errors: thiserror typed errors in konductor-common, anyhow with .context() at Lambda edges
  - AWS SDK for Rust: DynamoDB, EventBridge, SES, Step Functions, SQS, SSM, STS, Schemas, CloudWatch
  - jsonwebtoken + reqwest for the Cognito JWT/JWKS OAuth authorizer; uuid, chrono, sha2
  - Testing: aws-smithy-mocks (mock!/mock_client! rules), per-binary integration-style tests
  - Lint gates: cargo fmt, clippy -D warnings (workspace lints: cognitive_complexity, too_many_lines, type_complexity)
  - Architecture: Step Functions ASL state machines, DynamoDB single-table design, EventBridge buses/rules, SQS queues, SES email, Cognito, CloudWatch log metric filters + alarms, API Gateway defined by OpenAPI specs in api/

  ## Tech Stack — Web frontend
  - Nuxt + Vue SPA (no SSR), statically generated, served from S3 + CloudFront
  - Pinia for state, vue-router, aws-amplify for Cognito auth
  - Tailwind CSS via Vite plugin
  - TypeScript + vue-tsc (nuxi typecheck), ESLint
  - pnpm (pinned via packageManager field in web/package.json)

  For architecture overview: read docs/development/architecture.md
  For testing patterns: read docs/development/testing.md
  For past decisions: read docs/development/decisions.md
  For Vue conventions: read docs/development/vue.md
  For TypeScript conventions: read docs/development/typescript.md

  ## Scale Targets
  - Up to 1,000 domains per platform deployment (realistic usage in the low hundreds; the cap bounds quota planning and blast radius) and billions of events per month across cross-account scenarios
  - Automatically handle EventBridge rule limits per bus by distributing events across domain-specific buses
  - Per-domain buses and schema registries require EventBridge quota headroom (custom buses and registries per account) validated against the 1,000-domain cap
  - All cross-account operations backed by IAM, resource policies, AWS Organizations
  - Domain-level DLQs with at least 30 days of message retention

  ## Domain Glossary
  - **Domain**: A logical grouping of related events owned by a team; each domain has its own event buses, schema registry, DLQ, and monitoring
  - **Domain event buses**: EventBridge buses provisioned per domain in producer and platform accounts; consumers interact with domains, not individual buses
  - **Publish API**: Lets producers send events to a domain without knowing bus topology or cross-account routing
  - **Subscribe/Unsubscribe APIs**: Let consumers connect to or disconnect from domain events; the Konductor creates/updates/deletes rules, IAM, and resource policies behind the scenes
  - **Schema registry**: Per-domain registries storing event schemas, tracking versions, analyzing compatibility, and supporting consumer migration
  - **Platform teams**: Manage domains, Konductor policies, and governance
  - **Application teams**: Use simple publish/subscribe APIs; do not manage EventBridge resources directly

  ## Conventions
  - Coding style, testing strategy, and git workflow: AGENTS.md is the single source of truth — do not restate its rules here
  - Spec-driven development via OpenSpec for all feature planning

rules:
  proposal:
    - |
      Before creating a new spec, check existing specs in openspec/specs/ for a suitable domain match.
      This project follows DDD - prefer extending an existing spec over creating a new one.
      Only create a new spec if the change introduces a genuinely new bounded context.
  tasks:
    - Always include a task to update decision log (docs/development/decisions.md)
    - If the change affects architecture (workflows, APIs, resources, data model, events, cross-account trust), include a task to update docs/development/architecture.md
