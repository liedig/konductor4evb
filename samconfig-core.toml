version = 0.1

[default.build.parameters]
template_file = "konductor-core-stack.yaml"

[default.sync.parameters]
template_file = "konductor-core-stack.yaml"

[default.validate.parameters]
template_file = "konductor-core-stack.yaml"

[default.deploy.parameters]
stack_name = "konductor-core"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
tags = "Application=konductor Component=core auto-delete=no"
# Customer parameter values come from konductor-platform.toml (gitignored),
# validated and rendered by scripts/validate-config.py via `make deploy-core`.
