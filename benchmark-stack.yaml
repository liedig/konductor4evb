AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Throwaway in-region latency benchmark for the Nexus grant engine
  (add-grant-engine task 6.1). Deploy, invoke, tear down — this stack is not
  part of the platform. The function seeds its own fixture bindings into the
  deployed nexus-authorization-bindings table and removes them after each run.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 300
    MemorySize: 256

Resources:
  GrantBenchmarkFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-grant-benchmark"
      RetentionInDays: 7

  GrantBenchmarkFunction:
    Type: AWS::Serverless::Function
    DependsOn: GrantBenchmarkFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-grant-benchmark"
      CodeUri: ./control-plane/functions/grant-benchmark
      Handler: bootstrap
      Environment:
        Variables:
          BINDINGS_TABLE: nexus-authorization-bindings
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/nexus-authorization-bindings"

Outputs:
  GrantBenchmarkFunctionName:
    Description: Benchmark function to invoke
    Value: !Ref GrantBenchmarkFunction
