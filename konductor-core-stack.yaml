  # ---- Platform Operator Notifications (SNS) ----
  PlatformNotificationsTopic:
    Type: AWS::SNS::Topic
    Condition: NotificationsEnabled
    Properties:
      TopicName: !Sub "konductor-platform-notifications"
      DisplayName: Konductor Platform

  PlatformNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: NotificationsEnabled
    Properties:
      Topics:
        - !Ref PlatformNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PlatformNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PlatformOperatorNotificationRule.Arn

  # SNS email subscriptions require a one-time confirmation click by the
  # recipient before messages are delivered.
  PlatformOperatorSubscription:
    Type: AWS::SNS::Subscription
    Condition: NotificationsEnabled
    Properties:
      TopicArn: !Ref PlatformNotificationsTopic
      Protocol: email
      Endpoint: !Ref PlatformOperatorEmail

  # Forwards every lifecycle event on the konductor bus to operators. The
  # transformer references only envelope fields guaranteed present on all
  # events; a per-detail-type path would fail delivery for events lacking it.
  PlatformOperatorNotificationRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "konductor-platform-operator-notifications"
      EventBusName: !Ref KonductorEventBus
      EventPattern:
        source:
          - prefix: "konductor."
      Targets:
        - Id: PlatformNotificationsTopicTarget
          Arn: !Ref PlatformNotificationsTopic
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleFailureDlq.Arn
          InputTransformer:
            InputPathsMap:
              detailType: $.detail-type
              source: $.source
              time: $.time
              detail: $.detail
            InputTemplate: |
              {"event": <detailType>, "source": <source>, "time": <time>, "detail": <detail>}

  # ---- Step Functions ----
  FinalizeApprovalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-finalize-approval"
      RetentionInDays: 30

  FinalizeApprovalFunction:
    Type: AWS::Serverless::Function
    DependsOn: FinalizeApprovalFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-finalize-approval"
      CodeUri: ./domain-management/functions/finalize-approval
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${KonductorUserPool}"
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
              Resource:
                - !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:TransactWriteItems]
              Resource:
                - !GetAtt AuthorizationBindingsTable.Arn

  ApprovalWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-approval-workflow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ApprovalWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ApprovalWorkflowPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DomainsTable.Arn
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !GetAtt KonductorEventBus.Arn
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt FinalizeApprovalFunction.Arn
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  ApprovalWorkflowNotificationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ApprovalWorkflowNotificationPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt SendApprovalRequestNotificationFunction.Arn

  ApprovalWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn:
      - ApprovalWorkflowPolicy
      - ApprovalWorkflowNotificationPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-domain-approval"
      Role: !GetAtt ApprovalWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/approval.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        FinalizeApprovalFunction: !GetAtt FinalizeApprovalFunction.Arn
        SendApprovalRequestNotificationFunction: !GetAtt SendApprovalRequestNotificationFunction.Arn

  ProvisioningWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-provisioning-workflow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ProvisioningWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProvisioningWorkflowPolicy
      Roles:
        - !Ref ProvisioningWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:PutPermission
              - events:RemovePermission
              - events:PutEvents
              - events:TagResource
              - events:UntagResource
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt KonductorEventBus.Arn
          - Effect: Allow
            Action:
              - schemas:CreateRegistry
              - schemas:DeleteRegistry
              - schemas:PutResourcePolicy
              - schemas:TagResource
              - schemas:UntagResource
            Resource: !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:TagQueue
              - sqs:UntagQueue
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Organization}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutDashboard
              - cloudwatch:DeleteDashboards
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Organization}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-*"
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt DomainsTable.Arn
              - !Sub "${DomainsTable.Arn}/index/by-owner"
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt SystemTopicManagerFunction.Arn
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-konductor-trust-role"
          - Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:AddTagsToResource
              - ssm:DeleteParameter
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/namespace/*"
          - Effect: Allow
            Action:
              - ram:CreateResourceShare
              - ram:GetResourceShares
              - ram:AssociateResourceShare
              - ram:ListResources
            Resource: "*"
          - Effect: Allow
            Action:
              - states:StartExecution
              - states:DescribeExecution
              - states:StopExecution
            Resource: "*"
          - Effect: Allow
            Action:
              - events:PutTargets
              - events:PutRule
              - events:DescribeRule
            Resource: "*"
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  ProvisionEnvWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: ProvisioningWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-provision-env"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/provision-env.asl.yaml
      DefinitionSubstitutions:
        Organization: !Ref Organization
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"

  DeprovisionEnvWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: ProvisioningWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-deprovision-env"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/deprovision-env.asl.yaml
      DefinitionSubstitutions:
        Organization: !Ref Organization

  # ---- System-events topic manager ----
  # Single-domain SNS ensure/delete for the provisioning workflow's topic
  # lifecycle steps; the workflow owns all domain-record commits.
  SystemTopicManagerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-system-topic-manager"
      RetentionInDays: 30

  SystemTopicManagerFunction:
    Type: AWS::Serverless::Function
    DependsOn: SystemTopicManagerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-system-topic-manager"
      CodeUri: ./domain-management/functions/system-topic-manager
      Handler: bootstrap
      Environment:
        Variables:
          ORGANIZATION: !Ref Organization
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:CreateTopic
                - sns:DeleteTopic
                - sns:SetTopicAttributes
                - sns:ListTagsForResource
                - sns:TagResource
                - sns:UntagResource
                - sns:Subscribe
                - sns:Unsubscribe
                - sns:ListSubscriptionsByTopic
              Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Organization}-*-system-events"
  # Owner-email reconciliation: a committed owner change moves the topic's
  # default email subscription. Unconditioned — this is core topic lifecycle,
  # not part of the optional SES notification surface.
  DomainOwnerEmailChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "konductor-domain-owner-email-change"
      EventBusName: !Ref KonductorEventBus
      EventPattern:
        source:
          - konductor.domain-management
        detail-type:
          - UpdateDomainSucceeded
        detail:
          changedFields:
            - "ownerEmail"
      Targets:
        - Arn: !GetAtt SystemTopicManagerFunction.Arn
          Id: system-topic-owner-email
          InputTransformer:
            InputPathsMap:
              domainName: "$.detail.domainName"
              ownerEmail: "$.detail.ownerEmail"
              previousOwnerEmail: "$.detail.previousOwnerEmail"
            InputTemplate: '{"action":"reconcileOwnerEmail","domainName":<domainName>,"ownerEmail":<ownerEmail>,"previousOwnerEmail":<previousOwnerEmail>}'
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleFailureDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  DomainOwnerEmailChangeRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SystemTopicManagerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainOwnerEmailChangeRule.Arn
  ProvisionDomainWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: ProvisioningWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-provision-domain"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/provision-domain.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        Organization: !Ref Organization
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"
        AwsOrganizationArn: !Ref AwsOrganizationArn
        SystemTopicManagerFunctionArn: !GetAtt SystemTopicManagerFunction.Arn
        "AWS::Partition": !Ref "AWS::Partition"
        ProvisionEnvStateMachineArn: !Ref ProvisionEnvWorkflow
        DeprovisionEnvStateMachineArn: !Ref DeprovisionEnvWorkflow
      Events:
        DomainApproved:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref KonductorEventBus
            Pattern:
              detail-type:
                - DomainRegistrationApproved
              source:
                - konductor.domain-management
            DeadLetterConfig:
              Arn: !GetAtt EventBridgeRuleFailureDlq.Arn
        ProvisioningRetryRequested:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref KonductorEventBus
            Pattern:
              detail-type:
                - DomainProvisioningRetryRequested
              source:
                - konductor.domain-management
            DeadLetterConfig:
              Arn: !GetAtt EventBridgeRuleFailureDlq.Arn

  RetagWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-retag-workflow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  # Deliberately narrower than ProvisioningWorkflowPolicy: read the domain
  # record, tag existing resources, report failures. No create/delete powers.
  RetagWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: RetagWorkflowPolicy
      Roles:
        - !Ref RetagWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt DomainsTable.Arn
          - Effect: Allow
            Action:
              - events:TagResource
              - events:UntagResource
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt KonductorEventBus.Arn
          - Effect: Allow
            Action:
              - schemas:TagResource
              - schemas:UntagResource
            Resource: !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
          - Effect: Allow
            Action:
              - sqs:TagQueue
              - sqs:UntagQueue
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Organization}-*"
          - Effect: Allow
            Action:
              - sns:TagResource
              - sns:UntagResource
            Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Organization}-*-system-events"
          - Effect: Allow
            Action:
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Organization}-*"
          - Effect: Allow
            Action:
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-*"
          - Effect: Allow
            Action:
              - ssm:AddTagsToResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/namespace/*"
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-konductor-trust-role"
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  RetagDomainWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: RetagWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-retag-domain"
      Role: !GetAtt RetagWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/retag-domain.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        Organization: !Ref Organization
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"
      Events:
        # Executions are auto-named (rule targets cannot set execution names);
        # duplicate runs from event redelivery are harmless because every tag
        # call in the workflow is an idempotent upsert.
        CostCenterUpdated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref KonductorEventBus
            Pattern:
              detail-type:
                - UpdateDomainSucceeded
              source:
                - konductor.domain-management
              detail:
                changedFields:
                  - costCenter
            DeadLetterConfig:
              Arn: !GetAtt EventBridgeRuleFailureDlq.Arn

  SubscriptionWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-subscription-workflow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  SubscriptionWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SubscriptionWorkflowPolicy
      Roles:
        - !Ref SubscriptionWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Rule/target/alarm creation moved into the materialize function
          # (follow-schema-promotion); the workflows only tear down
          # (remove-subscription) and invoke it (activate-subscription).
          - Effect: Allow
            Action:
              - events:DeleteRule
              - events:DescribeRule
              - events:RemoveTargets
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt KonductorEventBus.Arn
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt MaterializeSubscriptionEnvFunction.Arn
          - Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
            Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-*"
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource: !GetAtt EventStreamsTable.Arn
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  ActivateSubscriptionWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: SubscriptionWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-activate-subscription"
      Role: !GetAtt SubscriptionWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./event-streams/state-machines/activate-subscription.asl.yaml
      DefinitionSubstitutions:
        EventStreamsTable: !Ref EventStreamsTable
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        MaterializeEnvFunctionArn: !GetAtt MaterializeSubscriptionEnvFunction.Arn

  RemoveSubscriptionWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: SubscriptionWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-remove-subscription"
      Role: !GetAtt SubscriptionWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./event-streams/state-machines/remove-subscription.asl.yaml
      DefinitionSubstitutions:
        EventStreamsTable: !Ref EventStreamsTable
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        Organization: !Ref Organization

  # --- Web console hosting (add-konductor-web-ui) --------------------------------
  # Static SPA: private S3 origin behind CloudFront (TLS, SPA fallback, strict
  # response headers). `make deploy-web` publishes the build and config.json.

  KonductorWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Organization}-konductor-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  KonductorWebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Organization}-konductor-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  KonductorWebResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${Organization}-konductor-web"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            # CSP wildcards only match the leftmost label, so region-scoped
            # AWS endpoints are spelled out via the deployment region.
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  # Rewrites client-side routes to index.html on the static behavior only.
  # Extension-bearing paths (/_nuxt/*.js, /config.json, /favicon.svg) pass
  # through; the /api/* behavior never invokes this function.
  KonductorWebSpaFallbackFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: konductor-web-spa-fallback
      AutoPublish: true
      FunctionConfig:
        Comment: SPA fallback for the Konductor web console
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.method !== 'GET' && request.method !== 'HEAD') {
            return request;
          }
          if (request.uri.indexOf('.') !== -1) {
            return request;
          }
          request.uri = '/index.html';
          return request;
        }

  # Strips the /api prefix from API calls so /api/{environment}/... reaches
  # the {environment} stage of the OAuth API. One prefix covers every
  # configured environment: CacheBehaviors is a list, so per-environment
  # behaviors could not be generated from the environment list.
  KonductorWebApiRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: konductor-web-api-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Strips the /api prefix so the path segment selects the API stage
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api/, '');
          return request;
        }

  KonductorWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Konductor web console
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-web
            DomainName: !GetAtt KonductorWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt KonductorWebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # Same-origin API access: the console calls its own distribution at
          # /api/{environment}/*, which proxies to the OAuth API. This keeps
          # the browser same-origin (no CORS surface) and connect-src 'self'.
          - Id: oauth-api
            DomainName: !Sub "${KonductorOAuthApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed CachingOptimized policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref KonductorWebResponseHeadersPolicy
          # SPA fallback happens here (viewer-request) rather than in
          # CustomErrorResponses: distribution-level error pages would also
          # rewrite API errors from the /{stage}/* behaviors into 200 +
          # index.html, silently turning failed API calls into fake successes.
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt KonductorWebSpaFallbackFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # config.json is rewritten by every deploy — never serve it stale.
          - PathPattern: /config.json
            TargetOriginId: s3-web
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # Managed CachingDisabled policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref KonductorWebResponseHeadersPolicy
          # All API traffic shares one behavior: the viewer-request function
          # strips /api, and the remaining path's first segment is the
          # environment-named API Gateway stage.
          - PathPattern: /api/*
            TargetOriginId: oauth-api
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # Managed CachingDisabled + AllViewerExceptHostHeader (API Gateway
            # derives the host from the origin domain)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref KonductorWebResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt KonductorWebApiRewriteFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  KonductorWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KonductorWebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${KonductorWebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${KonductorWebDistribution}"

Outputs:
  OAuthApiEndpoint:
    Description: Interactive OAuth control-plane API endpoint (dev stage; swap for staging or prod to target another environment)
    Value: !Sub "https://${KonductorOAuthApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  IamApiEndpoint:
    Description: AWS_IAM control-plane API endpoint for automation (dev stage; swap for staging or prod to target another environment)
    Value: !Sub "https://${KonductorIamApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  KonductorUserPoolId:
    Description: Cognito user pool backing interactive sign-in
    Value: !Ref KonductorUserPool
  KonductorUserPoolClientId:
    Description: Public user-pool client for SRP login from custom consoles
    Value: !Ref KonductorUserPoolClient
  KonductorWebUrl:
    Description: Web console URL (CloudFront distribution)
    Value: !Sub "https://${KonductorWebDistribution.DomainName}"
  KonductorWebBucketName:
    Description: S3 bucket holding the web console build
    Value: !Ref KonductorWebBucket
  KonductorWebDistributionId:
    Description: CloudFront distribution ID for web console cache invalidation
    Value: !Ref KonductorWebDistribution
  KonductorEventBusArn:
    Description: EventBridge Konductor event bus ARN
    Value: !GetAtt KonductorEventBus.Arn
  DomainsTableName:
    Description: Domains DynamoDB table name
    Value: !Ref DomainsTable
  KonductorFunctionRoleArn:
    Description: Trust-anchor role ARN (pass as KonductorRoleArn to trust-stack.yaml)
    Value: !GetAtt KonductorTrustAnchorRole.Arn
  ProvisioningWorkflowRoleArn:
    Description: Provisioning workflow role ARN (pass as ProvisioningWorkflowRoleArn to trust-stack.yaml)
    Value: !GetAtt ProvisioningWorkflowRole.Arn
  KonductorEnvironments:
    Description: Comma-joined platform environment list every domain provisions into (drives the console's per-environment account overrides)
    Value: !Join [",", !Ref Environments]
  RetagWorkflowRoleArn:
    Description: Cost-center retag workflow role ARN (pass as RetagWorkflowRoleArn to trust-stack.yaml)
    Value: !GetAtt RetagWorkflowRole.Arn
  LambdaFailureDlqUrl:
    Description: Lambda Dead Letter Queue URL for monitoring failed async invocations
    Value: !Ref LambdaFailureDlq
  EventStreamsTableName:
    Description: Event streams DynamoDB table name
    Value: !Ref EventStreamsTable
  AuthorizationBindingsTableName:
    Description: Authorization bindings DynamoDB table name
    Value: !Ref AuthorizationBindingsTable
  BindingsTableReadPolicyArn:
    Description: Reserved read-only bindings-table managed policy (attach to future publisher consumers)
    Value: !Ref BindingsTableReadPolicy
  AuthorizationEntitlementsTableName:
    Description: Authorization entitlements DynamoDB table name
    Value: !Ref AuthorizationEntitlementsTable
  AuthorizationEntitlementsTableStreamArn:
    Description: Authorization entitlements table stream ARN (OLD_IMAGE) for the revocation worker
    Value: !GetAtt AuthorizationEntitlementsTable.StreamArn
  EntitlementsTableReadPolicyArn:
    Description: Reserved read-only entitlements-table managed policy (attach to coverage-decision consumers)
    Value: !Ref EntitlementsTableReadPolicy
  MetadataConfigurationTableName:
    Description: Platform metadata configuration DynamoDB table name (for future admission consumers)
    Value: !Ref MetadataConfigurationTable
  MetadataPointerReadPolicyArn:
    Description: Reserved read-only metadata pointer resolution managed policy (attach to publish admission)
    Value: !Ref MetadataPointerReadPolicy
  SubscriptionDeliveryRoleArn:
    Description: Role EventBridge assumes to deliver subscription events to app-side buses
    Value: !GetAtt SubscriptionDeliveryRole.Arn
  DeprovisionEnvStateMachineArn:
    Description: Per-environment teardown workflow ARN (used by provisioning rollback and scripts/teardown-domain.sh)
    Value: !Ref DeprovisionEnvWorkflow
  RetagDomainStateMachineArn:
    Description: Cost-center retag workflow ARN (triggered by UpdateDomainSucceeded events carrying costCenter in changedFields)
    Value: !Ref RetagDomainWorkflow
  CognitoUserPoolId:
    Description: Cognito user pool ID for interactive control-plane identity
    Value: !Ref KonductorUserPool
  CognitoUserPoolIssuer:
    Description: Issuer (iss) URL the OAuth authorizer validates tokens against
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${KonductorUserPool}"
  CognitoUserPoolClientId:
    Description: OAuth app client ID for the interactive control-plane client
    Value: !Ref KonductorUserPoolClient
  CognitoJwksUri:
    Description: JWKS document URL used by the OAuth authorizer to verify token signatures
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${KonductorUserPool}/.well-known/jwks.json"
  CognitoOAuthDomain:
    Description: Hosted UI / OAuth endpoint base URL for the interactive sign-in experience
    Value: !Sub "https://${KonductorUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
