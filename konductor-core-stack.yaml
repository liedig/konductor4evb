  # The approval request function deploys even with notifications disabled:
  # it stores the task token the decide endpoint resumes, and skips the email
  # when either address is empty.
  SendApprovalRequestNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-send-approval-request-notification"
