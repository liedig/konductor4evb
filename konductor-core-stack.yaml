AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EventBridge Konductor

Parameters:
  Environments:
    Type: CommaDelimitedList
    Default: "dev,staging,prod"
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,31}(,[a-z0-9][a-z0-9-]{0,31})*$"
    Description: >
      Comma-delimited list of environments every approved domain will be
      provisioned into (no spaces around commas). Platform-team configured;
      domain requesters have no say. Each entry must match
      ^[a-z0-9][a-z0-9-]{0,31}$ and be unique; 1-10 entries (API stage quota).
      Fixed at setup: changing the list on an existing installation means a
      new deployment.
  Organization:
    Type: String
    AllowedPattern: "^[a-z0-9]([a-z0-9-]{0,41}[a-z0-9])$"
    Description: >
      Organization identifier used in resource naming: 2-43 lowercase
      letters, digits, or hyphens, starting and ending with a letter or
      digit. The 43-character bound derives from the 64-character IAM
      role-name limit for the <org>-konductor-trust-role deployed into each
      domain account. Fixed at setup: changing it on an existing
      installation means a new deployment.
  NamespacePattern:
    Type: String
    Default: "{org}-{env}-{domain}"
    MaxLength: 128
    AllowedPattern: "^([a-z0-9-]|\\{org\\}|\\{env\\}|\\{domain\\})+$"
    Description: >
      Naming convention for domain resources (per-env buses, schema registries,
      DLQs, dashboards, alarms). Must contain the {org}, {env}, and {domain}
      placeholders (enforced by preflight validation); literal characters are
      restricted to lowercase, digits, and hyphens so substituted names stay
      valid for the strictest services (SQS queue names). Does not apply to
      Konductor platform resources, which use the fixed {org}-konductor-*
      pattern. Fixed at setup: changing it on an existing installation means a
      new deployment.
  AwsOrganizationArn:
    Type: String
    Description: >-
      ARN of the AWS Organization used for RAM sharing of domain namespaces
      (e.g., arn:aws:organizations::123456789012:organization/o-abc123).
      Distinct from the Organization parameter, which is the short org
      identifier used in Konductor resource naming.
  NotificationSenderEmail:
    Type: String
    Default: ""
    Description: Verified SES sender address used as the From on all Konductor notification emails. Both this and PlatformOperatorEmail must be non-empty to deploy notification resources.
  PlatformOperatorEmail:
    Type: String
    Default: ""
    Description: Verified SES recipient that receives domain approval requests and lifecycle event notifications (the platform team inbox). Both this and NotificationSenderEmail must be non-empty to deploy notification resources.

  SchemaRepinDrainSeconds:
    Type: Number
    Default: 300
    MinValue: 120
    Description: >
      Seconds a promotion waits between widening subscription rule patterns
      to admit in-flight events and narrowing them to the new pin. Must
      outlast the producer flush SLA (event put to rule evaluation), which
      is measured in minutes for batched producers.
  SystemEventEmissionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Emits SubscriptionUpgradeStarted/SubscriptionUpgraded system events
      during schema re-pins and projects them onto per-domain system-events
      topics. Deploy with false; enable only after the system-events
      infrastructure (registry, bus archive, topics) is in place, per
      docs/guides/system-events.md.
  AccessTokenValidityMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: >
      Bounded Cognito access-token lifetime (minutes) for the interactive OAuth
      client. Offline JWT validation cannot revoke an already-issued token, so
      stale access ends no later than this many minutes after issue.
  OAuthCallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/callback"
    Description: >
      Allowed OAuth redirect (callback) URLs for the interactive app client.
      Must be HTTPS in non-local deployments.
  OAuthLogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/logout"
    Description: >
      Allowed OAuth sign-out (logout) URLs for the interactive app client.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        RUST_LOG: info
        ENVIRONMENTS: !Join [",", !Ref Environments]
        ORGANIZATION: !Ref Organization
        NAMESPACE_PATTERN: !Ref NamespacePattern
        DOMAINS_TABLE: !Ref DomainsTable
        EVENT_STREAMS_TABLE: !Ref EventStreamsTable
        KONDUKTOR_EVENT_BUS: !Ref KonductorEventBus
        DOMAIN_REGISTRATIONS_QUEUE_URL: !Ref DomainRegistrationsQueue

Conditions:
  NotificationsEnabled:
    Fn::And:
      - !Not [!Equals [!Ref NotificationSenderEmail, ""]]
      - !Not [!Equals [!Ref PlatformOperatorEmail, ""]]

Resources:
  # ---- Platform tooling ----
  # Console grouping for operators: every resource this stack owns, always in
  # sync with the stack itself (no tag bookkeeping).
  KonductorCoreResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: konductor-core
      Description: All resources managed by the konductor-core stack
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
        Query:
          StackIdentifier: !Ref AWS::StackId

  # ---- EventBridge ----
  KonductorEventBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "konductor-bus"

  # ---- DynamoDB ----
  DomainsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-domains"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: domainName
          AttributeType: S
        - AttributeName: ownerAccountId
          AttributeType: S
        - AttributeName: status
          AttributeType: S

      KeySchema:
        - AttributeName: domainName
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-owner
          KeySchema:
            - AttributeName: ownerAccountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  # ---- DynamoDB (event streams) ----
  # Source of intent for subscriptions; EventBridge rules are the materialization.
  EventStreamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-event-streams"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: producerDomain
          AttributeType: S
        - AttributeName: schemaConsumer
          AttributeType: S
        - AttributeName: consumerDomain
          AttributeType: S
      KeySchema:
        - AttributeName: producerDomain
          KeyType: HASH
        - AttributeName: schemaConsumer
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-consumer
          KeySchema:
            - AttributeName: consumerDomain
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # ---- DynamoDB (schema promotions) ----
  # Promotion head items double as per-target leases; the NEW_AND_OLD_IMAGES
  # stream starts the promotion workflow and emits lifecycle events. The
  # REPIN sort key holds re-pin coordination state per schema and environment.
  SchemaPromotionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-schema-promotions"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---- DynamoDB (schema version content) ----
  # Canonical content of every schema version per environment. The registry
  # serves only the latest version and normalizes whitespace, so this store
  # is what makes replay and divergence detection possible. No stream: all
  # side effects ride on the promotions table's stream.
  SchemaVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-schema-versions"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
  # ---- DynamoDB (authorization bindings) ----
  # Single-table grant store: RoleBinding items keyed by principal, AuditRecord
  # items keyed by binding. GSIs are sparse (bindings only) and serve
  # administration paths; authorization decisions use strongly consistent
  # point reads on the table keys.
  AuthorizationBindingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-authorization-bindings"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: bindingId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-domain
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: by-binding-id
          KeySchema:
            - AttributeName: bindingId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Grant-engine decision reads are strongly consistent point gets on the
  # table keys, so GetItem on the table is the entire permission set.
  # Attached to every function that authorizes through bindings (subscription
  # commands and reads, revocation worker, publisher APIs).
  BindingsTableReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "konductor-bindings-table-read"
      Description: Read-only bindings-table access for grant-engine decision consumers
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt AuthorizationBindingsTable.Arn

  # ---- DynamoDB (authorization entitlements) ----
  # Consumer-coverage store: Entitlement items keyed by consumer domain,
  # EntitlementAuditRecord items keyed by entitlement. Sparse GSIs serve
  # administration paths; coverage decisions use strongly consistent queries
  # on the consumer partition. The OLD_IMAGE stream feeds the revocation
  # worker with each removed entitlement's full prior state.
  AuthorizationEntitlementsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-authorization-entitlements"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: OLD_IMAGE
      # Marker items written by the stream consumer carry this TTL so
      # idempotency state never accumulates.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: entitlementId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-producer
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: by-entitlement-id
          KeySchema:
            - AttributeName: entitlementId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Decision reads are strongly consistent queries on the consumer partition,
  # so Query on the table is the entire permission set. Attached to the
  # subscription command consumer and the activation workflow role.
  EntitlementsTableReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "konductor-entitlements-table-read"
      Description: Read-only entitlements-table access for coverage-decision consumers
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !GetAtt AuthorizationEntitlementsTable.Arn

  # ---- DynamoDB (metadata configuration) ----
  # Platform-owned event metadata: immutable additive revisions (REVISION
  # items), the global revision head (HEAD), per-environment active pointers
  # (ENV — the hot admission reads never share a partition with revision or
  # audit traffic), and permanent mutation/audit records (AUDIT). Only
  # stream-consumer marker items set the TTL attribute; revisions, pointers,
  # and audit records are permanent. The NEW_IMAGE stream drives lifecycle
  # emission from committed state.
  MetadataConfigurationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "konductor-metadata-configuration"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Metadata administration: one conditional transaction per mutation, plus
  # strongly consistent reads of revisions, head, and environment pointers.
  MetadataAdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "konductor-metadata-admin"
      Description: Metadata configuration administration (revision and pointer transactions, reads)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:TransactWriteItems
            Resource: !GetAtt MetadataConfigurationTable.Arn

  # Admission's authoritative environment-pointer resolution: strongly
  # consistent GetItem only, never writes.
  MetadataPointerReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "konductor-metadata-pointer-read"
      Description: Read-only metadata pointer resolution for publish admission
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt MetadataConfigurationTable.Arn

  # ---- Dead Letter Queue (read Lambda functions) ----
  LambdaFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-lambda-failure-dlq"
      MessageRetentionPeriod: 1209600

  # ---- Shared DLQ for EventBridge rule delivery failures ----
  EventBridgeRuleFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-eventbridge-rule-failure-dlq"
      MessageRetentionPeriod: 1209600

  EventBridgeRuleFailureDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeRuleFailureDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeRuleFailureDlq.Arn
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${KonductorEventBus}/*"

  # ---- Command Queues ----
  DomainRegistrationsDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-domain-registrations-dlq"
      MessageRetentionPeriod: 1209600

  DomainRegistrationsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-domain-registrations-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DomainRegistrationsDlq.Arn
        maxReceiveCount: 3

  SubscriptionsDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-subscriptions-dlq"
      MessageRetentionPeriod: 1209600

  SubscriptionsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-subscriptions-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SubscriptionsDlq.Arn
        maxReceiveCount: 3

  PublishDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-publish-dlq"
      MessageRetentionPeriod: 1209600

  PublishQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-publish-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PublishDlq.Arn
        maxReceiveCount: 3

  # Admission is the only legitimate writer: a queued command is proof of
  # validation, so any other principal able to SendMessage could inject
  # unvalidated events. IAM-side grants are already admission-only; this deny
  # closes the same-account-broad-permissions hole. Consequence: console/CLI
  # DLQ redrive is also denied — re-drive by re-publishing through /publish
  # (the DLQ retains the original body for exactly that).
  PublishQueueAdmissionOnlyPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PublishQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonAdmissionSenders
            Effect: Deny
            Principal: "*"
            # sqs:SendMessage authorizes both SendMessage and SendMessageBatch
            # (the batch API has no distinct IAM action), so this single deny
            # closes the batch injection path too.
            Action:
              - sqs:SendMessage
            Resource: !GetAtt PublishQueue.Arn
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt PublishEventsAdmissionFunctionRole.Arn
                  - !Sub
                    - "arn:aws:sts::${AWS::AccountId}:assumed-role/${AdmissionRoleName}/*"
                    - AdmissionRoleName: !Select [1, !Split [":role/", !GetAtt PublishEventsAdmissionFunctionRole.Arn]]

  EntitlementRevocationDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-entitlement-revocation-dlq"
      MessageRetentionPeriod: 1209600

  EntitlementRevocationQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-entitlement-revocation-queue"
      # The worker disables rules across every candidate subscription; the
      # timeout must cover a bounded batch of EventBridge writes.
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EntitlementRevocationDlq.Arn
        maxReceiveCount: 3

  SubscriptionsDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-subscriptions-dlq-depth-alarm"
      AlarmDescription: Subscription commands accumulating in the DLQ — inspect and replay
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SubscriptionsDlq.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---- Entitlement revocation observability ----
  # Revocation is intent-synchronous, enforcement-eventual: these alarms
  # bound the convergence path (stream consumer → queue → worker) and the
  # sweep backstop. No metric records schema content, tokens, or claims.
  EntitlementRevocationDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-entitlement-revocation-dlq-depth-alarm"
      AlarmDescription: Revocation messages permanently failed — redrive after fixing the cause
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EntitlementRevocationDlq.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EntitlementStreamConsumerIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-entitlement-stream-consumer-iterator-age-alarm"
      AlarmDescription: Entitlement stream consumer falling behind — revocation notification delayed
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref EntitlementStreamConsumerFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  MetadataStreamConsumerIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-metadata-stream-consumer-iterator-age-alarm"
      AlarmDescription: Metadata stream consumer falling behind — lifecycle events delayed; recover before the 24-hour stream window closes
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref MetadataStreamConsumerFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  EntitlementRevocationWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-entitlement-revocation-worker-errors-alarm"
      AlarmDescription: Revocation worker invocations failing — messages retry; check logs before the DLQ fills
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EntitlementRevocationWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # The sweep normally finds nothing — the stream-driven worker converges
  # revocations first. Any drift disablement means a revocation slipped past
  # the fast path (or out-of-band rule drift) and is worth investigating.
  EntitlementCoverageSweepDriftFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EntitlementCoverageSweepLogGroup
      FilterPattern: '{ $.fields.message = "sweep disabled uncovered*" }'
      MetricTransformations:
        - MetricName: EntitlementCoverageSweepDriftDisablements
          MetricNamespace: Konductor/Entitlements
          MetricValue: "1"

  EntitlementCoverageSweepDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-entitlement-coverage-sweep-drift-alarm"
      AlarmDescription: Reconciliation sweep disabled drifted rules — a revocation missed the fast path
      Namespace: Konductor/Entitlements
      MetricName: EntitlementCoverageSweepDriftDisablements
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Individual denials are expected (fail-closed posture); a spike signals a
  # misconfigured seeding, a client regression, or probing.
  SubscriptionAuthorizationDenialsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SubscriptionsLogGroup
      FilterPattern: '{ $.fields.message = "*deny*" || $.fields.message = "*denied*" }'
      MetricTransformations:
        - MetricName: SubscriptionAuthorizationDenials
          MetricNamespace: Konductor/Entitlements
          MetricValue: "1"

  SubscriptionAuthorizationDenialsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-subscription-authorization-denials-alarm"
      AlarmDescription: Elevated subscription authorization denial rate — check seeding and client configuration
      Namespace: Konductor/Entitlements
      MetricName: SubscriptionAuthorizationDenials
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # The catalog fans out to registry ListSchemas plus bounded DescribeSchema
  # calls per page; sustained latency creep signals quota contention with
  # publishing or a crawler.
  CatalogLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-catalog-latency-alarm"
      AlarmDescription: Catalog pages consistently slow — check registry quota contention or crawling callers
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ListSchemasFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---- CloudWatch Log Groups ----
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/konductor-api"
      RetentionInDays: 30

  ListDomainsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-list-domains"
      RetentionInDays: 30

  DescribeDomainLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-describe-domain"
      RetentionInDays: 30

  # ---- IAM ----
  # Dedicated trust-anchor role referenced by trust-stack.yaml KonductorRoleArn parameter.
  # Not used as a Lambda execution role; cross-account provisioning is handled by Step Functions.
  KonductorTrustAnchorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  KonductorTrustAnchorPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CrossAccountAssumeRole
      Roles:
        - !Ref KonductorTrustAnchorRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-konductor-trust-role"

  KonductorApiSqsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-apigw-sqs-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole

  KonductorApiSqsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SendToDomainRegistrations
      Roles:
        - !Ref KonductorApiSqsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt DomainRegistrationsQueue.Arn
              - !GetAtt SubscriptionsQueue.Arn

  # Assumed by EventBridge to deliver matched events onto consumer app-side
  # buses cross-account, under the provision-time resource policy on those buses.
  SubscriptionDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-subscription-delivery-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole

  SubscriptionDeliveryPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DeliverToAppBuses
      Roles:
        - !Ref SubscriptionDeliveryRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !Sub "arn:aws:events:${AWS::Region}:*:event-bus/${Organization}-*"

  # ---- API Gateway ----
  # Account-level API Gateway logging role: any stage with AccessLogSetting
  # requires it, and the service validates it at stage update time.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  IamApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/konductor-iam-api"
      RetentionInDays: 30

  KonductorOAuthApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "konductor-KonductorOAuthApi"
      # Stages are environment selectors. SAM manages the authoring stage
      # (the first configured environment); every other environment's stage is
      # rendered into this template's marked block at deploy time, sharing
      # this deployment. The marker comment lets scripts/validate-config.py
      # --render-stages rewrite StageName when the authoring environment is
      # not the default `dev`.
      StageName: dev # konductor:authoring-stage
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Auth:
        DefaultAuthorizer: OAuthRequestAuthorizer
        Authorizers:
          OAuthRequestAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt OAuthAuthorizerFunction.Arn
            # TTL 0 (spec default: caching disabled) is dropped by the SAM
            # transform's zero-value omission, leaving the API Gateway default
            # of 300s. The authorizer policy spans every stage of the invoked
            # route, so the (token, httpMethod, resourcePath) cache key — which
            # omits the stage — cannot poison the same route on another stage
            # when the console switches environments.
            AuthorizerResultTtlInSeconds: 300
            Identity:
              Headers:
                - Authorization
              Context:
                - httpMethod
                - resourcePath
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi-oauth.yaml

  KonductorIamApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "konductor-KonductorIamApi"
      StageName: dev # konductor:authoring-stage
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt IamApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Auth:
        DefaultAuthorizer: AWS_IAM
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi-iam.yaml

  # Environment-named stages beyond the authoring stage, sharing each API's
  # SAM-managed deployment ({ Ref: <Api>.Deployment } is SAM's referenceable
  # property for the generated AWS::ApiGateway::Deployment). Rendered inline
  # at deploy time from the configured environment list by
  # scripts/validate-config.py --render-stages; the committed block matches
  # the default [dev, staging, prod] list.
  # konductor:rendered-stages-begin
  # Generated by scripts/validate-config.py --render-stages from the
  # validated environment list (konductor-platform.toml). Do not edit
  # by hand.

  KonductorOAuthApiStagingStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RestApiId: { Ref: KonductorOAuthApi }
      DeploymentId: { Ref: KonductorOAuthApi.Deployment }
      StageName: staging
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: { Fn::GetAtt: [ApiAccessLogGroup, Arn] }
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  KonductorIamApiStagingStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RestApiId: { Ref: KonductorIamApi }
      DeploymentId: { Ref: KonductorIamApi.Deployment }
      StageName: staging
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: { Fn::GetAtt: [IamApiAccessLogGroup, Arn] }
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  KonductorOAuthApiProdStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RestApiId: { Ref: KonductorOAuthApi }
      DeploymentId: { Ref: KonductorOAuthApi.Deployment }
      StageName: prod
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: { Fn::GetAtt: [ApiAccessLogGroup, Arn] }
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  KonductorIamApiProdStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RestApiId: { Ref: KonductorIamApi }
      DeploymentId: { Ref: KonductorIamApi.Deployment }
      StageName: prod
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: { Fn::GetAtt: [IamApiAccessLogGroup, Arn] }
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
  # konductor:rendered-stages-end

  # ---- Cognito Identity (interactive OAuth foundation) ----
  KonductorUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Organization}-konductor-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  KonductorUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${Organization}-konductor-${AWS::AccountId}"
      UserPoolId: !Ref KonductorUserPool

  KonductorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref KonductorUserPool
      ClientName: !Sub "${Organization}-konductor-control-plane"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      # SRP + refresh for custom (non-hosted-UI) login clients; USER_PASSWORD_AUTH
      # stays off so passwords never traverse the client.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      # SRP sign-in never redirects, so callback/logout URLs are inert for the
      # console; local dev origins come from the parameters. (Referencing the
      # web distribution here would cycle: authorizer → client → distribution
      # → OAuth API → authorizer.)
      CallbackURLs: !Ref OAuthCallbackUrls
      LogoutURLs: !Ref OAuthLogoutUrls
      AccessTokenValidity: !Ref AccessTokenValidityMinutes
      IdTokenValidity: !Ref AccessTokenValidityMinutes
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  KonductorPlatformAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: platform-admin
      UserPoolId: !Ref KonductorUserPool
      Description: Platform administrators (global role; may administer domains and approve registrations)

  KonductorPlatformAuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: platform-auditor
      UserPoolId: !Ref KonductorUserPool
      Description: Platform auditors (global read-only role; cannot mutate or approve)

  OAuthAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-oauth-authorizer"
      RetentionInDays: 30

  OAuthAuthorizerFunction:
    Type: AWS::Serverless::Function
    DependsOn: OAuthAuthorizerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-oauth-authorizer"
      CodeUri: ./control-plane/functions/oauth-authorizer
      Handler: bootstrap
      Description: REQUEST authorizer validating Cognito access tokens for the interactive OAuth control-plane API
      Environment:
        Variables:
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${KonductorUserPool}"
          COGNITO_CLIENT_ID: !Ref KonductorUserPoolClient
          COGNITO_JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${KonductorUserPool}/.well-known/jwks.json"

  # ---- Domain Management Functions (Read) ----
  ListDomainsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListDomainsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-list-domains"
      CodeUri: ./domain-management/functions/list-domains
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt AuthorizationBindingsTable.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /domains
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /domains
            Method: GET

  PendingRegistrationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-pending-registrations"
      RetentionInDays: 30

  # The platform-admin approvals inbox. OAuth surface only: the response
  # carries workflow task tokens, so IAM automation gets no route and the
  # handler itself still requires a platform-admin principal.
  PendingRegistrationsFunction:
    Type: AWS::Serverless::Function
    DependsOn: PendingRegistrationsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-pending-registrations"
      CodeUri: ./domain-management/functions/pending-registrations
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !Sub "${DomainsTable.Arn}/index/by-status"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /domains/registrations/pending
            Method: GET

  DescribeDomainFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeDomainLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-describe-domain"
      CodeUri: ./domain-management/functions/describe-domain
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
        - !Ref BindingsTableReadPolicy
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /domains/{domainName}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /domains/{domainName}
            Method: GET

  DomainStateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-domain-state"
      RetentionInDays: 30

  # Platform-managed enable/disable (ACTIVE <-> INACTIVE) plus provisioning
  # retry for failed domains (re-emits the provisioning trigger event).
  DomainStateFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainStateLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-domain-state"
      CodeUri: ./domain-management/functions/domain-state
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource:
                - !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [events:PutEvents]
              Resource:
                - !GetAtt KonductorEventBus.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /domains/{domainName}/state
            Method: POST

  # ---- Event Stream Functions (Read) ----
  ListSubscriptionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-list-subscriptions"
      RetentionInDays: 30

  ListSubscriptionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListSubscriptionsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-list-subscriptions"
      CodeUri: ./event-streams/functions/list-subscriptions
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      Policies:
        # Direction authorization is a binding point read.
        - !Ref BindingsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !Sub "${EventStreamsTable.Arn}/index/*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /subscriptions
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /subscriptions
            Method: GET

  DescribeSubscriptionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-describe-subscription"
      RetentionInDays: 30

  DescribeSubscriptionFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeSubscriptionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-describe-subscription"
      CodeUri: ./event-streams/functions/describe-subscription
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      Policies:
        # Either-side authorization is a binding point read.
        - !Ref BindingsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource:
                - !GetAtt EventStreamsTable.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /subscriptions/{subscriptionId}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /subscriptions/{subscriptionId}
            Method: GET

  ListSchemasLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-list-schemas"
      RetentionInDays: 30

  ListSchemasFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListSchemasLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-list-schemas"
      CodeUri: ./event-streams/functions/list-schemas
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          METADATA_TABLE: !Ref MetadataConfigurationTable
      Policies:
        # Catalog authorization: subscriber-binding point read plus the
        # strongly consistent consumer-partition entitlement query.
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        # Per-environment active metadata revision summaries: pointer reads only.
        - !Ref MetadataPointerReadPolicy
        - Version: '2012-10-17'
          Statement:
            # ACTIVE-domain expansion reads; Scan serves the platform-wide
            # catalog path (bounded by the 1,000-domain deployment cap).
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [schemas:ListSchemas, schemas:ListSchemaVersions, schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas
            Method: GET

  DescribeSchemaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-describe-schema"
      RetentionInDays: 30

  DescribeSchemaFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeSchemaLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-describe-schema"
      CodeUri: ./event-streams/functions/describe-schema
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          METADATA_TABLE: !Ref MetadataConfigurationTable
      Policies:
        # Detail authorization: subscriber-binding point read plus the
        # coverage query on the consumer entitlement partition.
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        # Composed-contract discovery: pointer and revision reads only.
        - !Ref MetadataPointerReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [schemas:ListSchemaVersions, schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/{schemaName}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/{schemaName}
            Method: GET
        ContractOAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/{schemaName}/contract
            Method: GET
        ContractIamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/{schemaName}/contract
            Method: GET
        PreviewOAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/contract-preview
            Method: POST
        PreviewIamApi:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/contract-preview
            Method: POST

  # ---- Command Handler Functions ----
  DomainRegistrationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-domain-registrations"
      RetentionInDays: 30

  DomainRegistrationsFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainRegistrationsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-domain-registrations"
      CodeUri: ./domain-management/functions/domain-registrations
      Handler: bootstrap
      Environment:
        Variables:
          APPROVAL_STATE_MACHINE_ARN: !Ref ApprovalWorkflow
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource:
                - !GetAtt AuthorizationBindingsTable.Arn
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt KonductorEventBus.Arn
            - Effect: Allow
              Action: [events:RemovePermission]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
            - Effect: Allow
              Action: [events:DescribeEventBus]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/namespace/*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ApprovalWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt DomainRegistrationsQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DomainRegistrationsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Domain-count capacity reporting ----
  # The registration ceiling counter is a DynamoDB item with no native
  # CloudWatch metric, so an hourly reporter logs the current count; the
  # metric filter and alarm below page at 80% of the 1,000-domain cap.
  DomainCountReporterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-domain-count-reporter"
      RetentionInDays: 30

  DomainCountReporterFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainCountReporterLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-domain-count-reporter"
      CodeUri: ./domain-management/functions/domain-count-reporter
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource:
                - !GetAtt DomainsTable.Arn
      Events:
        HourlyReport:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: !Sub "konductor-domain-count-reporter"
            Description: Publishes the domain-count counter for the capacity alarm

  DomainCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DomainCountReporterLogGroup
      FilterPattern: '{ $.fields.message = "domain count report" }'
      MetricTransformations:
        - MetricName: DomainCount
          MetricNamespace: Konductor/DomainManagement
          MetricValue: "$.fields.count"

  DomainCountCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-domain-count-capacity-alarm"
      AlarmDescription: Domain count above 80% of the 1,000-domain registration ceiling — clean up stale domains and confirm EventBridge schema/bus quota headroom before the next onboarding wave
      Namespace: Konductor/DomainManagement
      MetricName: DomainCount
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 800
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SubscriptionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-subscriptions"
      RetentionInDays: 30

  SubscriptionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SubscriptionsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-subscriptions"
      CodeUri: ./event-streams/functions/subscriptions
      Handler: bootstrap
      Environment:
        Variables:
          ACTIVATE_SUBSCRIPTION_STATE_MACHINE_ARN: !Ref ActivateSubscriptionWorkflow
          REMOVE_SUBSCRIPTION_STATE_MACHINE_ARN: !Ref RemoveSubscriptionWorkflow
          MATERIALIZE_FUNCTION_ARN: !GetAtt MaterializeSubscriptionEnvFunction.Arn
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
      Policies:
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !Sub "${EventStreamsTable.Arn}/index/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt KonductorEventBus.Arn
            - Effect: Allow
              Action: [events:EnableRule, events:DisableRule]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
            # Heal path: enabling a per-env FAILED entry re-invokes the
            # same per-env materialization unit the activation workflow runs.
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt MaterializeSubscriptionEnvFunction.Arn
            - Effect: Allow
              Action: [states:StartExecution]
              Resource:
                - !Ref ActivateSubscriptionWorkflow
                - !Ref RemoveSubscriptionWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt SubscriptionsQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SubscriptionsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Per-Environment Subscription Materialization ----
  # Invoked by the activation workflow (one Map iteration per producer
  # environment) and by the promotion extender. Owns the per-env unit of
  # work: resolve latest version, fail-closed coverage re-check, rule
  # upsert, consumer-bus target, zero-events alarm, per-env record merge.

  MaterializeSubscriptionEnvLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-materialize-subscription-env"
      RetentionInDays: 30

  MaterializeSubscriptionEnvFunction:
    Type: AWS::Serverless::Function
    DependsOn: MaterializeSubscriptionEnvLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-materialize-subscription-env"
      CodeUri: ./event-streams/functions/materialize-subscription-env
      Handler: bootstrap
      Environment:
        Variables:
          ORGANIZATION: !Ref Organization
          EVENT_STREAMS_TABLE: !Ref EventStreamsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          SUBSCRIPTION_DELIVERY_ROLE_ARN: !GetAtt SubscriptionDeliveryRole.Arn
          PLATFORM_ACCOUNT_ID: !Ref AWS::AccountId
      Policies:
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt EventStreamsTable.Arn
            - Effect: Allow
              Action: [schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
            - Effect: Allow
              Action: [events:DescribeRule, events:PutRule, events:PutTargets]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
            - Effect: Allow
              Action: [iam:PassRole]
              Resource: !GetAtt SubscriptionDeliveryRole.Arn
              Condition:
                StringEquals:
                  "iam:PassedToService": events.amazonaws.com
            - Effect: Allow
              Action: [cloudwatch:PutMetricAlarm]
              Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-*"

  # ---- Promotion-Following Subscription Extender ----
  # A schema arriving in a new producer environment extends every ACTIVE
  # subscription on it whose record still awaits that environment.
  SubscriptionExtenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-subscription-extender"
      RetentionInDays: 30

  SubscriptionExtenderFunction:
    Type: AWS::Serverless::Function
    DependsOn: SubscriptionExtenderLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-subscription-extender"
      CodeUri: ./event-streams/functions/subscription-extender
      Handler: bootstrap
      Environment:
        Variables:
          EVENT_STREAMS_TABLE: !Ref EventStreamsTable
          DOMAINS_TABLE: !Ref DomainsTable
          MATERIALIZE_FUNCTION_ARN: !GetAtt MaterializeSubscriptionEnvFunction.Arn
          KONDUKTOR_EVENT_BUS: !GetAtt KonductorEventBus.Arn
          ENVIRONMENTS: !Join [",", !Ref Environments]
          REPIN_STATE_MACHINE_ARN: !Ref RepinSchemaEnvWorkflow
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt EventStreamsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            # Extension materializes through the shared per-env function,
            # which holds the rule/alarm/registry permissions itself.
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt MaterializeSubscriptionEnvFunction.Arn
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt KonductorEventBus.Arn
            # An append in the authoring environment advances that
            # environment's pins via the re-pin workflow (idempotent on the
            # per-version execution name).
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref RepinSchemaEnvWorkflow

  SchemaVersionPublishedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "konductor-schema-version-published"
      EventBusName: !Ref KonductorEventBus
      EventPattern:
        detail-type:
          - SchemaVersionPublished
        source:
          - konductor.schema-management
      Targets:
        - Id: SubscriptionExtenderTarget
          Arn: !GetAtt SubscriptionExtenderFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleFailureDlq.Arn

  SchemaVersionPublishedRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubscriptionExtenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchemaVersionPublishedRule.Arn

  # ---- Publish Consumer (delivery-only) ----
  # Admission (authorization, schema resolution, payload validation) happens
  # synchronously in PublishEventsAdmissionFunction; this consumer stamps the
  # admission-resolved version and delivers to the domain bus.
  PublishEventsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-publish-events"
      RetentionInDays: 30
  PublishEventsFunction:
    Type: AWS::Serverless::Function
    DependsOn: PublishEventsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-publish-events"
      CodeUri: ./event-streams/functions/publish-events
      Handler: bootstrap
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt PublishQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PublishQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Publish Admission (validate at the edge) ----
  PublishEventsAdmissionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-publish-events-admission"
      RetentionInDays: 30
  PublishEventsAdmissionFunction:
    Type: AWS::Serverless::Function
    DependsOn: PublishEventsAdmissionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-publish-events-admission"
      CodeUri: ./event-streams/functions/publish-events-admission
      Handler: bootstrap
      # Caps admission concurrency so a publish surge cannot exhaust account
      # Lambda concurrency or hammer the Schemas API; 100 is generous for the
      # hot path given cache-served publishes complete in single-digit ms.
      ReservedConcurrentExecutions: 100
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          PUBLISH_QUEUE_URL: !Ref PublishQueue
          SCHEMA_CACHE_TTL_MS: "60000"
          METADATA_TABLE: !Ref MetadataConfigurationTable
      Policies:
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        - !Ref MetadataPointerReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt PublishQueue.Arn
      Events:
        OAuthPublish:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /publish
            Method: POST
        IamPublish:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /publish
            Method: POST

  # Admission 503s mean publishers cannot ingest (registry outage, unusable
  # stored schema, or queue failure) — any occurrence warrants investigation.
  PublishAdmissionUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref PublishEventsAdmissionLogGroup
      FilterPattern: '{ $.fields.metric = "PublishUnavailable" }'
      MetricTransformations:
        - MetricName: PublishAdmissionUnavailable
          MetricNamespace: Konductor/EventStreams
          MetricValue: "1"

  PublishAdmissionUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-publish-admission-unavailable-alarm"
      AlarmDescription: Publish admission is returning 503 — ingest is degraded
      Namespace: Konductor/EventStreams
      MetricName: PublishAdmissionUnavailable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---- Publisher Schema Administration (append-only) ----
  SchemaAdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-schema-admin"
      RetentionInDays: 30
  SchemaAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: SchemaAdminLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-schema-admin"
      CodeUri: ./event-streams/functions/schema-admin
      Handler: bootstrap
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          SCHEMA_VERSIONS_TABLE: !Ref SchemaVersionsTable
          KONDUKTOR_EVENT_BUS: !GetAtt KonductorEventBus.Arn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt SchemaVersionsTable.Arn
            - Effect: Allow
              Action: [schemas:CreateSchema, schemas:UpdateSchema, schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
            # Promotion signal: every committed registry write announces
            # itself; the promotion extender subscribes (follow-schema-promotion).
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt KonductorEventBus.Arn
      Events:
        OAuthCreateSchema:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas
            Method: POST
        IamCreateSchema:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas
            Method: POST
        OAuthAppendSchemaVersion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/versions
            Method: POST
        IamAppendSchemaVersion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/versions
            Method: POST

  # ---- Schema promotion request API ----
  # Accepts and reports promotions; its only commit is the conditional
  # PROMOTION head-item put, and every downstream effect rides the promotions
  # table stream (side-effects rubric: docs/development/side-effects/schemas.md).
  SchemaPromotionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-schema-promotions"
      RetentionInDays: 30
  SchemaPromotionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SchemaPromotionsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-schema-promotions"
      CodeUri: ./event-streams/functions/schema-promotions
      Handler: bootstrap
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          PROMOTIONS_TABLE: !Ref SchemaPromotionsTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - !Ref BindingsTableReadPolicy
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt SchemaPromotionsTable.Arn
            # Source-registry existence and latest-version reads.
            - Effect: Allow
              Action: [schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
      Events:
        OAuthRequestPromotion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/promotions
            Method: POST
        IamRequestPromotion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/promotions
            Method: POST
        OAuthGetPromotion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /schemas/promotions
            Method: GET
        IamGetPromotion:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorIamApi
            Path: /schemas/promotions
            Method: GET

  # ---- Schema promotion stream consumer ----
  # Watches the promotions table: a VALIDATING INSERT starts the promotion
  # workflow (execution name is the idempotency key), MODIFY transitions emit
  # lifecycle events. REPIN items are filtered at the event source.
  SchemaPromotionStreamLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-schema-promotion-stream"
      RetentionInDays: 30

  SchemaPromotionStreamFunction:
    Type: AWS::Serverless::Function
    DependsOn: SchemaPromotionStreamLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-schema-promotion-stream"
      CodeUri: ./event-streams/functions/schema-promotion-stream
      Handler: bootstrap
      Environment:
        Variables:
          PROMOTE_STATE_MACHINE_ARN: !Ref PromoteSchemaWorkflow
          KONDUKTOR_EVENT_BUS: !Ref KonductorEventBus
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref PromoteSchemaWorkflow
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt KonductorEventBus.Arn
      Events:
        PromotionsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt SchemaPromotionsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb": {"NewImage": {"sk": {"S": ["PROMOTION"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt SchemaPromotionStreamDlq.Arn

  SchemaPromotionStreamDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-schema-promotion-stream-dlq"

  SchemaPromotionStreamDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-schema-promotion-stream-dlq-depth-alarm"
      AlarmDescription: Promotion stream records permanently failed — redrive after fixing the cause; promotions stall until then
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SchemaPromotionStreamDlq.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SchemaPromotionStreamIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-schema-promotion-stream-iterator-age-alarm"
      AlarmDescription: Promotion stream consumer falling behind — workflow starts and lifecycle events delayed; recover before the 24-hour stream window closes
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchemaPromotionStreamFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---- System events (platform -> domain notifications) ----
  # The event-streams table projects committed upgrade snapshots onto a
  # platform-owned system bus. The registry holds the versioned public
  # contracts (registered by the bootstrap custom resource at deploy time),
  # the archive keeps an audit-only copy for 90 days, and undeliverable
  # stream payloads land in the failure bucket for manual recovery.
  # The router (recipient fan-out) attaches to the bus separately.
  SystemEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${Organization}-konductor-system-bus"

  SystemEventBusArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub "${Organization}-konductor-system-events-archive"
      SourceArn: !GetAtt SystemEventBus.Arn
      Description: Audit-only capture of konductor.system events; no replay procedure (MVP)
      RetentionDays: 90

  SystemSchemaRegistry:
    Type: AWS::EventSchemas::Registry
    # Registries containing schemas cannot be deleted by CloudFormation;
    # retaining avoids a stuck stack delete. Teardown removes it explicitly.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RegistryName: !Sub "${Organization}-konductor-system-schemas"
      Description: Versioned public system-event contracts (source konductor.system)

  SystemSchemaBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-system-schema-bootstrap"
      RetentionInDays: 30

  SystemSchemaBootstrapFunction:
    Type: AWS::Serverless::Function
    DependsOn: SystemSchemaBootstrapLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-system-schema-bootstrap"
      CodeUri: ./event-streams/functions/system-schema-bootstrap
      Handler: bootstrap
      Timeout: 60
      Environment:
        Variables:
          # Not !Ref SystemSchemaRegistry: that Ref is the registry ARN, and
          # the bootstrap (and its IAM resources below) need the name. The
          # name is deterministic, matching RegistryName below.
          SYSTEM_SCHEMA_REGISTRY: !Sub "${Organization}-konductor-system-schemas"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [schemas:DescribeSchema]
              Resource: !Sub "arn:${AWS::Partition}:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-konductor-system-schemas/*"
            - Effect: Allow
              Action: [schemas:CreateSchema, schemas:UpdateSchema]
              Resource: !Sub "arn:${AWS::Partition}:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-konductor-system-schemas/*"

  SystemSchemaBootstrap:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: SystemSchemaRegistry
    Properties:
      ServiceToken: !GetAtt SystemSchemaBootstrapFunction.Arn

  SystemEventProjectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-system-event-projector"
      RetentionInDays: 30

  SystemEventProjectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: SystemEventProjectorLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-system-event-projector"
      CodeUri: ./event-streams/functions/system-event-projector
      Handler: bootstrap
      Environment:
        Variables:
          SYSTEM_EVENT_BUS: !Ref SystemEventBus
          ORGANIZATION: !Ref Organization
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt SystemEventBus.Arn
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !GetAtt EventStreamsTable.StreamArn
            - Effect: Allow
              # Bucket-level read: Lambda requires s3:ListBucket on the
              # on-failure destination bucket when it creates the event
              # source mapping, or the whole stack create fails.
              Action: [s3:ListBucket]
              Resource: !GetAtt SystemEventProjectorFailureBucket.Arn
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${SystemEventProjectorFailureBucket.Arn}/*"

  # Explicit mapping (not the SAM DynamoDB shorthand) because the on-failure
  # destination is S3: payloads that survive bounded retries land there for
  # recovery, with bisect and partial-batch reporting enabled.
  SystemEventProjectorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: SystemSchemaBootstrap
    Properties:
      FunctionName: !Ref SystemEventProjectorFunction
      EventSourceArn: !GetAtt EventStreamsTable.StreamArn
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      FunctionResponseTypes:
        - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt SystemEventProjectorFailureBucket.Arn

  SystemEventProjectorFailureBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No ${Organization} prefix: the configuration contract allows 43-char
      # orgs, and any org-prefixed pattern with account + region appended
      # would exceed S3's 63-character name limit. Account + region keep the
      # name globally unique without the org.
      BucketName: !Sub "konductor-system-event-failures-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-failed-payloads
            Status: Enabled
            ExpirationInDays: 90

  SystemEventProjectorIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-system-event-projector-iterator-age-alarm"
      AlarmDescription: System event projector falling behind — upgrade notifications delayed; recover before the 24-hour stream window closes
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref SystemEventProjectorFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SystemEventProjectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-system-event-projector-errors-alarm"
      AlarmDescription: System event projector invocations failing — retries and bisect are in progress; check the failure bucket for permanently undeliverable payloads
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SystemEventProjectorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SystemEventRouterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-system-event-router"
      RetentionInDays: 30

  SystemEventRouterFunction:
    Type: AWS::Serverless::Function
    DependsOn: SystemEventRouterLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-system-event-router"
      CodeUri: ./event-streams/functions/system-event-router
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          ORGANIZATION: !Ref Organization
          PLATFORM_PARTITION: !Ref "AWS::Partition"
          PLATFORM_ACCOUNT_ID: !Ref "AWS::AccountId"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              # UpdateItem stamps the console freshness marker (latest-event
              # timestamp/type), conditional on a newer value.
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Organization}-*-system-events"

  # One rule for every domain: the projector emits one recipient-scoped event
  # per affected subscription, so routing never fans out per domain and the
  # rule count stays constant as domains are added.
  SystemEventRoutingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "konductor-system-event-routing"
      EventBusName: !Ref SystemEventBus
      EventPattern:
        source:
          - konductor.system
        detail-type:
          - SubscriptionUpgradeStarted
          - SubscriptionUpgraded
      Targets:
        - Arn: !GetAtt SystemEventRouterFunction.Arn
          Id: system-event-router
          DeadLetterConfig:
            Arn: !GetAtt SystemEventTargetDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  SystemEventRouterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SystemEventRouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SystemEventRoutingRule.Arn

  # Shared target-invocation DLQ for system-event rule targets: 14-day SQS
  # retention (the service maximum). Distinct from the projector's Lambda
  # on-failure S3 destination, which covers stream-processing failures.
  SystemEventTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "konductor-system-events-target-dlq"
      MessageRetentionPeriod: 1209600

  SystemEventTargetDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "konductor-system-events-target-dlq-depth-alarm"
      AlarmDescription: System event target invocations failed after retries — redrive to the router after fixing the cause; messages expire after 14 days
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SystemEventTargetDlq.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---- System event emails (optional, SES) ----
  # Human-readable upgrade emails ride the same events as machine delivery but
  # are fully independent of it: everything here is conditioned on
  # NotificationsEnabled, while topics/routing deploy unconditionally.
  SystemEventNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-system-event-notifier"
      RetentionInDays: 30

  SystemEventNotifierFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SystemEventNotifierLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-system-event-notifier"
      CodeUri: ./event-streams/functions/system-event-notifier
      Handler: bootstrap
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
          DOMAINS_TABLE: !Ref DomainsTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  # Consumer-facing emails: only promotion-triggered events (authoring
  # re-pins stay silent). Filtering here keeps the notifier simple; the SNS
  # path is unaffected either way.
  SystemEventConsumerEmailRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "konductor-system-event-consumer-email"
      EventBusName: !Ref SystemEventBus
      EventPattern:
        source:
          - konductor.system
        detail-type:
          - SubscriptionUpgradeStarted
          - SubscriptionUpgraded
        detail:
          data:
            trigger:
              - PROMOTION
      Targets:
        - Arn: !GetAtt SystemEventNotifierFunction.Arn
          Id: system-event-notifier
          DeadLetterConfig:
            Arn: !GetAtt SystemEventTargetDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  SystemEventConsumerEmailRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SystemEventNotifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SystemEventConsumerEmailRule.Arn

  # Producer-facing email: the internal promotion-failure lifecycle event.
  SchemaPromotionFailedEmailRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "konductor-schema-promotion-failed-email"
      EventBusName: !Ref KonductorEventBus
      EventPattern:
        source:
          - konductor.schema-management
        detail-type:
          - SchemaPromotionFailed
      Targets:
        - Arn: !GetAtt SystemEventNotifierFunction.Arn
          Id: schema-promotion-failed-notifier
          DeadLetterConfig:
            Arn: !GetAtt SystemEventTargetDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  SchemaPromotionFailedEmailRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SystemEventNotifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchemaPromotionFailedEmailRule.Arn
  # ---- Schema promotion workflow steps ----
  # Invoked only by the promote-schema state machine: plan (prefix
  # verification), replay (single-version write + progress commit), widen and
  # narrow (REPIN item coordination + entry enumeration).
  SchemaPromotionStepsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-schema-promotion-steps"
      RetentionInDays: 30

  SchemaPromotionStepsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SchemaPromotionStepsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-schema-promotion-steps"
      CodeUri: ./event-streams/functions/schema-promotion-steps
      Handler: bootstrap
      Timeout: 120
      Environment:
        Variables:
          SCHEMA_VERSIONS_TABLE: !Ref SchemaVersionsTable
          PROMOTIONS_TABLE: !Ref SchemaPromotionsTable
          EVENT_STREAMS_TABLE: !Ref EventStreamsTable
          METADATA_TABLE: !Ref MetadataConfigurationTable
          SYSTEM_EVENT_EMISSION_ENABLED: !Ref SystemEventEmissionEnabled
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Progress commits and repin coordination are conditional writes
            # on the promotion head and REPIN items.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem]
              Resource: !GetAtt SchemaPromotionsTable.Arn
            # Replay reads the source version's content record and writes the
            # target's; plan repairs missing latest records.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt SchemaVersionsTable.Arn
            # Widen and narrow enumerate affected subscriptions on the
            # producer partition.
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt EventStreamsTable.Arn
            # Upgrade snapshots pin contract selectors to the environment's
            # active metadata revision.
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt MetadataConfigurationTable.Arn
            # Source reads and target writes, scoped to the org's registries.
            - Effect: Allow
              Action: [schemas:DescribeSchema, schemas:ListSchemaVersions]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
            # UpdateSchema appends; CreateSchema lands v1 on first arrival.
            - Effect: Allow
              Action: [schemas:UpdateSchema, schemas:CreateSchema]
              Resource: !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"

  # ---- Schema promotion workflow ----
  PromoteSchemaWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-promote-schema-workflow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  PromoteSchemaWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PromoteSchemaWorkflowPolicy
      Roles:
        - !Ref PromoteSchemaWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !GetAtt SchemaPromotionsTable.Arn
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt SchemaPromotionStepsFunction.Arn
              - !GetAtt MaterializeSubscriptionEnvFunction.Arn
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt KonductorEventBus.Arn

  PromoteSchemaWorkflow:
    Type: AWS::Serverless::StateMachine
    # The role's permissions live in a separate policy; without this ordering
    # the state machine can be created first and Step Functions rejects it.
    DependsOn: PromoteSchemaWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-promote-schema"
      Role: !GetAtt PromoteSchemaWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./event-streams/state-machines/promote-schema.asl.yaml
      DefinitionSubstitutions:
        PromotionsTable: !Ref SchemaPromotionsTable
        StepsFunctionArn: !GetAtt SchemaPromotionStepsFunction.Arn
        MaterializeEnvFunctionArn: !GetAtt MaterializeSubscriptionEnvFunction.Arn
        KonductorEventBus: !GetAtt KonductorEventBus.Arn
        DrainSeconds: !Ref SchemaRepinDrainSeconds
  # ---- Authoring-environment re-pin workflow ----
  # A schema append in the first configured environment triggers this (from
  # the subscription extender) to advance that environment's pins with the
  # same widen/drain/narrow discipline a promotion uses.
  RepinSchemaEnvWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "konductor-repin-schema-env-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  RepinSchemaEnvWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: RepinSchemaEnvWorkflowPolicy
      Roles:
        - !Ref RepinSchemaEnvWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt SchemaPromotionStepsFunction.Arn
              - !GetAtt MaterializeSubscriptionEnvFunction.Arn

  RepinSchemaEnvWorkflow:
    Type: AWS::Serverless::StateMachine
    DependsOn: RepinSchemaEnvWorkflowPolicy
    Properties:
      Type: STANDARD
      Name: !Sub "konductor-repin-schema-env"
      Role: !GetAtt RepinSchemaEnvWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./event-streams/state-machines/repin-schema-env.asl.yaml
      DefinitionSubstitutions:
        StepsFunctionArn: !GetAtt SchemaPromotionStepsFunction.Arn
        MaterializeEnvFunctionArn: !GetAtt MaterializeSubscriptionEnvFunction.Arn
        DrainSeconds: !Ref SchemaRepinDrainSeconds

  # ---- Metadata configuration bootstrap ----
  # Deployment-time custom resource: conditionally seeds revision 1 (the
  # protected-defaults baseline), the revision head, and every configured
  # environment at legacy revision 0. Every write is conditioned on absence,
  # so retries and redeployments never overwrite committed configuration,
  # and stack deletion removes nothing.
  MetadataBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-metadata-bootstrap"
      RetentionInDays: 30
  MetadataBootstrapFunction:
    Type: AWS::Serverless::Function
    DependsOn: MetadataBootstrapLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-metadata-bootstrap"
      CodeUri: ./event-streams/functions/metadata-bootstrap
      Handler: bootstrap
      Timeout: 60
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataConfigurationTable
          ENVIRONMENTS: !Join [",", !Ref Environments]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt MetadataConfigurationTable.Arn
  MetadataBootstrap:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt MetadataBootstrapFunction.Arn

  # ---- Metadata administration API ----
  # Revision history reads (admin/auditor) and one conditional transaction
  # per revision creation. OAuth-only routes are wired in the API definition;
  # this surface is an intentional IAM-parity exception, like binding
  # administration.
  MetadataAdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-metadata-admin"
      RetentionInDays: 30
  MetadataAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: MetadataAdminLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-metadata-admin"
      CodeUri: ./event-streams/functions/metadata-admin
      Handler: bootstrap
      Timeout: 29
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataConfigurationTable
          ORGANIZATION: !Ref Organization
          ENVIRONMENTS: !Join [",", !Ref Environments]
      Policies:
        - !Ref MetadataAdminPolicy
      Events:
        ListMetadataRevisions:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/revisions
            Method: GET
        CreateMetadataRevision:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/revisions
            Method: POST
        GetMetadataRevision:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/revisions/{revision}
            Method: GET
        PreviewMetadataRevision:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/preview
            Method: POST
        CheckMetadataReadiness:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/readiness
            Method: POST
        ListMetadataEnvironments:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/environments
            Method: GET
        ListMetadataActivations:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/activations
            Method: GET
        ActivateMetadataRevision:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /metadata/activations
            Method: POST

  MetadataStreamConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-metadata-stream-consumer"
      RetentionInDays: 30
  MetadataStreamConsumerFunction:
    Type: AWS::Serverless::Function
    DependsOn: MetadataStreamConsumerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-metadata-stream-consumer"
      CodeUri: ./control-plane/functions/metadata-stream-consumer
      Handler: bootstrap
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataConfigurationTable
          KONDUKTOR_EVENT_BUS: !Ref KonductorEventBus
      Policies:
        # Idempotency markers are conditional puts (and best-effort
        # releases) on the metadata table itself; lifecycle events publish
        # to the control-plane bus.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt MetadataConfigurationTable.Arn
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt KonductorEventBus.Arn
      Events:
        MetadataStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt MetadataConfigurationTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt LambdaFailureDlq.Arn

  # ---- Decide Registration Function ----
  DecideFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-decide-registration"
      RetentionInDays: 30

  DecideFunction:
    Type: AWS::Serverless::Function
    DependsOn: DecideFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-decide-registration"
      CodeUri: ./domain-management/functions/decide-registration
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          KONDUKTOR_EVENT_BUS: !Ref KonductorEventBus
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: "*"
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /domains/registrations/decide
            Method: POST

  # ---- Binding Administration (grant engine) ----
  BindingAdminFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-binding-admin"
      RetentionInDays: 30

  BindingAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: BindingAdminFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-binding-admin"
      CodeUri: ./control-plane/functions/binding-admin
      Handler: bootstrap
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        # TransactWriteItems additionally requires the permissions of every
        # action inside the transaction (PutItem for create+audit, DeleteItem
        # for revoke) — DynamoDB evaluates both the transact action and the
        # underlying item actions.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt AuthorizationBindingsTable.Arn
                - !Sub "${AuthorizationBindingsTable.Arn}/index/*"
      Events:
        CreateBinding:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /bindings
            Method: POST
        ListBindings:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /bindings
            Method: GET
        RevokeBinding:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /bindings/{bindingId}
            Method: DELETE

  # ---- Entitlement Administration (subscriber entitlements) ----
  EntitlementAdminFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-entitlement-admin"
      RetentionInDays: 30

  EntitlementAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: EntitlementAdminFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-entitlement-admin"
      CodeUri: ./control-plane/functions/entitlement-admin
      Handler: bootstrap
      Environment:
        Variables:
          BINDINGS_TABLE: !Ref AuthorizationBindingsTable
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        # TransactWriteItems additionally requires the permissions of every
        # action inside the transaction (PutItem for create+audit, DeleteItem
        # for revoke) — DynamoDB evaluates both the transact action and the
        # underlying item actions.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt AuthorizationEntitlementsTable.Arn
                - !Sub "${AuthorizationEntitlementsTable.Arn}/index/*"
        # Dual authorization reads caller role bindings via strongly
        # consistent point gets on the bindings table keys.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt AuthorizationBindingsTable.Arn
      Events:
        CreateEntitlement:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /entitlements
            Method: POST
        ListEntitlements:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /entitlements
            Method: GET
        RevokeEntitlement:
          Type: Api
          Properties:
            RestApiId: !Ref KonductorOAuthApi
            Path: /entitlements/{entitlementId}
            Method: DELETE

  # ---- Entitlement Revocation Transport (stream consumer) ----
  EntitlementStreamConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-entitlement-stream-consumer"
      RetentionInDays: 30

  EntitlementStreamConsumerFunction:
    Type: AWS::Serverless::Function
    DependsOn: EntitlementStreamConsumerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-entitlement-stream-consumer"
      CodeUri: ./control-plane/functions/entitlement-stream-consumer
      Handler: bootstrap
      Environment:
        Variables:
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
          REVOCATION_QUEUE_URL: !Ref EntitlementRevocationQueue
      Policies:
        # Idempotency markers are conditional puts (and best-effort releases)
        # on the entitlements table itself.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt AuthorizationEntitlementsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt EntitlementRevocationQueue.Arn
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt KonductorEventBus.Arn
      Events:
        EntitlementsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AuthorizationEntitlementsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt LambdaFailureDlq.Arn

  # ---- Entitlement Revocation Worker ----
  EntitlementRevocationWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-entitlement-revocation-worker"
      RetentionInDays: 30

  EntitlementRevocationWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn: EntitlementRevocationWorkerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-entitlement-revocation-worker"
      CodeUri: ./control-plane/functions/entitlement-revocation-worker
      Handler: bootstrap
      Timeout: 120
      Environment:
        Variables:
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
      Policies:
        # Coverage re-evaluation is the same strongly consistent
        # consumer-partition query the grant engine performs.
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            # Candidate queries run on the event-streams table's producer
            # partition; disablement flips the per-env desired state only.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !Sub "${EventStreamsTable.Arn}/index/*"
            # Revocation disables Konductor-managed rules; it never deletes them
            # and never touches consumer-side integration rules.
            - Effect: Allow
              Action:
                - events:DisableRule
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt EntitlementRevocationQueue.Arn
      Events:
        RevocationQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EntitlementRevocationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Entitlement Coverage Sweep (hourly reconciliation backstop) ----
  EntitlementCoverageSweepLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/konductor-entitlement-coverage-sweep"
      RetentionInDays: 30

  EntitlementCoverageSweepFunction:
    Type: AWS::Serverless::Function
    DependsOn: EntitlementCoverageSweepLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "konductor-entitlement-coverage-sweep"
      CodeUri: ./control-plane/functions/entitlement-coverage-sweep
      Handler: bootstrap
      Timeout: 300
      Environment:
        Variables:
          ENTITLEMENTS_TABLE: !Ref AuthorizationEntitlementsTable
      Policies:
        - !Ref EntitlementsTableReadPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt EventStreamsTable.Arn
            - Effect: Allow
              Action:
                - events:DisableRule
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
      Events:
        HourlySweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: !Sub "konductor-entitlement-coverage-sweep"
            Description: Reconciliation backstop — disables subscriptions whose entitlement coverage lapsed

