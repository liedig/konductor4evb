version = 0.1

[default.validate.parameters]
template_file = "notifications-stack.yaml"

[default.deploy.parameters]
template_file = "notifications-stack.yaml"
stack_name = "konductor-notifications"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
tags = "Application=konductor Component=notifications auto-delete=no"
# Email parameters are supplied by `make deploy-notifications` from the
# NOTIFICATION_SENDER_EMAIL / PLATFORM_OPERATOR_EMAIL environment variables.
