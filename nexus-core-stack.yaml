AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EventBridge Nexus

Parameters:
  Environments:
    Type: CommaDelimitedList
    Default: "dev,staging,prod"
    Description: >
      Comma-delimited list of environments every approved domain will be
      provisioned into. Platform-team configured; domain requesters have no
      say. Each entry must match ^[a-z0-9][a-z0-9-]{0,31}$.
  Organization:
    Type: String
    Description: Organization identifier used in resource naming
  NamespacePattern:
    Type: String
    Default: "{org}-{env}-{domain}"
    Description: >
      Naming convention for domain resources (per-env buses, schema registries,
      DLQs, dashboards, alarms). Does not apply to Nexus platform resources,
      which use the fixed {org}-nexus-* pattern.
  AwsOrganizationArn:
    Type: String
    Description: >-
      ARN of the AWS Organization used for RAM sharing of domain namespaces
      (e.g., arn:aws:organizations::123456789012:organization/o-abc123).
      Distinct from the Organization parameter, which is the short org
      identifier used in Nexus resource naming.
  NotificationSenderEmail:
    Type: String
    Default: ""
    Description: Verified SES sender address used as the From on all Nexus notification emails. Leave empty to deploy without notification resources.
  PlatformOperatorEmail:
    Type: String
    Default: ""
    Description: Verified SES recipient that receives domain approval requests (the platform team inbox). Leave empty to deploy without notification resources.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENTS: !Join [",", !Ref Environments]
        ORGANIZATION: !Ref Organization
        NAMESPACE_PATTERN: !Ref NamespacePattern
        DOMAINS_TABLE: !Ref DomainsTable
        NEXUS_EVENT_BUS: !Ref NexusEventBus
        DOMAINS_COMMAND_QUEUE_URL: !Ref DomainsCommandQueue

Conditions:
  NotificationsEnabled: !Not [!Equals [!Ref NotificationSenderEmail, ""]]

Resources:
  # ---- EventBridge ----
  NexusEventBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "nexus-bus"

  # ---- DynamoDB ----
  DomainsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "nexus-domains"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: domainId
          AttributeType: S
        - AttributeName: domainName
          AttributeType: S
        - AttributeName: ownerAccountId
          AttributeType: S
        - AttributeName: status
          AttributeType: S

      KeySchema:
        - AttributeName: domainId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-name
          KeySchema:
            - AttributeName: domainName
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-owner
          KeySchema:
            - AttributeName: ownerAccountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  # ---- Dead Letter Queue (read Lambda functions) ----
  LambdaDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-lambda-dlq"
      MessageRetentionPeriod: 1209600

  # ---- Shared DLQ for EventBridge rule delivery failures ----
  EventBridgeRuleDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-eventbridge-rule-dlq"
      MessageRetentionPeriod: 1209600

  EventBridgeRuleDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeRuleDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeRuleDlq.Arn
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${NexusEventBus}/*"

  # ---- Command Queues ----
  DomainsCommandDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-domains-command-dlq"
      MessageRetentionPeriod: 1209600

  DomainsCommandQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-domains-command-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DomainsCommandDlq.Arn
        maxReceiveCount: 3

  # ---- CloudWatch Log Groups ----
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/nexus-api"
      RetentionInDays: 30

  ListDomainsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-list-domains"
      RetentionInDays: 30

  DescribeDomainLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-describe-domain"
      RetentionInDays: 30

  # ---- IAM ----
  # Dedicated trust-anchor role referenced by trust-stack.yaml NexusRoleArn parameter.
  # Not used as a Lambda execution role; cross-account provisioning is handled by Step Functions.
  NexusTrustAnchorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  NexusTrustAnchorPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CrossAccountAssumeRole
      Roles:
        - !Ref NexusTrustAnchorRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-nexus-trust-role"

  NexusApiSqsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-apigw-sqs-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole

  NexusApiSqsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SendToCommandQueues
      Roles:
        - !Ref NexusApiSqsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt DomainsCommandQueue.Arn

  # ---- API Gateway ----
  NexusApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "nexus-api"
      StageName: v1
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        DefaultAuthorizer: AWS_IAM
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi.yaml

  # ---- Domain Management Functions (Read) ----
  ListDomainsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListDomainsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-list-domains"
      CodeUri: ./domain-management/functions/list-domains
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains
            Method: GET

  DescribeDomainFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeDomainLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-describe-domain"
      CodeUri: ./domain-management/functions/describe-domain
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains/{domainId}
            Method: GET

  # ---- Command Handler Functions ----
  DomainRegistrationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-domain-registrations"
      RetentionInDays: 30

  DomainRegistrationsFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainRegistrationsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-domain-registrations"
      CodeUri: ./domain-management/functions/domain-registrations
      Handler: bootstrap
      Environment:
        Variables:
          APPROVAL_STATE_MACHINE_ARN: !Ref ApprovalWorkflow
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt NexusEventBus.Arn
            - Effect: Allow
              Action: [events:RemovePermission]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ApprovalWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt DomainsCommandQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DomainsCommandQueue.Arn
            BatchSize: 1

  # ---- Decide Registration Function ----
  DecideFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-decide-registration"
      RetentionInDays: 30

  DecideFunction:
    Type: AWS::Serverless::Function
    DependsOn: DecideFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-decide-registration"
      CodeUri: ./domain-management/functions/decide-registration
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          NEXUS_EVENT_BUS: !Ref NexusEventBus
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: "*"
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains/registrations/decide
            Method: POST
        ApiGet:
          Type: Api
          Properties:
            RestApiId: !Ref NexusApi
            Path: /domains/registrations/decide
            Method: GET

  # ---- Approval Notification Functions ----
  SendApprovalRequestNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-send-approval-request-notification"
      RetentionInDays: 30

  SendApprovalRequestNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendApprovalRequestNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-send-approval-request-notification"
      CodeUri: ./domain-management/functions/send-approval-request-notification
      Handler: bootstrap
      Environment:
        Variables:
          DOMAINS_TABLE: !Ref DomainsTable
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
          PLATFORM_OPERATOR_EMAIL: !Ref PlatformOperatorEmail
          DECIDE_ENDPOINT_URL: !Sub "https://${NexusApi}.execute-api.${AWS::Region}.amazonaws.com/v1/domains/registrations/decide"
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/by-owner"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  SendApprovalOutcomeNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-send-approval-outcome-notification"
      RetentionInDays: 30

  SendApprovalOutcomeNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendApprovalOutcomeNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-send-approval-outcome-notification"
      CodeUri: ./domain-management/functions/send-approval-outcome-notification
      Handler: bootstrap
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  SendRejectionOutcomeNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-send-rejection-outcome-notification"
      RetentionInDays: 30

  SendRejectionOutcomeNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendRejectionOutcomeNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-send-rejection-outcome-notification"
      CodeUri: ./domain-management/functions/send-rejection-outcome-notification
      Handler: bootstrap
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  SendProvisioningFailedNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: NotificationsEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-send-provisioning-failed-notification"
      RetentionInDays: 30

  SendProvisioningFailedNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: NotificationsEnabled
    DependsOn: SendProvisioningFailedNotificationFunctionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-send-provisioning-failed-notification"
      CodeUri: ./domain-management/functions/send-provisioning-failed-notification
      Handler: bootstrap
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
          DOMAINS_TABLE: !Ref DomainsTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  # ---- EventBridge Rules ----
  DomainRegistrationApprovedNotificationRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "nexus-domain-registration-approved-notification"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - DomainRegistrationApproved
        source:
          - nexus.domain-management
      Targets:
        - Id: SendApprovalOutcomeNotificationTarget
          Arn: !GetAtt SendApprovalOutcomeNotificationFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleDlq.Arn

  DomainRegistrationApprovedNotificationRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SendApprovalOutcomeNotificationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainRegistrationApprovedNotificationRule.Arn

  DomainRegistrationRejectedRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "nexus-domain-registration-rejected"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - DomainRegistrationRejected
        source:
          - nexus.domain-management
      Targets:
        - Id: SendRejectionNotificationTarget
          Arn: !GetAtt SendRejectionOutcomeNotificationFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleDlq.Arn

  DomainRegistrationRejectedRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SendRejectionOutcomeNotificationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainRegistrationRejectedRule.Arn

  DomainProvisioningFailedRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "nexus-domain-provisioning-failed"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - DomainProvisioningFailed
        source:
          - nexus.domain-management
      Targets:
        - Id: SendProvisioningFailedNotificationTarget
          Arn: !GetAtt SendProvisioningFailedNotificationFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleDlq.Arn

  DomainProvisioningFailedRulePermission:
    Type: AWS::Lambda::Permission
    Condition: NotificationsEnabled
    Properties:
      FunctionName: !Ref SendProvisioningFailedNotificationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainProvisioningFailedRule.Arn

  # ---- Step Functions ----
  ApprovalWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-approval-wf-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ApprovalWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ApprovalWorkflowPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt DomainsTable.Arn
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !GetAtt NexusEventBus.Arn
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  ApprovalWorkflowNotificationPolicy:
    Type: AWS::IAM::Policy
    Condition: NotificationsEnabled
    Properties:
      PolicyName: ApprovalWorkflowNotificationPolicy
      Roles:
        - !Ref ApprovalWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt SendApprovalRequestNotificationFunction.Arn

  ApprovalWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "nexus-domain-approval"
      Role: !GetAtt ApprovalWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/approval.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        NexusEventBus: !GetAtt NexusEventBus.Arn
        SendApprovalRequestNotificationFunction: !If
          - NotificationsEnabled
          - !GetAtt SendApprovalRequestNotificationFunction.Arn
          - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:notifications-disabled"

  ProvisioningWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-provisioning-wf-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  ProvisioningWorkflowPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProvisioningWorkflowPolicy
      Roles:
        - !Ref ProvisioningWorkflowRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:PutPermission
              - events:RemovePermission
              - events:PutEvents
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt NexusEventBus.Arn
          - Effect: Allow
            Action:
              - schemas:CreateRegistry
              - schemas:DeleteRegistry
              - schemas:PutResourcePolicy
            Resource: !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Organization}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutDashboard
              - cloudwatch:DeleteDashboards
            Resource: !Sub "arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Organization}-*"
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
            Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Organization}-*"
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt DomainsTable.Arn
              - !Sub "${DomainsTable.Arn}/index/by-owner"
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-nexus-trust-role"
          - Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:AddTagsToResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/namespace/*"
          - Effect: Allow
            Action:
              - ram:CreateResourceShare
              - ram:GetResourceShares
              - ram:AssociateResourceShare
              - ram:ListResources
            Resource: "*"
          - Effect: Allow
            Action:
              - states:StartExecution
              - states:DescribeExecution
              - states:StopExecution
            Resource: "*"
          - Effect: Allow
            Action:
              - events:PutTargets
              - events:PutRule
              - events:DescribeRule
            Resource: "*"
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"

  ProvisionEnvWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "nexus-provision-env"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/provision-env.asl.yaml
      DefinitionSubstitutions:
        Organization: !Ref Organization
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"

  DeprovisionEnvWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "nexus-deprovision-env"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/deprovision-env.asl.yaml
      DefinitionSubstitutions:
        Organization: !Ref Organization

  ProvisionDomainWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub "nexus-provision-domain"
      Role: !GetAtt ProvisioningWorkflowRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ./domain-management/state-machines/provision-domain.asl.yaml
      DefinitionSubstitutions:
        DomainsTable: !Ref DomainsTable
        NexusEventBus: !GetAtt NexusEventBus.Arn
        Organization: !Ref Organization
        "AWS::Region": !Ref "AWS::Region"
        "AWS::AccountId": !Ref "AWS::AccountId"
        AwsOrganizationArn: !Ref AwsOrganizationArn
        ProvisionEnvStateMachineArn: !Ref ProvisionEnvWorkflow
        DeprovisionEnvStateMachineArn: !Ref DeprovisionEnvWorkflow
      Events:
        DomainApproved:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NexusEventBus
            Pattern:
              detail-type:
                - DomainRegistrationApproved
              source:
                - nexus.domain-management
            DeadLetterConfig:
              Arn: !GetAtt EventBridgeRuleDlq.Arn

Outputs:
  ApiEndpoint:
    Description: EventBridge Nexus API endpoint
    Value: !Sub "https://${NexusApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  NexusEventBusArn:
    Description: EventBridge Nexus event bus ARN
    Value: !GetAtt NexusEventBus.Arn
  DomainsTableName:
    Description: Domains DynamoDB table name
    Value: !Ref DomainsTable
  NexusFunctionRoleArn:
    Description: Trust-anchor role ARN (pass as NexusRoleArn to trust-stack.yaml)
    Value: !GetAtt NexusTrustAnchorRole.Arn
  ProvisioningWorkflowRoleArn:
    Description: Provisioning workflow role ARN (pass as ProvisioningWorkflowRoleArn to trust-stack.yaml)
    Value: !GetAtt ProvisioningWorkflowRole.Arn
  LambdaDlqUrl:
    Description: Lambda Dead Letter Queue URL for monitoring failed async invocations
    Value: !Ref LambdaDlq
