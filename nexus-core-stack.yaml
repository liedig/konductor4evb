  DomainRegistrationFailedRule:
    Type: AWS::Events::Rule
    Condition: NotificationsEnabled
    Properties:
      Name: !Sub "nexus-domain-registration-failed"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - RegisterDomainFailed
        source:
