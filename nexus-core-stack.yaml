      Name: !Sub "nexus-domain-approval-notification-failed"
      EventBusName: !Ref NexusEventBus
      EventPattern:
        detail-type:
          - DomainApprovalNotificationFailed
        source:
          - nexus.domain-management
      Targets:
        - Id: SendRegistrationDelayedNotificationTarget
          Arn: !GetAtt SendRegistrationDelayedNotificationFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeRuleFailureDlq.Arn

  DomainApprovalNotificationFailedRulePermission:
    Type: AWS::Lambda::Permission
