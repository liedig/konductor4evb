AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EventBridge Nexus

Parameters:
  Environments:
    Type: CommaDelimitedList
    Default: "dev,staging,prod"
    Description: >
      Comma-delimited list of environments every approved domain will be
      provisioned into. Platform-team configured; domain requesters have no
      say. Each entry must match ^[a-z0-9][a-z0-9-]{0,31}$.
  Organization:
    Type: String
    Description: Organization identifier used in resource naming
  NamespacePattern:
    Type: String
    Default: "{org}-{env}-{domain}"
    Description: >
      Naming convention for domain resources (per-env buses, schema registries,
      DLQs, dashboards, alarms). Does not apply to Nexus platform resources,
      which use the fixed {org}-nexus-* pattern.
  AwsOrganizationArn:
    Type: String
    Description: >-
      ARN of the AWS Organization used for RAM sharing of domain namespaces
      (e.g., arn:aws:organizations::123456789012:organization/o-abc123).
      Distinct from the Organization parameter, which is the short org
      identifier used in Nexus resource naming.
  NotificationSenderEmail:
    Type: String
    Default: ""
    Description: Verified SES sender address used as the From on all Nexus notification emails. Both this and PlatformOperatorEmail must be non-empty to deploy notification resources.
  PlatformOperatorEmail:
    Type: String
    Default: ""
    Description: Verified SES recipient that receives domain approval requests and lifecycle event notifications (the platform team inbox). Both this and NotificationSenderEmail must be non-empty to deploy notification resources.

  AccessTokenValidityMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: >
      Bounded Cognito access-token lifetime (minutes) for the interactive OAuth
      client. Offline JWT validation cannot revoke an already-issued token, so
      stale access ends no later than this many minutes after issue.
  OAuthCallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/callback"
    Description: >
      Allowed OAuth redirect (callback) URLs for the interactive app client.
      Must be HTTPS in non-local deployments.
  OAuthLogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/logout"
    Description: >
      Allowed OAuth sign-out (logout) URLs for the interactive app client.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENTS: !Join [",", !Ref Environments]
        ORGANIZATION: !Ref Organization
        NAMESPACE_PATTERN: !Ref NamespacePattern
        DOMAINS_TABLE: !Ref DomainsTable
        EVENT_STREAMS_TABLE: !Ref EventStreamsTable
        NEXUS_EVENT_BUS: !Ref NexusEventBus
        DOMAIN_REGISTRATIONS_QUEUE_URL: !Ref DomainRegistrationsQueue

Conditions:
  NotificationsEnabled:
    Fn::And:
      - !Not [!Equals [!Ref NotificationSenderEmail, ""]]
      - !Not [!Equals [!Ref PlatformOperatorEmail, ""]]

Resources:
  # ---- EventBridge ----
  NexusEventBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "nexus-bus"

  # ---- DynamoDB ----
  DomainsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "nexus-domains"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: domainName
          AttributeType: S
        - AttributeName: ownerAccountId
          AttributeType: S
        - AttributeName: status
          AttributeType: S

      KeySchema:
        - AttributeName: domainName
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-owner
          KeySchema:
            - AttributeName: ownerAccountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  # ---- DynamoDB (event streams) ----
  # Source of intent for subscriptions; EventBridge rules are the materialization.
  EventStreamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "nexus-event-streams"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: producerDomain
          AttributeType: S
        - AttributeName: schemaConsumer
          AttributeType: S
        - AttributeName: consumerDomain
          AttributeType: S
      KeySchema:
        - AttributeName: producerDomain
          KeyType: HASH
        - AttributeName: schemaConsumer
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-consumer
          KeySchema:
            - AttributeName: consumerDomain
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---- Dead Letter Queue (read Lambda functions) ----
  LambdaFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-lambda-failure-dlq"
      MessageRetentionPeriod: 1209600

  # ---- Shared DLQ for EventBridge rule delivery failures ----
  EventBridgeRuleFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-eventbridge-rule-failure-dlq"
      MessageRetentionPeriod: 1209600

  EventBridgeRuleFailureDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeRuleFailureDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeRuleFailureDlq.Arn
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${NexusEventBus}/*"

  # ---- Command Queues ----
  DomainRegistrationsDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-domain-registrations-dlq"
      MessageRetentionPeriod: 1209600

  DomainRegistrationsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-domain-registrations-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DomainRegistrationsDlq.Arn
        maxReceiveCount: 3

  SubscriptionsDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-subscriptions-dlq"
      MessageRetentionPeriod: 1209600

  SubscriptionsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub "nexus-subscriptions-queue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SubscriptionsDlq.Arn
        maxReceiveCount: 3

  SubscriptionsDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "nexus-subscriptions-dlq-depth-alarm"
      AlarmDescription: Subscription commands accumulating in the DLQ — inspect and replay
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SubscriptionsDlq.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---- CloudWatch Log Groups ----
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/nexus-api"
      RetentionInDays: 30

  ListDomainsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-list-domains"
      RetentionInDays: 30

  DescribeDomainLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-describe-domain"
      RetentionInDays: 30

  # ---- IAM ----
  # Dedicated trust-anchor role referenced by trust-stack.yaml NexusRoleArn parameter.
  # Not used as a Lambda execution role; cross-account provisioning is handled by Step Functions.
  NexusTrustAnchorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  NexusTrustAnchorPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CrossAccountAssumeRole
      Roles:
        - !Ref NexusTrustAnchorRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub "arn:aws:iam::*:role/${Organization}-nexus-trust-role"

  NexusApiSqsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-apigw-sqs-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole

  NexusApiSqsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SendToDomainRegistrations
      Roles:
        - !Ref NexusApiSqsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt DomainRegistrationsQueue.Arn
              - !GetAtt SubscriptionsQueue.Arn

  # Assumed by EventBridge to deliver matched events onto consumer app-side
  # buses cross-account, under the provision-time resource policy on those buses.
  SubscriptionDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nexus-subscription-delivery-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole

  SubscriptionDeliveryPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DeliverToAppBuses
      Roles:
        - !Ref SubscriptionDeliveryRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource: !Sub "arn:aws:events:${AWS::Region}:*:event-bus/${Organization}-*"

  # ---- API Gateway ----
  IamApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/nexus-iam-api"
      RetentionInDays: 30

  NexusOAuthApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "nexus-NexusOAuthApi"
      StageName: v1
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Auth:
        DefaultAuthorizer: OAuthRequestAuthorizer
        Authorizers:
          OAuthRequestAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !GetAtt OAuthAuthorizerFunction.Arn
            AuthorizerResultTtlInSeconds: 0
            Identity:
              Header: Authorization
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi-oauth.yaml

  NexusIamApi:
    Type: AWS::Serverless::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "nexus-NexusIamApi"
      StageName: v1
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt IamApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Auth:
        DefaultAuthorizer: AWS_IAM
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./api/openapi-iam.yaml

  # ---- Cognito Identity (interactive OAuth foundation) ----
  NexusUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Organization}-nexus-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  NexusUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${Organization}-nexus-${AWS::AccountId}"
      UserPoolId: !Ref NexusUserPool

  NexusUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref NexusUserPool
      ClientName: !Sub "${Organization}-nexus-control-plane"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref OAuthCallbackUrls
      LogoutURLs: !Ref OAuthLogoutUrls
      AccessTokenValidity: !Ref AccessTokenValidityMinutes
      IdTokenValidity: !Ref AccessTokenValidityMinutes
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  NexusPlatformAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: platform-admin
      UserPoolId: !Ref NexusUserPool
      Description: Platform administrators (global role; may administer domains and approve registrations)

  NexusPlatformAuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: platform-auditor
      UserPoolId: !Ref NexusUserPool
      Description: Platform auditors (global read-only role; cannot mutate or approve)

  OAuthAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-oauth-authorizer"
      RetentionInDays: 30

  OAuthAuthorizerFunction:
    Type: AWS::Serverless::Function
    DependsOn: OAuthAuthorizerLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-oauth-authorizer"
      CodeUri: ./control-plane/functions/oauth-authorizer
      Handler: bootstrap
      Description: REQUEST authorizer validating Cognito access tokens for the interactive OAuth control-plane API
      Environment:
        Variables:
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${NexusUserPool}"
          COGNITO_CLIENT_ID: !Ref NexusUserPoolClient
          COGNITO_JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${NexusUserPool}/.well-known/jwks.json"

  # ---- Domain Management Functions (Read) ----
  ListDomainsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListDomainsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-list-domains"
      CodeUri: ./domain-management/functions/list-domains
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /domains
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /domains
            Method: GET

  DescribeDomainFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeDomainLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-describe-domain"
      CodeUri: ./domain-management/functions/describe-domain
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /domains/{domainName}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /domains/{domainName}
            Method: GET

  # ---- Event Stream Functions (Read) ----
  ListSubscriptionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-list-subscriptions"
      RetentionInDays: 30

  ListSubscriptionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListSubscriptionsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-list-subscriptions"
      CodeUri: ./event-streams/functions/list-subscriptions
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !Sub "${EventStreamsTable.Arn}/index/*"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt DomainsTable.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /subscriptions
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /subscriptions
            Method: GET

  DescribeSubscriptionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-describe-subscription"
      RetentionInDays: 30

  DescribeSubscriptionFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeSubscriptionLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-describe-subscription"
      CodeUri: ./event-streams/functions/describe-subscription
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !GetAtt DomainsTable.Arn
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /subscriptions/{subscriptionId}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /subscriptions/{subscriptionId}
            Method: GET

  ListSchemasLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-list-schemas"
      RetentionInDays: 30

  ListSchemasFunction:
    Type: AWS::Serverless::Function
    DependsOn: ListSchemasLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-list-schemas"
      CodeUri: ./event-streams/functions/list-schemas
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [schemas:ListSchemas, schemas:ListSchemaVersions, schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /schemas
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /schemas
            Method: GET

  DescribeSchemaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-describe-schema"
      RetentionInDays: 30

  DescribeSchemaFunction:
    Type: AWS::Serverless::Function
    DependsOn: DescribeSchemaLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-describe-schema"
      CodeUri: ./event-streams/functions/describe-schema
      Handler: bootstrap
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaFailureDlq.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [schemas:ListSchemaVersions, schemas:DescribeSchema]
              Resource:
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:registry/${Organization}-*"
                - !Sub "arn:aws:schemas:${AWS::Region}:${AWS::AccountId}:schema/${Organization}-*"
      Events:
        OAuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusOAuthApi
            Path: /schemas/{schemaName}
            Method: GET
        IamApi:
          Type: Api
          Properties:
            RestApiId: !Ref NexusIamApi
            Path: /schemas/{schemaName}
            Method: GET

  # ---- Command Handler Functions ----
  DomainRegistrationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-domain-registrations"
      RetentionInDays: 30

  DomainRegistrationsFunction:
    Type: AWS::Serverless::Function
    DependsOn: DomainRegistrationsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-domain-registrations"
      CodeUri: ./domain-management/functions/domain-registrations
      Handler: bootstrap
      Environment:
        Variables:
          APPROVAL_STATE_MACHINE_ARN: !Ref ApprovalWorkflow
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DomainsTable.Arn
                - !Sub "${DomainsTable.Arn}/index/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt NexusEventBus.Arn
            - Effect: Allow
              Action: [events:RemovePermission]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Organization}-*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ApprovalWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt DomainRegistrationsQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DomainRegistrationsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SubscriptionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/nexus-subscriptions"
      RetentionInDays: 30

  SubscriptionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SubscriptionsLogGroup
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub "nexus-subscriptions"
      CodeUri: ./event-streams/functions/subscriptions
      Handler: bootstrap
      Environment:
        Variables:
          ACTIVATE_SUBSCRIPTION_STATE_MACHINE_ARN: !Ref ActivateSubscriptionWorkflow
          REMOVE_SUBSCRIPTION_STATE_MACHINE_ARN: !Ref RemoveSubscriptionWorkflow
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt DomainsTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt EventStreamsTable.Arn
                - !Sub "${EventStreamsTable.Arn}/index/*"
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt NexusEventBus.Arn
            - Effect: Allow
              Action: [events:EnableRule, events:DisableRule]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Organization}-*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource:
                - !Ref ActivateSubscriptionWorkflow
                - !Ref RemoveSubscriptionWorkflow
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt SubscriptionsQueue.Arn
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SubscriptionsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

