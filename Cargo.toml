[workspace]
resolver = "2"
members = [
    "lib/nexus-common",
    "domain-management/functions/decide-registration",
    "domain-management/functions/describe-domain",
    "domain-management/functions/domain-command-handler",
    "domain-management/functions/list-domains",
    "domain-management/functions/send-approval-notification",
    "domain-management/functions/send-rejection-notification",
]

[workspace.dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", features = ["test-util"] }
aws-sdk-eventbridge = { version = "1", features = ["test-util"] }
aws-sdk-sesv2 = { version = "1", features = ["test-util"] }
aws-sdk-sfn = { version = "1", features = ["test-util"] }
aws-sdk-sqs = "1"
aws-sdk-sts = "1"
aws-sdk-schemas = "1"
aws-sdk-cloudwatch = "1"
chrono = { version = "0.4", features = ["serde"] }
lambda_runtime = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-smithy-mocks = "0.2"
uuid = { version = "1", features = ["v4"] }
