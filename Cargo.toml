[workspace]
resolver = "2"
members = [
    "lib/konductor-common",
    "domain-management/functions/decide-registration",
    "domain-management/functions/describe-domain",
    "domain-management/functions/domain-count-reporter",
    "domain-management/functions/domain-registrations",
    "domain-management/functions/domain-state",
    "domain-management/functions/finalize-approval",
    "domain-management/functions/list-domains",
    "domain-management/functions/pending-registrations",
    "domain-management/functions/send-approval-outcome-notification",
    "domain-management/functions/send-approval-request-notification",
    "domain-management/functions/send-provisioning-failed-notification",
    "domain-management/functions/send-provisioning-succeeded-notification",
    "domain-management/functions/send-registration-delayed-notification",
    "domain-management/functions/send-registration-failed-notification",
    "domain-management/functions/send-rejection-outcome-notification",
    "event-streams/functions/publish-events",
    "event-streams/functions/publish-events-admission",
    "event-streams/functions/schema-admin",
    "event-streams/functions/subscriptions",
    "event-streams/functions/materialize-subscription-env",
    "event-streams/functions/subscription-extender",
    "event-streams/functions/list-subscriptions",
    "event-streams/functions/describe-subscription",
    "event-streams/functions/list-schemas",
    "event-streams/functions/describe-schema",
    "event-streams/functions/metadata-bootstrap",
    "event-streams/functions/metadata-admin",
    "control-plane/functions/oauth-authorizer",
    "control-plane/functions/binding-admin",
    "control-plane/functions/entitlement-admin",
    "control-plane/functions/entitlement-coverage-sweep",
    "control-plane/functions/entitlement-revocation-worker",
    "control-plane/functions/entitlement-stream-consumer",
    "control-plane/functions/metadata-stream-consumer",
    "control-plane/functions/grant-benchmark",
    "control-plane/functions/metadata-benchmark",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sfn = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-schemas = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
sha2 = "0.11"
aws-sdk-cloudwatch = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
lambda_runtime = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-smithy-mocks = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
urlencoding = "2"
jsonschema = { version = "0.37", default-features = false }

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
type_complexity = "warn"

# Dev builds need enough debug info for readable panic backtraces, not full
# DWARF: line tables only for workspace crates, none for dependencies.
# This roughly halves the target/ directory for this workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# Strip debug info from deployed Lambda binaries (smaller zip, no runtime cost).
[profile.release]
strip = "debuginfo"
