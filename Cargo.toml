[workspace]
resolver = "2"
members = [
    "lib/nexus-common",
    "domain-management/functions/decide-registration",
    "domain-management/functions/describe-domain",
    "domain-management/functions/domain-registrations",
    "domain-management/functions/list-domains",
    "domain-management/functions/send-approval-outcome-notification",
    "domain-management/functions/send-approval-request-notification",
    "domain-management/functions/send-provisioning-failed-notification",
    "domain-management/functions/send-provisioning-succeeded-notification",
    "domain-management/functions/send-registration-delayed-notification",
    "domain-management/functions/send-registration-failed-notification",
    "domain-management/functions/send-rejection-outcome-notification",
    "event-streams/functions/subscriptions",
    "event-streams/functions/list-subscriptions",
    "event-streams/functions/describe-subscription",
    "event-streams/functions/list-schemas",
    "event-streams/functions/describe-schema",
    "control-plane/functions/oauth-authorizer",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", features = ["test-util"] }
aws-sdk-eventbridge = { version = "1", features = ["test-util"] }
aws-sdk-sesv2 = { version = "1", features = ["test-util"] }
aws-sdk-sfn = { version = "1", features = ["test-util"] }
aws-sdk-sqs = "1"
aws-sdk-sts = "1"
aws-sdk-schemas = "1"
aws-sdk-cloudwatch = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
lambda_runtime = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-smithy-mocks = "0.2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
type_complexity = "warn"
