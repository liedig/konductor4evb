[workspace]
resolver = "2"
members = [
    "lib/control-plane-common",
    "domain-management/functions/domain-command-handler",
    "domain-management/functions/registration-command-handler",
    "domain-management/functions/list-domains",
    "domain-management/functions/describe-domain",
    "domain-management/functions/list-pending-activations",
]

[workspace.dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eventbridge = "1"
aws-sdk-sfn = "1"
aws-sdk-sqs = "1"
aws-sdk-sts = "1"
aws-sdk-schemas = "1"
aws-sdk-cloudwatch = "1"
chrono = { version = "0.4", features = ["serde"] }
lambda_runtime = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
