AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EventBridge Nexus Trust Stack.
  Deploy this template in each application account to allow the Nexus
  to create and manage domain resources (event buses, DLQs) in this account.
  One trust role serves all environments of all domains in the account.

Parameters:
  NexusRoleArn:
    Type: String
    Description: ARN of the Nexus execution role in the platform account (from Nexus stack outputs)
  ProvisioningWorkflowRoleArn:
    Type: String
    Description: ARN of the provisioning workflow role in the platform account (from Nexus stack outputs)
  Organization:
    Type: String
    Description: Organization identifier (must match Nexus configuration)

Resources:
  NexusTrustRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-nexus-trust-role"
      # Principal is the platform account root, constrained to the exact platform
      # roles via aws:PrincipalArn. Role-ARN principals are pinned to IAM unique
      # ids at save time and die when the platform stack is redeployed; the
      # condition is string-matched per request and survives role recreation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${PlatformAccountId}:root"
                - PlatformAccountId: !Select [4, !Split [":", !Ref NexusRoleArn]]
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  - !Ref NexusRoleArn
                  - !Ref ProvisioningWorkflowRoleArn

  NexusTrustEventBusPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EventBusManagement
      Roles:
        - !Ref NexusTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:PutPermission
              - events:RemovePermission
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:event-bus/${Organization}-*"

  NexusTrustDlqPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DlqManagement
      Roles:
        - !Ref NexusTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource:
              - !Sub "arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:${Organization}-*"

  NexusTrustBusToBusRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BusToBusRoleManagement
      Roles:
        - !Ref NexusTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Organization}-*-b2b-*"

Outputs:
  TrustRoleArn:
    Description: ARN of the trust role for the Nexus
    Value: !GetAtt NexusTrustRole.Arn
  TrustRoleName:
    Description: Name of the trust role
    Value: !Ref NexusTrustRole
