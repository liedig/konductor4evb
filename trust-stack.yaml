AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EventBridge Konductor Trust Stack.
  Deploy this template in each application account to allow the Konductor
  to create and manage domain resources (event buses, DLQs) in this account.
  One trust role serves all environments of all domains in the account.

Parameters:
  KonductorRoleArn:
    Type: String
    Description: ARN of the Konductor execution role in the platform account (from Konductor stack outputs)
  ProvisioningWorkflowRoleArn:
    Type: String
    Description: ARN of the provisioning workflow role in the platform account (from Konductor stack outputs)
  RetagWorkflowRoleArn:
    Type: String
    Description: ARN of the cost-center retag workflow role in the platform account (from Konductor stack outputs)
  Organization:
    Type: String
    Description: Organization identifier (must match Konductor configuration)

Resources:
  KonductorTrustRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Organization}-konductor-trust-role"
      # Principal is the platform account root, constrained to the exact platform
      # roles via aws:PrincipalArn. Role-ARN principals are pinned to IAM unique
      # ids at save time and die when the platform stack is redeployed; the
      # condition is string-matched per request and survives role recreation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${PlatformAccountId}:root"
                - PlatformAccountId: !Select [4, !Split [":", !Ref KonductorRoleArn]]
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  - !Ref KonductorRoleArn
                  - !Ref ProvisioningWorkflowRoleArn
                  - !Ref RetagWorkflowRoleArn

  KonductorTrustEventBusPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EventBusManagement
      Roles:
        - !Ref KonductorTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:PutPermission
              - events:RemovePermission
              - events:TagResource
              - events:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:event-bus/${Organization}-*"

  KonductorTrustDlqPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DlqManagement
      Roles:
        - !Ref KonductorTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:TagQueue
              - sqs:UntagQueue
            Resource:
              - !Sub "arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:${Organization}-*"

  KonductorTrustBusToBusRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BusToBusRoleManagement
      Roles:
        - !Ref KonductorTrustRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Organization}-*-b2b-*"

Outputs:
  TrustRoleArn:
    Description: ARN of the trust role for the Konductor
    Value: !GetAtt KonductorTrustRole.Arn
  TrustRoleName:
    Description: Name of the trust role
    Value: !Ref KonductorTrustRole
